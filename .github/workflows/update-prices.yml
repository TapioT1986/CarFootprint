name: Update prices

# Statistics Finland publishes monthly fuel (khi/11xx) and electricity
# (ehi/13rb) prices a few weeks after each month ends. This runs on the 5th of
# every month, fetches the latest figures and rebuilds the page. When nothing
# has changed, nothing is committed. Can also be started by hand from the
# Actions tab.
on:
  schedule:
    - cron: "0 5 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices from Statistics Finland
        run: python tools/update_prices.py

      - name: Rebuild the page
        run: python tools/build.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/prices.json index.html; then
            echo "Prices unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json index.html
          git commit -m "Update fuel and electricity prices from Statistics Finland"
          git push
