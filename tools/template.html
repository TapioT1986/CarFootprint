<style>
/* Layout: tienvarsi – syötteet vasemmalla kapeana sarakkeena, tulokset leveänä oikealla; puhelimella pinossa */
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#16202a; --muted:#5b6873; --line:#d3dadf;
  --accent:#0b5cad;            /* tienviittojen sininen */
  --accent-ink:#ffffff;
  --input:#f6f8f9;
  --c1:#0b5cad; --c2:#d9822b; --c3:#2e8b57; --c4:#8a4fbf;
  --seg-dep:#16202a; --seg-cap:#6c7a86; --seg-en:#d9822b; --seg-oth:#b8c2ca;
  --seg-drive:#5a6b2f; --seg-make:#a9b98a;
  --good:#2e8b57; --warn:#b45309;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e7edf2; --muted:#9aa8b4; --line:#2b3742;
  --accent:#4d9be6; --accent-ink:#06121e; --input:#121a21;
  --c1:#4d9be6; --c2:#f0a050; --c3:#4cc28a; --c4:#b78ae6;
  --seg-dep:#e7edf2; --seg-cap:#8b99a5; --seg-en:#f0a050; --seg-oth:#4a5966;
  --seg-drive:#a9c46a; --seg-make:#5d6d3c; --good:#4cc28a; --warn:#f0a050; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e7edf2; --muted:#9aa8b4; --line:#2b3742;
  --accent:#4d9be6; --accent-ink:#06121e; --input:#121a21;
  --c1:#4d9be6; --c2:#f0a050; --c3:#4cc28a; --c4:#b78ae6;
  --seg-dep:#e7edf2; --seg-cap:#8b99a5; --seg-en:#f0a050; --seg-oth:#4a5966;
  --seg-drive:#a9c46a; --seg-make:#5d6d3c; --good:#4cc28a; --warn:#f0a050; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:28px 20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.sign{width:44px;height:44px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 22px/1 var(--display);flex:none}
.brand h1{font-size:34px;line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.top .meta{color:var(--muted);font-size:13px;max-width:46ch}

.grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel+.panel{margin-top:16px}
.panel h2{font-size:20px;margin-bottom:12px}
.label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.unit{font-size:12px;color:var(--muted)}
input[aria-invalid="true"]{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.errmsg{font-size:12.5px;line-height:1.35;color:var(--warn);font-weight:600}

.km{display:flex;flex-direction:column;gap:6px}
.km .read{display:flex;align-items:baseline;gap:8px}
.odo{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:.04em}
.kmin{width:7.2ch;padding:2px 6px;font-size:30px}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:500 12.5px/1 var(--body);border:1px solid var(--line);background:var(--input);color:var(--ink);padding:6px 9px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}

details.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.adv summary{cursor:pointer;font-weight:600;font-size:14px}
details.adv .fields{margin-top:10px}

/* autot */
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.car{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:4px solid var(--cc)}
.car .head{display:flex;align-items:center;gap:8px;min-height:44px}
.car .head .label{flex:1;margin:0}
.car .cname{flex:1;font-size:16px;overflow-wrap:anywhere}
.car .nameed{flex:1;font-weight:600}
.car .ren{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:6px}
.car .ren:hover{color:var(--accent)}
.mine{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.minebtn{font:600 13.5px var(--body);border:1px dashed var(--line);background:none;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer}
.minebtn[aria-pressed="true"]{border:1px solid var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.badge.mineb{border-color:var(--accent);color:var(--accent)}
.sub.vsm{color:var(--ink);font-weight:600}
.pickwrap input{font-weight:600}
.pickwrap input::placeholder{font-weight:400}
.car .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:6px}
.car .x:hover{color:var(--ink);background:var(--input)}
.car .fields{gap:9px}
/* Mallihaun ehdotuslista: oma lista, koska selaimen datalist näkyy osassa puhelimia läpinäkyvänä */
.pickwrap{position:relative}
.pickbox{position:relative} /* ehdotuslista avautuu heti kentän alle, ohjetekstin päälle */
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.22);max-height:min(50vh,320px);overflow-y:auto;overscroll-behavior:contain;padding:4px}
.sugg[hidden]{display:none}
.sugg button{display:block;width:100%;text-align:left;padding:9px 10px;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;border-radius:6px;cursor:pointer}
.sugg button:hover,.sugg button[aria-selected="true"]{background:var(--input)}
.sugg .none{padding:9px 10px;color:var(--muted);font-size:14px}
.addcar{border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font:600 15px var(--body);cursor:pointer;min-height:120px}
.addcar:hover{border-color:var(--accent);color:var(--accent)}
.tag{font-size:11.5px;color:var(--muted)}
.insp{display:block;margin-top:6px;font-size:11.5px;color:var(--muted);line-height:1.45}
.insp:empty{display:none}
.insp b{font-weight:600;color:var(--ink)}

/* tulokset */
section.results{margin-top:10px}
h2.step{display:flex;align-items:center;gap:10px;font-size:22px;margin:0 0 12px}
#resultsH{margin-top:26px}
.stepn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 16px/1 var(--display);flex:none}
.phead h2{display:flex;align-items:center;gap:10px}
/* Kentät, jotka käyttäjän kannattaa täyttää: sininen reunus ja piste otsikossa (ei pelkkä väri) */
.reqhint{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.reqhint b{color:var(--accent)}
.req>.label::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.req input:not([type=range]){border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--input))}
.req .seg{border:1.5px solid var(--accent)}
/* Laskurin arvio (hinta, ikä, mittarilukema mallin mukaan): katkoviiva, kunnes käyttäjä kirjoittaa oman arvon */
.est input{border-style:dashed}
.estb{display:none;font:600 11.5px/1 var(--body);text-transform:none;letter-spacing:0;color:var(--muted);border:1px dashed currentColor;border-radius:999px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.est .estb{display:inline-block}
.evr{font-size:12.5px;line-height:1.45}
.q{font-size:12.5px;line-height:1.45;color:var(--muted)}
.q b{font-weight:600;color:var(--ink)}
.evr:empty{display:none}
.evr b{font-weight:600}
.evb{display:block;margin-top:4px;padding-left:8px;border-left:3px solid var(--warn)}
details.carmore{border-top:1px solid var(--line);padding-top:8px}
details.carmore>summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
details.carmore>summary .cc{font-weight:500;color:var(--muted);margin-left:6px}
details.carmore[open]>summary{margin-bottom:10px}
details.carmore .tag,details.carmore .insp{display:block;margin-top:10px}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sumd summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
.sumd .sub{margin-top:4px}
.sum .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.sum .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cc);flex:none}
.big{font:500 28px/1.1 var(--mono);font-variant-numeric:tabular-nums;border-radius:4px}
/* hetkellinen korostus, kun luku muuttuu */
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}
.big.flash{animation:flash 2.5s ease-out}
@media (prefers-reduced-motion:reduce){.big.flash{animation:none}}
.sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.mos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;margin:6px 0 4px}
.mos .mv{display:block;font:500 15px/1.25 var(--mono);font-variant-numeric:tabular-nums}
.mos .mv small{font:500 12px var(--body);color:var(--muted);white-space:nowrap}
.mos .ml{display:block;font-size:12px;line-height:1.3;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.badge.win{border-color:var(--good);color:var(--good)}
.badge.warn{border-color:var(--warn);color:var(--warn)}

.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:760px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.chart.wide{grid-column:1/-1}
.chart h3{font-size:19px}
.chart p.lead{margin:2px 0 10px;color:var(--muted);font-size:13.5px;max-width:70ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{font-family:var(--body)}
.svgbox{overflow-x:auto}

.notes{margin-top:24px;color:var(--muted);font-size:13px;max-width:90ch}
.notes h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.notes ul{padding-left:18px;margin:6px 0}
.notes a{color:var(--accent)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sharebar{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin:16px 0 4px;padding:12px 14px;border:1px solid var(--accent);border-radius:8px;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.sharebar .hint{margin:0;min-width:0;flex:1 1 220px}
.sharebar .shareinv{font-size:14px;color:var(--ink)}
.sharebar #shareMsg:empty{display:none}
.btn.share{display:inline-flex;align-items:center;gap:8px;font-size:16px;padding:11px 18px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.share:hover{filter:brightness(1.1)}
.btn.share svg{width:18px;height:18px;flex:none}
@media (max-width:560px){.btn.share{width:100%;justify-content:center}}
.sharelink{font-family:var(--mono);font-size:12px;margin-top:4px}
.btn{font:600 13.5px var(--body);border:1px solid var(--line);background:var(--input);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.sm{font-size:12.5px;padding:5px 9px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.phead h2{margin-bottom:0}
@media (prefers-reduced-motion:no-preference){.bar{transition:width .25s ease}}
/* Lisäasetukset: rahoitus ja energia yhdessä taitettavassa osiossa */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--input)}
.seg button{font:600 13.5px/1.25 var(--body);color:var(--ink);background:none;border:0;border-left:1px solid var(--line);padding:9px 6px;cursor:pointer;min-width:0}
.seg button:first-child{border-left:0}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
#payNote{margin-top:4px}
details.more>summary{cursor:pointer;list-style:none;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font:600 20px/1.2 var(--display)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin:0 2px 0 2px;flex:none}
details.more[open]>summary::before{transform:rotate(45deg)}
.morecount{font:600 12.5px/1 var(--body);color:var(--accent)}
.morecount:empty{display:none}
.morepart{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.morepart h2{font-size:18px;margin-bottom:12px}
/* Puhelimen tiivistelmäpalkki: autot ja €/v alareunassa, kunnes tulokset ovat ruudulla */
.dock{display:none}
@media (max-width:900px){
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;
    padding:9px max(14px,env(safe-area-inset-right,0px)) calc(9px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
    background:var(--surface);color:var(--ink);border:0;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.14);
    font:inherit;text-align:left;cursor:pointer}
  .dock.off{visibility:hidden;transform:translateY(110%)}
  body{padding-bottom:calc(var(--dockh,0px) + 48px)}
  html{scroll-padding-bottom:calc(var(--dockh,0px) + 12px)}
}
@media (max-width:900px) and (prefers-reduced-motion:no-preference){.dock{transition:transform .2s ease,visibility .2s}}
.dock .dc{min-width:0;border-left:3px solid var(--cc);padding-left:7px;display:flex;flex-direction:column;gap:1px}
.dock .dn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .dv{font:500 16px/1.2 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.dock .dv small{font:500 11.5px var(--body);color:var(--muted)}
.dock.n4{gap:7px}
.dock.n4 .dv{font-size:14px}
.dock.n4 .dv .yr{display:none}
.dock .db{font-size:10.5px;font-weight:600;color:var(--good);line-height:1.25}
.dock .db:empty{display:none}
.foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.foot a{color:var(--accent)}
.foot .feedback{margin:8px 0 0}
.disclaim{margin:10px 0 0}
.sens{margin:12px 0 0;font-size:14px;line-height:1.5;max-width:90ch}
.sens:empty{display:none}
details.info{margin:10px 0 0;font-size:13.5px;max-width:90ch}
details.info summary{cursor:pointer;color:var(--accent);font-weight:600}
details.info p,details.info ul{margin:8px 0}
details.info ul{padding-left:18px}
details.info a{color:var(--accent)}
.costs{margin:14px 0 4px}
.costs h3{font-size:19px}
.costs .lead{margin:2px 0 8px;color:var(--muted);font-size:13.5px;max-width:70ch}
.ctable{border-collapse:collapse;font-size:14px;width:100%;max-width:760px;table-layout:fixed}
.ctable th,.ctable td{padding:6px 6px 6px 0;border-bottom:1px solid var(--line);text-align:right;vertical-align:bottom;overflow-wrap:anywhere}
.ctable th[scope=row]{text-align:left;font-weight:500;width:34%}
.ctable thead th{font-weight:600;font-size:13px;line-height:1.25}
.ctable thead .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:4px}
.ctable td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ctable .src{font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap}
.ctable a.src{color:var(--accent)}
.ctable tr.sub1 th,.ctable tr.sub1 td{font-weight:700;border-bottom:2px solid var(--ink)}
.ctable th[scope=row]{overflow-wrap:normal;hyphens:auto}
/* Puhelin: rivin nimi omalle rivilleen, autojen luvut sen alle sarakkeisiin */
@media (max-width:560px){
  .ctable{font-size:13.5px;table-layout:auto}
  .ctable tr{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:6px}
  .ctable thead th:first-child{display:none}
  .ctable tbody th[scope=row]{grid-column:1/-1;width:auto;border:0;padding:8px 0 0;color:var(--muted)}
  .ctable td{padding:2px 0 6px}
  .ctable tr.sub1 th{border:0;color:var(--ink)}
}
.rtable{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%;max-width:640px}
.rtable th,.rtable td{text-align:left;padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.rtable th{font-weight:600;color:var(--muted)}
.rtable td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.rwrap{overflow-x:auto;max-width:100%}
@media (max-width:560px){.rtable{font-size:12px}.rtable td.n{font-size:11.5px}}
.topright{display:flex;flex-direction:column;gap:10px;align-items:flex-end;max-width:46ch}
.langs{display:flex;gap:6px}
.lang{padding:5px 10px;font-size:13px}
.lang[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:700px){.topright{align-items:flex-start}}
/* Puhelin: kosketusalue vähintään 44 px, otsikot ja ohjetekstit vähintään 13 px */
@media (max-width:900px){
  .chip,.btn,.btn.sm,.lang,.seg button{min-height:44px}
  .chip{font-size:14px;padding:0 14px}
  .btn.sm{font-size:13.5px;padding:0 12px}
  .car .x,.car .ren{min-width:44px;min-height:44px}
  .minebtn{min-height:44px;font-size:14px}
  input,select{min-height:44px}
  input[type=range]{min-height:32px}
  details summary{padding:10px 0;min-height:44px;box-sizing:border-box}
  .label{font-size:13px}
  .unit,.hint,.errmsg,.evr,.q{font-size:13.5px}
  .tag,.insp,.badge{font-size:13px}
  .estb{font-size:12px}
  .reqhint,.sub{font-size:14px}
  .mos .ml{font-size:13px}
  .mos .mv{font-size:17px}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="sign" aria-hidden="true">€</div>
      <div>
        <h1>CarFootprint</h1>
        <p data-i="tagline"></p>
      </div>
    </div>
    <div class="topright">
      <div class="meta" data-i="meta"></div>
      <div class="langs" role="group" aria-label="Kieli / Language">
        <button class="btn lang" id="langFi" type="button" data-lang="fi">Suomi</button>
        <button class="btn lang" id="langEn" type="button" data-lang="en">English</button>
      </div>
    </div>
  </header>

  <div class="grid">
    <aside>
      <div class="panel">
        <div class="phead"><h2><span class="stepn">1</span><span data-i="drive_h"></span></h2><button class="btn sm" type="button" data-reset data-i="reset"></button></div>
        <p class="reqhint" data-i="req_hint"></p>
        <div class="km req">
          <label class="label" id="kmLabel" for="km" data-i="km_label"></label>
          <div class="read"><input type="number" class="odo kmin" id="km" min="2000" max="50000" step="500" value="15000" inputmode="numeric"><span class="unit" data-i="km_unit"></span></div>
          <input type="range" id="kmSlider" min="2000" max="50000" step="500" value="15000" aria-labelledby="kmLabel">
          <div class="chips">
            <button class="chip" data-km="11800" type="button" data-i="chipB"></button>
            <button class="chip" data-km="14500" type="button" data-i="chipAll"></button>
            <button class="chip" data-km="20800" type="button" data-i="chipD"></button>
          </div>
          <p class="hint" data-i="km_hint"></p>
        </div>
        <div class="fields" style="margin-top:14px">
          <div class="field full"><label class="label" for="budget" data-i="budget_l"></label><input type="number" id="budget" min="0" step="500" value="12000"><span class="unit" data-i="budget_u"></span></div>
          <div class="field full"><span class="label" id="payLabel" data-i="pay_l"></span>
            <div class="seg" role="radiogroup" aria-labelledby="payLabel"><button type="button" role="radio" data-pay="cash" data-i="pay_cash"></button><button type="button" role="radio" data-pay="part" data-i="pay_part"></button><button type="button" role="radio" data-pay="loan" data-i="pay_loan"></button></div>
            <span class="unit" id="payNote"></span></div>
        </div>
      </div>

      <details class="panel more" id="more">
        <summary><span data-i="more_h"></span><span class="morecount" id="moreCount"></span></summary>
        <div class="morepart">
        <h2 data-i="own_h"></h2>
        <div class="fields">
          <div class="field full"><label class="label" for="years" data-i="years_l"></label><input type="number" id="years" min="1" max="20" step="1" value="5"><span class="unit" data-i="years_u"></span></div>
          <div class="field full"><label class="label" for="monthly" data-i="monthly_l"></label><input type="number" id="monthly" min="0" step="50" value="" placeholder="–"><span class="unit" data-i="monthly_u"></span></div>
        </div>
        </div>
        <div class="morepart">
        <h2 data-i="ins_h"></h2>
        <div class="fields">
          <div class="field full"><label class="label" for="insKind" data-i="ins_l"></label>
            <select id="insKind"><option value="full" selected data-i="ins_full"></option><option value="part" data-i="ins_part"></option><option value="none" data-i="ins_none"></option></select>
            <span class="unit" data-i="ins_u"></span></div>
        </div>
        <p class="hint" data-i="ins_src"></p>
        </div>
        <div class="morepart">
        <h2 data-i="fin_h"></h2>
        <div class="fields">
          <div class="field full"><label class="label" for="own" data-i="own_l"></label><input type="number" id="own" min="0" step="500" value="6000"><span class="unit" data-i="own_u"></span></div>
          <div class="field"><label class="label" for="loanRate" data-i="loanRate_l"></label><input type="number" id="loanRate" min="0" max="40" step="0.01" value="4.4"><span class="unit" data-i="loanRate_u"></span></div>
          <div class="field"><label class="label" for="loanFee" data-i="loanFee_l"></label><input type="number" id="loanFee" min="0" step="0.5" value="12.5"><span class="unit" data-i="loanFee_u"></span></div>
          <div class="field"><label class="label" for="loanYears" data-i="loanYears_l"></label><input type="number" id="loanYears" min="1" max="10" step="1" value="5"><span class="unit" data-i="years_u"></span></div>
          <div class="field"><label class="label" for="ownRate" data-i="ownRate_l"></label><input type="number" id="ownRate" min="0" max="20" step="0.01" value="2.48"><span class="unit" data-i="rate_u"></span></div>
        </div>
        <p class="hint" data-i="fin_hint"></p>
        </div>
        <div class="morepart">
        <h2 data-i="energy_h"></h2>
        <div class="fields">
          <div class="field"><label class="label" for="pBens" data-i="petrol"></label><input type="number" id="pBens" step="0.01" value="__P_PETROL__"><span class="unit">€ / l</span></div>
          <div class="field"><label class="label" for="pDies" data-i="diesel"></label><input type="number" id="pDies" step="0.01" value="__P_DIESEL__"><span class="unit">€ / l</span></div>
          <div class="field"><label class="label" for="pEl" data-i="el_home"></label><input type="number" id="pEl" step="0.001" value="__P_ELEC__"><span class="unit" data-i="el_home_u"></span></div>
          <div class="field"><label class="label" for="loss" data-i="loss"></label><input type="number" id="loss" step="1" value="10"><span class="unit" data-i="loss_u"></span></div>
          <div class="field full"><label class="label" for="elSrc" data-i="elsrc"></label>
            <select id="elSrc">
              <option value="42" data-i="el1"></option>
              <option value="12" data-i="el2"></option>
              <option value="12" data-i="el3"></option>
              <option value="24" data-i="el4"></option>
              <option value="48" data-i="el5"></option>
            </select>
            <span class="unit" data-i="el_note"></span>
          </div>
        </div>
        <p class="hint" data-i="prices_src"></p>
        <details class="adv">
          <summary data-i="ef_sum"></summary>
          <div class="fields">
            <div class="field"><label class="label" for="eBens" data-i="petrol"></label><input type="number" id="eBens" step="0.01" value="2.78"><span class="unit">kg CO₂e / l</span></div>
            <div class="field"><label class="label" for="eDies" data-i="diesel"></label><input type="number" id="eDies" step="0.01" value="3.32"><span class="unit">kg CO₂e / l</span></div>
          </div>
          <p class="hint" data-i="ef_hint"></p>
        </details>
        </div>
      </details>
    </aside>

    <main style="min-width:0">
      <h2 class="step"><span class="stepn">2</span><span data-i="step_cars"></span></h2>
      <div class="cars" id="cars"></div>

      <h2 class="step" id="resultsH"><span class="stepn">3</span><span data-i="step_res"></span></h2>
      <section class="results" aria-live="polite">
        <div class="sumrow" id="sums"></div>
        <p class="sens" id="sens"></p>
        <div class="costs" id="costs"></div>
        <details class="info" id="rangeInfo"><summary data-i="rng_sum"></summary><div id="rangeBody"></div></details>
        <p class="hint disclaim" data-i="disclaim"></p>
        <div class="sharebar"><button class="btn share" type="button" id="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span data-i="share"></span></button><span class="hint shareinv" data-i="share_inv"></span><span class="hint" id="shareMsg" role="status"></span></div>
        <div class="charts">
          <div class="chart">
            <h3 data-i="cost_h"></h3>
            <p class="lead" data-i="cost_lead"></p>
            <div class="legend"><span><i style="background:var(--seg-dep)"></i><span data-i="lg_dep"></span></span><span><i style="background:var(--seg-cap)"></i><span data-i="lg_cap"></span></span><span><i style="background:var(--seg-en)"></i><span data-i="lg_en"></span></span><span><i style="background:var(--seg-oth)"></i><span data-i="lg_oth"></span></span></div>
            <div class="svgbox" id="costChart"></div>
          </div>
          <div class="chart">
            <h3 data-i="em_h"></h3>
            <p class="lead" data-i="em_lead"></p>
            <div class="legend"><span><i style="background:var(--seg-drive)"></i><span data-i="lg_drive"></span></span><span><i style="background:var(--seg-make)"></i><span data-i="lg_make"></span></span></div>
            <div class="svgbox" id="emChart"></div>
          </div>
          <div class="chart wide">
            <h3 id="beTitle"></h3>
            <p class="lead" id="beLead"></p>
            <div class="svgbox" id="beChart"></div>
          </div>
        </div>
      </section>

      <div class="notes">
        <div class="rowbtns" style="margin:0 0 18px"><button class="btn" type="button" data-reset data-i="reset"></button></div>
        <h3 data-i="notes_h"></h3>
        <ul data-i="notes"></ul>
      </div>
    </main>
  </div>

  <button class="dock off" id="dock" type="button" aria-controls="sums"></button>

  <footer class="foot">
    <span data-i="foot"></span>
    <a href="https://github.com/TapioT1986/CarFootprint" target="_blank" rel="noopener">github.com/TapioT1986/CarFootprint</a>
    <p class="feedback" data-i="feedback"></p>
  </footer>
</div>

<script>
const BUILD = '__BUILD__'; // sivun versio (build.py), uuden version tunnistamiseen
const CATALOG = __CATALOG__;
const PRANGE = __PRANGE__; // energian hintojen vaihteluvälit (tools/update_prices.py, data/prices.json)

  rng:(a,b)=>`Energian hintojen vaihtelulla: ${a}–${b} € / v`, rng_sum:'Lisätietoja vaihteluväleistä',

  notes:`<li><b>Arvonalenema:</b> jäännösarvo = hinta × (1 − arvonalenema-%)<sup>vuodet</sup>. Jos jätät prosentin tyhjäksi, se valitaan auton keski-iän mukaan: alle 3 v 17 %, 3–5 v 10 %, 6–9 v 11 %, 10–19 v 12 %, 20 v tai yli 10 %. Prosentit on laskettu Verohallinnon verotusarvoista (<a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2024.xls" target="_blank" rel="noopener">2024</a>, <a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2025.xls" target="_blank" rel="noopener">2025</a>, <a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2026.xls" target="_blank" rel="noopener">2026</a>) (114 000 käytettynä tuotua autoa 2024–2026) vertaamalla saman mallin eri-ikäisiä autoja. Keskimääräistä suurempi ajomäärä (yli 15 000 km/v) laskee jäännösarvoa 0,2 % per 1 000 km vuodessa; tämä on oletus, jolle ei ole lähdettä. <b>Arvonalenema on mallien keskiarvo, ei yksittäisen auton ennuste:</b> auton kunto, huoltohistoria, varustelu, kysyntä ja sähköautossa akun kunto voivat muuttaa jälleenmyyntihintaa paljon kumpaan suuntaan tahansa. Kääntöpisteet tulosten alla kertovat, kuinka paljon arvonaleneman pitäisi muuttua, jotta halvin auto vaihtuu.</li>
<li><b>Esimerkkiautot</b> valitaan enimmäishinnan mukaan: bensiiniauto on aina Golf (Suomen yleisin keski-ikäinen auto), hybridi Toyota Corolla, Auris tai Yaris ja sähköauto rekisterissä yleisin malli, johon budjetti riittää. Kustakin valitaan nuorin vuosimalli, jonka arvioitu hinta mahtuu budjettiin. Hinta-arviot perustuvat Verohallinnon verotusarvoihin (<a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2025.xls" target="_blank" rel="noopener">2025</a>, <a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2026.xls" target="_blank" rel="noopener">2026</a>) ja mittarilukema mallin keskimääräiseen ajomäärään. Kun muutat esimerkkiautoa, se lakkaa seuraamasta budjettia.</li>
<li><b>Rahoitus:</b> se osa hinnasta, jota oma raha ja vaihtohyvitys eivät kata, rahoitetaan tasaerälainalla. Lainan kustannus on omistusaikana maksettu korko ja kuukausimaksut. Jos auto myydään ennen kuin laina on maksettu, loppu maksetaan myyntihinnasta. Lisäksi autoon sitoutuneelle omalle rahalle lasketaan menetetty tuotto. Enimmäishintaa kalliimmat autot merkitään.</li>
<li><b>Nykyinen autosi:</b> yhden auton voi merkitä nykyiseksi autoksi. Sen ostohinnaksi kirjoitetaan nykyinen arvo (paljonko saisit myymällä), ja laskelma olettaa, ettei autossa ole lainaa: arvo on omaa rahaa kiinni autossa, ja sen menetetty tuotto lasketaan kuten muillakin autoilla. Muiden autojen tuloskorteissa näkyy ero nykyiseen autoon euroina ja päästöinä vuodessa. Nykyinen auto ei vaihdu enimmäishinnan mukana. Kaikki tiedot tallentuvat vain tähän selaimeen; jakolinkki vie ne mukanaan vain, jos jaat sen itse.</li>
<li><b>Kaksi kuukausilukua</b> tuloskortissa: <i>todellinen kustannus</i> on vuosikustannus jaettuna kahdellatoista, ja <i>tililtä lähtee</i> on se, mitä tililtä lähtee kuukaudessa lainan aikana: lainaerä kuluineen sekä energia ja muut kulut (vero, vakuutus, huolto, renkaat) jaettuna kuukausille. Arvonalenema ja oman rahan menetetty tuotto ovat todellisia kuluja, mutta niistä ei tule kuukausittaista laskua, joten ne eivät ole mukana. Siksi tililtä lähtevä summa voi olla pienempi tai suurempi kuin todellinen kustannus. Vero, vakuutukset ja huolto laskutetaan todellisuudessa harvemmin, joten luku on kuukausien keskiarvo. Jos laina-aika on omistusaikaa lyhyempi, menot pienenevät lainan jälkeen. Yllättäviä korjauksia ei ole mukana. Käteisostossa kortti näyttää kertaostoon tarvittavan summan, osittain lainalla oman rahan ja lainan osuudet. Jos annat kuukausibudjetin (valinnainen), sen ylittävät autot merkitään.</li>
<li><b>Todellinen kulutus:</b> WLTP-arvo kerrotaan kertoimella, joka on mitattu autojen omista kulutusmittareista (luetaan mm. katsastuksissa). Kerroin on <b>mallikohtainen</b> 367 mallille; muille käytetään merkin tai käyttövoiman keskiarvoa, ja auton kortti kertoo kumman. Bensiiniautot kuluttavat keskimäärin 20 % ja dieselit 18 % yli WLTP:n, mutta mallien väliset erot ovat suuria. Luvut ovat koko EU:sta eivätkä huomioi Suomen talvea.</li>
<li><b>Vanhat autot (vuosimalli 2017 tai vanhempi):</b> niiden virallinen kulutus on mitattu vanhalla NEDC-testillä, joka aliarvioi kulutusta selvästi enemmän kuin WLTP. Laskuri käyttää mallin ja vuosimallin omaa NEDC-arvoa Traficomin rekisteristä ja lisää siihen <a href="https://theicct.org/publication/from-laboratory-to-road-a-2018-update/" target="_blank" rel="noopener">ICCT:n</a> mittaaman eron: 8 % vuoden 2001 autoissa, 38 % vuoden 2014 ja 40 % vuoden 2016 autoissa. Välivuodet on interpoloitu suoraviivaisesti.</li>
<li><b>Lataushybridit:</b> oletuskulutus on mallin oma mitattu keskiarvo, tai jos sitä ei ole, merkin keskiarvo. Koko EU:ssa se on 6,0 l/100 km, kun WLTP lupaa 1,4. Oletuksena 25 % ajosta kulkee sähköllä. Nosta osuutta, jos lataat ahkerasti.</li>
<li><b>Sähköautot:</b> kulutus on mallin WLTP-arvo EEA:n rekisteristä (Suomessa 2025 rekisteröidyt autot; jo myynnistä poistuneille malleille 2020–2022). Mitattua kulutusta ei kerätä täyssähköautoista, joten kerroin 1,20 on oletus. Akun kulumisesta laskuri ei lisää kulua: <a href="https://www.geotab.com/blog/ev-battery-health/" target="_blank" rel="noopener">Geotabin tutkimuksessa</a> (22 700 autoa) kapasiteetti laski keskimäärin 2,3 % vuodessa, kotona ladatuissa noin 1,5 % ja paljon pikaladatuissa noin 3 %. Kulunut akku lyhentää toimintamatkaa, mutta ei juuri lisää kulutusta. Akun vaihdoista ei löytynyt luotettavaa yleisyyslukua.</li>
<li><b>Huolto ja korjaukset</b> kasvavat ajokilometrien mukaan. Kentän arvo on vähän ajetun auton (alle 80 000 km) taso, ja se on karkea oletus. Kasvu perustuu <a href="https://advocacy.consumerreports.org/wp-content/uploads/2020/10/TCO-Fact-Sheet-Chapter-2-FINAL.pdf" target="_blank" rel="noopener">Consumer Reportsin</a> omistajakyselyihin (Yhdysvallat, 2020): 80 000–160 000 km ajetun polttomoottoriauton huolto ja korjaukset maksavat kilometriä kohden 2,1-kertaisesti ja sitä enemmän ajetun 2,8-kertaisesti. Sähköautoilla kertoimet ovat 2,3 ja 3,6, mutta lähtötaso on alle puolet polttomoottoriauton tasosta. Laskuri laskee kertoimen keskiarvona sille matkalle, jonka ajat omistusaikana; auton kortti näyttää sen. Lataushybrideille ja tavallisille hybrideille käytetään polttomoottoriauton kertoimia. Lähde on yhdysvaltalainen, joten euromäärät ovat laskurin omia ja vain kasvu on lähteestä. Saksalainen <a href="https://www.datgroup.com/fileadmin/at/DAT_Report/2025/DAT-Report-2025-Kurzbericht.pdf" target="_blank" rel="noopener">DAT-Report 2025</a> näyttää, että yli 6-vuotiaiden autojen omistajat käyttävät huoltoon jopa vähemmän kuin 3–6-vuotiaiden: vanhan auton omistaja usein säästää huolloista, mikä voi tulla myöhemmin kalliiksi.</li>
<li><b>Sähkön päästöt:</b> Suomen sähköntuotannon suorat päästöt 26 g/kWh vuonna 2025 (<a href="https://energia.fi/wp-content/uploads/2026/01/Sahkovuosi-2025_v1.pdf" target="_blank" rel="noopener">Energiateollisuus, Sähkövuosi 2025</a>; sama luku <a href="https://fingridlehti.fi/sahkon-paastojen-lasku-jatkuu/" target="_blank" rel="noopener">Fingridiltä</a>) + polttoaineiden tuotantoketju 16 g/kWh (<a href="https://doi.org/10.1016/j.trd.2017.07.012" target="_blank" rel="noopener">Moro ja Lonza 2018, EU:n JRC</a>; luku on tarkistettu vain toissijaisesta lähteestä). Tuotantotapojen elinkaariarvot (ydin- ja tuulisähkö 12, vesi 24, aurinko 48 g/kWh) ovat <a href="https://www.ipcc.ch/site/assets/uploads/2018/02/ipcc_wg3_ar5_annex-iii.pdf" target="_blank" rel="noopener">IPCC:n AR5-raportin liitteen III</a> mediaaneja. <a href="https://unece.org/sed/documents/2021/10/reports/life-cycle-assessment-electricity-generation-options" target="_blank" rel="noopener">UNECE:n 2021 elinkaariarvio</a> antaa ydin- ja tuulisähkölle pienempiä arvoja (noin 5–16 g/kWh); oletuksena on suurempi.</li>
<li><b>Lähteet:</b> malliluettelo ja CO₂-arvot <a href="https://avoindata.suomi.fi/data/fi/dataset/ajoneuvojen-avoin-data" target="_blank" rel="noopener">Traficomin avoimesta datasta</a> 30.6.2026, mitattu kulutus <a href="https://climate-energy.eea.europa.eu/topics/transport/real-world-emissions/additional_information" target="_blank" rel="noopener">EEA:n OBFCM-aineistosta</a> ja sähkönkulutus <a href="https://co2cars.apps.eea.europa.eu/" target="_blank" rel="noopener">EEA:n uusien autojen rekisteristä</a> (Suomessa 2020–2025 rekisteröidyt). Kaikki CC BY 4.0. Arvonalenema Verohallinnon verotusarvoista ja NEDC-korjaus ICCT:ltä. Koko laskentamalli ja käytetty data ovat <a href="https://github.com/TapioT1986/CarFootprint" target="_blank" rel="noopener">GitHubissa</a>.</li>
<li><b>Ajoneuvovero</b> lasketaan vuoden 2026 verotaulukoista (<a href="https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2024/814" target="_blank" rel="noopener">ajoneuvoverolaki, muutos 814/2024</a>). Perusvero määräytyy auton virallisen CO₂-päästön mukaan, ja se on 106–654 €/v. Päästö lasketaan mallin virallisesta kulutuksesta: vuosimallit 2017 ja vanhemmat NEDC-taulukolla 1, uudemmat WLTP-taulukolla 1 A. Sähköautoista, jotka on otettu käyttöön 1.10.2021 tai myöhemmin, perusvero on 171 €/v; laskuri pitää vuosimallia 2022 ja uudempia tällaisina. Lataushybridien perusvero on alin porras, koska niiden WLTP-päästö on lähes aina alle 103 g/km. Diesel-, sähkö- ja lataushybridiautoista maksetaan lisäksi käyttövoimaveroa: 5,5, 1,9 tai 0,95 senttiä päivässä jokaiselta kokonaismassan alkavalta 100 kg:lta. Kokonaismassa ei ole vielä malliluettelossa, joten se on oletus (diesel 2 000 kg, sähkö 2 200 kg, lataushybridi 2 300 kg). Oman auton kokonaismassa löytyy rekisteröintitodistuksesta, ja sen voi vaihtaa kohdassa Lisää oletuksia. <a href="https://www.edilex.fi/he/20260173" target="_blank" rel="noopener">Hallituksen esitys HE 173/2026</a> alentaisi verotaulukoilla 1 ja 2 verotettujen autojen (pääosin vähintään 10 vuotta vanhat polttomoottoriautot) perusveroa keskimäärin noin 6 €/v vuodesta 2028 alkaen. Esitys on vielä eduskunnan käsittelyssä, eikä sitä ole otettu huomioon.</li>
<li><b>Katsastus ja elinikä</b> (tietoa autokortilla, ei vaikuta laskelmaan) tulevat <a href="https://trafi2.stat.fi/PXWeb/pxweb/fi/TraFi/TraFi__Katsastuksen_vikatilastot/" target="_blank" rel="noopener">Traficomin katsastuksen vikatilastoista</a> (määräaikaiskatsastukset 2017–2025, avoin data CC BY 4.0). Traficom tilastoi mallisarjoittain, eli kaikki saman mallin käyttövoimat ja sukupolvet ovat yhdessä. Hylkäysprosentti on uusimmalta vuodelta auton ostoiän mukaan, tai lähimmältä iältä, josta on vähintään 50 katsastusta. Viat ovat hylkäykseen johtaneiden vikojen osuudet kaikista ikäluokista. Elinikä lasketaan katsastusmääristä: 10 vuoden iästä alkaen autot katsastetaan joka vuosi, joten saman vuoden autojen katsastusmäärä kertoo, montako on vielä liikenteessä. Ennen 10 vuoden ikää poistuneet autot (kolarit, vienti) eivät näy luvussa. Käytettynä tuodut autot kasvattavat lukuja, ja jos katsastusmäärät kasvavat iän mukana, elinikää ei arvioida. Kun yli puolet on vielä liikenteessä 20-vuotiaana, ikä, jossa puolet on poistunut, on arvio: vuosittainen poistumaosuus jatketaan suorana viivana iän 10–19 havainnoista. Kenttä Käyttöikä (päästöjen jakaminen) on edelleen oletus 18–20 vuotta.</li>
<li><b>Valmistuspäästöt</b> ovat <a href="https://theicct.org/publication/electric-cars-life-cycle-analysis-emissions-europe-jul25/" target="_blank" rel="noopener">ICCT:n</a> EU:n elinkaaritutkimuksesta (2025) keskikokoiselle autolle, kuten Golfille. Auton valmistus ja kierrätys ilman akkua: bensiini-, diesel- ja hybridiauto 8,2 t, lataushybridi 8,6 t ja sähköauto 7,5 t CO₂e. Akun valmistus on 72,8 kg CO₂e/kWh, kun painotetaan solujen valmistusmaita (30 % Eurooppa, 56 % Kiina). Oletusakku on EU:ssa 2023 myytyjen keskikokoisten autojen keskiarvo: sähköauto 53,4 kWh (3,9 t), lataushybridi 13,3 kWh (1,0 t). Akun koon voi vaihtaa oman auton mukaiseksi kohdassa Lisää oletuksia. Pienen auton valmistus tuottaa vähemmän ja ison enemmän päästöjä. Valmistuspäästöt jaetaan auton koko käyttöiälle. ICCT:n mukaan akut kestävät yleensä auton käyttöiän: alle 1 %:ssa vuoden 2016 jälkeen myydyistä sähköautoista akku on vaihdettu (Recurrent, 20 000 autoa; <a href="https://www.energy.gov/cmei/vehicles/articles/fotw-1339-april-22-2024-plug-electric-vehicle-battery-replacements-due" target="_blank" rel="noopener">Yhdysvaltain energiaministeriön mukaan</a> vuosimallien 2016–2023 vaihdot vikojen vuoksi selvästi alle 1 %).</li>
<li><b>Jaa vertailu</b> tekee lyhyen linkin, jossa on vain valitut mallit ja muutetut luvut; kaikki muu lasketaan avattaessa uudelleen. Tiedot ovat linkin #-merkin jälkeisessä osassa, jota selain ei lähetä palvelimelle, eikä sivu kerää mitään tietoa. Linkkiin tallentuvat vain muutetut asetukset, joten avaaja näkee ajantasaiset polttoaineen ja sähkön hinnat, ellet ole muuttanut niitä. Jaetun linkin avaaminen ei hävitä avaajan omia autoja: ne voi palauttaa.</li>
<li><b>Toimintasäde sähköllä</b> näkyy rekisteristä valituille sähköautoille ja lataushybrideille: virallinen WLTP-toimintasäde on Suomessa 2025 rekisteröityjen saman mallin autojen mediaani, tai uutena enää myymättömille malleille vuosina 2020–2024 rekisteröityjen (lopulliset tiedot) (<a href="https://co2cars.apps.eea.europa.eu/" target="_blank" rel="noopener">EEA:n rekisteri</a>). Talven luvut ovat arvioita Norjan autoliiton El Prix -talvitesteistä: lauhassa talvessa (−6…+8 °C, 2025) autot jäivät keskimäärin 18 % ja kovassa pakkasessa (−7…−32 °C, 2026) 38 % alle WLTP-toimintasäteen (<a href="https://www.naf.no/elbil/elprix-nytt/elprix-vinter-2026-rekkeviddetest" target="_blank" rel="noopener">NAF</a>). Testit ajettiin sähköautoilla; lataushybridille sama suhde on oletus. Vanhemmissa mallivuosissa toimintasäde on usein lyhyempi kuin rekisterin luku. Yksittäinen auto voi poiketa paljonkin. <b>Akun kunto</b> (SOH) lyhentää sähköauton toimintasädettä samassa suhteessa. Jos et kirjoita sitä, se arvioidaan auton iästä: 2,3 % vuodessa, mikä on keskimääräinen kapasiteetin lasku 22 700 sähköauton aineistossa (<a href="https://www.geotab.com/blog/ev-battery-health/" target="_blank" rel="noopener">Geotab 28.4.2026</a>; aiemmassa tutkimuksessa 1,8 %/v, ja runsaasti pikalatatuilla autoilla 3,0 %/v). Oletus on näistä epäedullisempi keskiarvo. Yksittäisen auton akku voi olla selvästi paremmassa tai huonommassa kunnossa, joten pyydä kuntoraportti. <b>Akun koko</b> muuttaa toimintasädettä samassa suhteessa, kun mallin akku tiedetään mallin nimestä (esim. Nissan Leaf 40 kWh). Rekisterissä ei ole akun kokoa, joten muille malleille kenttä vaikuttaa vain valmistuksen päästöihin.</li>
<li><b>€/km tuloskortissa on ajon energia:</b> polttoaine tai sähkö kilometriä kohden (kulutus × hinta), eli se, mitä ajaminen itse maksaa. Kaikki kulut kilometriä kohden (vuosikulu jaettuna ajomäärällä) löytyy kortin kohdasta Lisätietoja. Huollon kasvun ja arvon kilometrikohtaisen laskun lisääminen ajon hintaan odottaa parempia lähteitä.</li>
<li><b>Lataushäviö:</b> WLTP-testissä sähkönkulutus mitataan pistorasiasta, joten latauksen tavanomaiset häviöt ovat jo virallisissa luvuissa. Oletuksena lisätään silti 10 %, koska moni lataa kotona tavallisesta pistorasiasta, jossa häviö on suurempi: <a href="https://www.adac.de/rund-ums-fahrzeug/elektromobilitaet/laden/ladeverluste-elektroauto-studie/" target="_blank" rel="noopener">ADAC:n mittauksessa</a> (8/2026, viisi autoa) häviöt olivat pistorasiasta (2,3 kW) noin 15 % ja yhdellä autolla 24 %, latausasemalla (11–22 kW) alle 7 %. Jos lataat latausasemalla, aseta lisähäviöksi 0.</li>
<li><b>Mallin valinta</b> täyttää ostohinnan, iän ja mittarilukeman, ellet ole kirjoittanut niitä itse: ikä on nuorin mallivuosi, jonka arvioitu hinta mahtuu enimmäishintaan, hinta on mallin arvo uutena (Verohallinnon verotusarvoista, sama menetelmä kuin esimerkkiautoissa, vähintään 5 päätöstä) kerrottuna arvonaleneman kertoimella, ja mittarilukema on ikä kertaa mallin mediaaniajomäärä Traficomin rekisterissä. Arvio on suuntaa-antava: vaihda oikea hinta, kun tiedät sen. Noin 80 %:lle malleista on arvio.</li>
<li><b>Vaihteluväli</b> tuloskorteissa näyttää vuosikulun 15 vuoden halvimmilla ja kalleimmilla energian hinnoilla (12 kuukauden keskihinnat nykyrahassa, Tilastokeskus). Lähteet ja oletukset ovat tulosten alla kohdassa Lisätietoja vaihteluväleistä.</li>
<li><b>Kuinka varma järjestys on?</b> Sivu muuttaa yhtä asiaa kerrallaan ja etsii lähimmän arvon, jolla halvin auto vaihtuu, ja näyttää kaksi lähintä. Haun rajat: ajomäärä 2 000–50 000 km, polttoaineen ja sähkön hinta puolesta kaksinkertaiseen, omistusaika 1–20 vuotta ja arvonalenema puolesta kaksinkertaiseen (sama kerroin kaikille autoille). Rajat eivät ole ennusteita tai vaihteluvälejä, vaan sitä, kuinka kaukaa kääntöpistettä haetaan; kaukana olevaa kääntöpistettä ei näytetä.</li>
<li><b>Vakuutus</b> on jaettu pakolliseen liikennevakuutukseen ja vapaaehtoiseen kaskoon. Avointa tilastoa henkilöauton vakuutusmaksuista ei löytynyt (<a href="https://www.finanssivalvonta.fi/en/publications-and-press-releases/news-releases/2025/statistical-survey-of-motor-liability-insurance-profitability-20192023-result-recorded-for-2023-was-excellent-despite-slight-decline-in-underwriting-result/" target="_blank" rel="noopener">Finanssivalvonta</a> kertoo vain koko markkinan maksutulon), joten oletukset ovat Taloustaidon hintavertailujen keskiarvoja, kustakin suurempi: <a href="https://www.taloustaito.fi/vapaalla/2026/taloustaito-vertaili-huimat-erot-autovakuutusten-hinnoissa/" target="_blank" rel="noopener">vertailu 24.9.2026</a> (neljä yhtiötä, 12 kolme vuotta vanhaa autoa): liikennevakuutus bensiini- ja hybridiautoilla 167, lataushybrideillä 198 ja sähköautoilla 204 €/v, kasko 482, 701 ja 833 €/v; <a href="https://www.taloustaito.fi/vapaalla/sahkoautoilija-nain-paljon-autosi-kayttovoima-korottaa-vakuutusmaksuja/" target="_blank" rel="noopener">vertailu 20.10.2022</a> (Kia Niro 2021–2022, kolme yhtiötä): kevythybridi liikenne 198 ja kasko 520 €/v, täyssähkö 196 ja 771 €/v. Oletukset: liikennevakuutus 200 €/v (sähkö 205), kasko 520 €/v (bensiini, diesel, hybridi), 700 (lataushybridi) ja 835 (sähkö); dieselistä ei ollut omaa lukua. Vertailujen vakuutuksenottaja oli 59-vuotias täysillä bonuksilla pääkaupunkiseudun ympäristökunnassa: nuoremmalle tai bonuksettomalle hinta on usein selvästi suurempi. Kasko riippuu myös auton arvosta, ja vanhaa halpaa autoa ei usein kaskoteta. Kirjoita omat tarjouksesi kohtaan Tarkenna.</li>
<li>Huollon lähtötaso on karkea oletus. Tämä on luonnos, ei tarkistettu vertailu.</li>`,

  ins_src:'<b>Sources:</b> motor liability and full comprehensive are averages from Taloustaito price comparisons (<a href="https://www.taloustaito.fi/vapaalla/2026/taloustaito-vertaili-huimat-erot-autovakuutusten-hinnoissa/" target="_blank" rel="noopener">24 Sept 2026</a>, 3-year-old cars, and <a href="https://www.taloustaito.fi/vapaalla/sahkoautoilija-nain-paljon-autosi-kayttovoima-korottaa-vakuutusmaksuja/" target="_blank" rel="noopener">20 Oct 2022</a>), taking the higher one: motor liability €200/yr (electric €205), full comprehensive €520/yr (petrol, diesel, hybrid), €700 (plug-in hybrid) and €835 (electric). Partial comprehensive is 37% of the full price, from Taloustaito\'s <a href="https://www.taloustaito.fi/vapaalla/2025/autovakuutus--ala-maksa-turhasta/" target="_blank" rel="noopener">26 Sept 2025</a> comparison (four insurers, a 14-year-old Octavia: partial €86/yr on average, full €231/yr). Partial cover does not pay for your own collision. The policyholder in the comparisons was 58–59 years old with full bonus; younger drivers or those without bonus usually pay clearly more.',

  notes:`<li><b>Finland only, for now:</b> fuel and electricity prices, taxes, grid emissions and the model list describe Finland. The method works for any EU country once those inputs are changed.</li>
<li><b>Depreciation:</b> residual value = price × (1 − depreciation %)<sup>years</sup>. If you leave the percentage blank, it is chosen by the car's average age during ownership: under 3 years 17%, 3–5 years 10%, 6–9 years 11%, 10–19 years 12%, 20 years or more 10%. The rates come from the Finnish Tax Administration's taxation values (<a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2024.xls" target="_blank" rel="noopener">2024</a>, <a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2025.xls" target="_blank" rel="noopener">2025</a>, <a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2026.xls" target="_blank" rel="noopener">2026</a>) (114,000 cars imported used in 2024–2026), comparing cars of the same model at different ages. Above-average mileage (over 15,000 km/yr) lowers the residual value by 0.2% per 1,000 km per year; this is an assumption without a source. <b>Depreciation is an average over models, not a forecast for one car:</b> its condition, service history, equipment, demand and, for an electric car, the battery can move the resale price a lot either way. The tipping points under the results show how much depreciation would have to change for the cheapest car to change.</li>
<li><b>Example cars</b> follow your maximum price: the petrol car is always a Golf (Finland's most common car of median age), the hybrid a Toyota Corolla, Auris or Yaris, and the electric car the most common model in the register that fits your budget. Each is the youngest model year whose estimated price fits. Price estimates come from the Tax Administration's taxation values (<a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2025.xls" target="_blank" rel="noopener">2025</a>, <a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2026.xls" target="_blank" rel="noopener">2026</a>), mileage from the model's average annual mileage. Once you edit an example car, it stops following the budget.</li>
<li><b>Financing:</b> whatever your own money and trade-in do not cover is financed with an annuity loan. Its cost is the interest and monthly fees paid during ownership. If the car is sold before the loan is repaid, the rest is paid from the sale. On top of that, own money tied up in the car is charged the return it would have earned elsewhere. Cars above your maximum price are flagged.</li>
<li><b>Your current car:</b> one car can be marked as your current car. Its purchase price is its current value (what you would get by selling it), and the calculation assumes there is no loan on it: the value is own money tied up in the car, and its lost return is counted as for other cars. The other cars' result cards show the difference to your current car in euros and emissions per year. The current car does not change with the maximum price. All data stays in this browser; a shared link carries it only if you share it yourself.</li>
<li><b>Two monthly figures</b> on the result card: the <i>true cost</i> is the annual cost divided by twelve, and <i>paid out</i> is what leaves your account each month while the loan runs: the loan payment with fees, plus energy and other costs (tax, insurance, servicing, tyres) spread over the months. Depreciation and the lost return on own money are real costs but never arrive as a monthly bill, so they are left out. That is why the amount paid out can be lower or higher than the true cost. Tax, insurance and servicing are really billed less often, so the figure is a monthly average. If the loan is shorter than the ownership period, outgoings drop once it is paid off. Unexpected repairs are not included. For a cash purchase the card shows the sum needed at once; when partly financed, the own money and the loan. If you enter a monthly budget (optional), cars over it are flagged.</li>
<li><b>Real-world consumption:</b> the WLTP figure is multiplied by a factor measured from the cars' own on-board fuel consumption meters (read at periodic inspections, among other ways). The factor is <b>model-specific</b> for 367 models; the rest fall back to a brand or powertrain average, and each car's card says which one is in use. On average petrol cars use 20% and diesels 18% more than WLTP, but models differ widely. The figures cover the whole EU and do not account for Finnish winters.</li>
<li><b>Older cars (model year 2017 or earlier):</b> their official consumption was measured with the old NEDC test, which understates consumption far more than WLTP. The calculator uses the model's own NEDC figure for that model year from the Traficom register and adds the gap measured by the <a href="https://theicct.org/publication/from-laboratory-to-road-a-2018-update/" target="_blank" rel="noopener">ICCT</a>: 8% for 2001 cars, 38% for 2014 and 40% for 2016 cars, interpolated linearly in between.</li>
<li><b>Plug-in hybrids:</b> the default consumption is the model's own measured average where there is one, otherwise the brand's. Across the EU that is 6.0 l/100 km, where WLTP promises 1.4. By default 25% of driving is electric. Raise the share if you charge diligently.</li>
<li><b>Electric cars:</b> consumption is the model's WLTP figure from the EEA register (cars registered in Finland in 2025; 2020–2022 for models no longer sold). Measured consumption is not collected from battery-electric cars, so the 1.20 factor is an assumption. Battery wear adds no cost in the calculator: in a <a href="https://www.geotab.com/blog/ev-battery-health/" target="_blank" rel="noopener">Geotab study</a> (22,700 cars) capacity fell by 2.3% a year on average, about 1.5% for cars charged mostly at home and about 3% for heavy fast-charger users. A worn battery shortens the range but barely raises consumption. No reliable figure was found for how often batteries are replaced.</li>
<li><b>Servicing and repairs</b> rise with mileage. The value in the field is the level for a low-mileage car (under 80,000 km) and is a rough assumption. The rise follows <a href="https://advocacy.consumerreports.org/wp-content/uploads/2020/10/TCO-Fact-Sheet-Chapter-2-FINAL.pdf" target="_blank" rel="noopener">Consumer Reports</a> owner surveys (United States, 2020): per kilometre, a combustion car with 80,000–160,000 km costs 2.1 times as much to service and repair, and beyond that 2.8 times. For electric cars the factors are 2.3 and 3.6, but from a starting level under half that of a combustion car. The calculator averages the factor over the distance you drive during ownership; each car's card shows it. Plug-in and regular hybrids use the combustion factors. The source is American, so the euro amounts are the calculator's own and only the rise comes from the source. The German <a href="https://www.datgroup.com/fileadmin/at/DAT_Report/2025/DAT-Report-2025-Kurzbericht.pdf" target="_blank" rel="noopener">DAT Report 2025</a> shows owners of cars over 6 years old spending even less on servicing than owners of 3–6-year-old cars: owners of old cars often save on servicing, which can cost more later.</li>
<li><b>Electricity emissions:</b> direct emissions of Finnish generation 26 g/kWh in 2025 (<a href="https://energia.fi/wp-content/uploads/2026/01/Sahkovuosi-2025_v1.pdf" target="_blank" rel="noopener">Finnish Energy, Electricity year 2025</a>; the same figure from <a href="https://fingridlehti.fi/sahkon-paastojen-lasku-jatkuu/" target="_blank" rel="noopener">Fingrid</a>) + fuel supply chain 16 g/kWh (<a href="https://doi.org/10.1016/j.trd.2017.07.012" target="_blank" rel="noopener">Moro and Lonza 2018, EU JRC</a>; checked only through a secondary source). Lifecycle values by generation type (nuclear and wind 12, hydro 24, solar 48 g/kWh) are medians from <a href="https://www.ipcc.ch/site/assets/uploads/2018/02/ipcc_wg3_ar5_annex-iii.pdf" target="_blank" rel="noopener">IPCC AR5 Annex III</a>. <a href="https://unece.org/sed/documents/2021/10/reports/life-cycle-assessment-electricity-generation-options" target="_blank" rel="noopener">UNECE's 2021 life-cycle assessment</a> gives lower values for nuclear and wind (about 5–16 g/kWh); the default uses the higher ones.</li>
<li><b>Sources:</b> model list and CO₂ values from <a href="https://avoindata.suomi.fi/data/fi/dataset/ajoneuvojen-avoin-data" target="_blank" rel="noopener">Traficom open vehicle data</a> (30 June 2026), measured consumption from the <a href="https://climate-energy.eea.europa.eu/topics/transport/real-world-emissions/additional_information" target="_blank" rel="noopener">EEA's OBFCM dataset</a> and electricity consumption from the <a href="https://co2cars.apps.eea.europa.eu/" target="_blank" rel="noopener">EEA new-car register</a> (cars registered in Finland 2020–2025). All CC BY 4.0. Depreciation from the Finnish Tax Administration's taxation values and the NEDC correction from the ICCT. The full calculation model and the data behind it are <a href="https://github.com/TapioT1986/CarFootprint" target="_blank" rel="noopener">on GitHub</a>.</li>
<li><b>Vehicle tax</b> follows the 2026 tax tables (<a href="https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2024/814" target="_blank" rel="noopener">Vehicle Tax Act, amendment 814/2024</a>). The base tax depends on the car's official CO₂ emissions and is €106–654 a year. The emissions are worked out from the model's official consumption: model years 2017 and older use the NEDC table 1, newer cars the WLTP table 1 A. Electric cars first registered on or after 1 October 2021 pay €171 a year; the calculator treats model years 2022 and newer as such. Plug-in hybrids pay the lowest band, as their WLTP emissions are almost always below 103 g/km. Diesel, electric and plug-in hybrid cars also pay a propulsion tax: 5.5, 1.9 or 0.95 cents a day for every started 100 kg of total mass. Total mass is not yet in the model list, so it is an assumption (diesel 2,000 kg, electric 2,200 kg, plug-in hybrid 2,300 kg). Your own car's total mass is on its registration certificate; change it under More assumptions. <a href="https://www.edilex.fi/he/20260173" target="_blank" rel="noopener">Government proposal HE 173/2026</a> would lower the base tax of cars taxed under tables 1 and 2 (mainly combustion cars at least 10 years old) by about €6 a year on average from 2028. It is still before Parliament and is not included.</li>
<li><b>Inspections and lifetime</b> (information on the car card, not used in the calculation) come from <a href="https://trafi2.stat.fi/PXWeb/pxweb/fi/TraFi/TraFi__Katsastuksen_vikatilastot/" target="_blank" rel="noopener">Traficom's periodic inspection statistics</a> (inspections 2017–2025, open data CC BY 4.0). Traficom groups cars by model series, so all powertrains and generations of a model are together. The failure rate is for the latest year at the car's age at purchase, or the nearest age with at least 50 inspections. The faults are shares of the faults that caused a failure, all ages together. Lifetime is worked out from inspection counts: from 10 years on, cars are inspected every year, so the count for one model year shows how many are still on the road. Cars that left the road before 10 years (crashes, exports) do not show in the figure. Cars imported used raise the counts, and if the counts rise with age, no lifetime is estimated. When more than half are still on the road at 20, the age at which half have left is an estimate: the yearly drop-out rate is continued as a straight line from ages 10–19. The Lifetime field (spreading manufacturing emissions) is still the 18–20-year assumption.</li>
<li><b>Manufacturing emissions</b> come from the <a href="https://theicct.org/publication/electric-cars-life-cycle-analysis-emissions-europe-jul25/" target="_blank" rel="noopener">ICCT</a> EU life-cycle study (2025) for a medium-size car such as the Golf. Making and recycling the car without its battery: petrol, diesel and hybrid cars 8.2 t, plug-in hybrids 8.6 t and electric cars 7.5 t CO₂e. Battery production is 72.8 kg CO₂e per kWh, weighted by where the cells are made (30% Europe, 56% China). The default battery is the average of medium-size cars sold in the EU in 2023: 53.4 kWh for electric cars (3.9 t) and 13.3 kWh for plug-in hybrids (1.0 t). You can set your own car's battery size under More assumptions. A small car takes less to make and a large one more. Manufacturing emissions are spread over the car's whole lifetime. According to the ICCT, batteries usually outlast the car: fewer than 1% of electric cars sold after 2016 have had their battery replaced (Recurrent, 20,000 cars; <a href="https://www.energy.gov/cmei/vehicles/articles/fotw-1339-april-22-2024-plug-electric-vehicle-battery-replacements-due" target="_blank" rel="noopener">the US Department of Energy</a> puts replacements due to failure in model years 2016–2023 well under 1%).</li>
<li><b>Share comparison</b> makes a short link holding only the chosen models and the numbers you changed; everything else is recalculated when it opens. The data sits after the # sign, which browsers never send to the server, and the page collects nothing. Only settings you changed go into the link, so whoever opens it sees current fuel and electricity prices unless you changed them. Opening a shared link does not lose the opener's own cars: they can be restored.</li>
<li><b>Electric range</b> is shown for electric and plug-in hybrid cars picked from the register: the official WLTP range is the median of the same model registered in Finland in 2025, or for models no longer sold new, in 2020–2024 (final data) (<a href="https://co2cars.apps.eea.europa.eu/" target="_blank" rel="noopener">EEA register</a>). The winter figures are estimates from the Norwegian Automobile Federation's El Prix winter tests: in a mild winter (−6…+8 °C, 2025) cars fell on average 18% and in hard frost (−7…−32 °C, 2026) 38% short of their WLTP range (<a href="https://www.naf.no/elbil/elprix-nytt/elprix-vinter-2026-rekkeviddetest" target="_blank" rel="noopener">NAF</a>). The tests used electric cars; applying the same ratio to plug-in hybrids is an assumption. Older model years often have a shorter range than the register figure. Individual cars can differ a lot. <b>Battery health</b> (SOH) shortens an electric car's range in the same proportion. If you leave it empty, it is estimated from the car's age: 2.3% per year, the average capacity loss in data on 22,700 electric cars (<a href="https://www.geotab.com/blog/ev-battery-health/" target="_blank" rel="noopener">Geotab, 28 April 2026</a>; an earlier study found 1.8% per year, and heavily fast-charged cars 3.0% per year). The default is the less favourable average. A single car's battery can be clearly better or worse, so ask for a health report. <b>Battery size</b> changes the range in proportion when the model's battery is known from its name (e.g. Nissan Leaf 40 kWh). The register has no battery size, so for other models the field only affects production emissions.</li>
<li><b>€/km on the result card is the driving energy:</b> fuel or electricity per kilometre (consumption × price), i.e. what driving itself costs. All costs per kilometre (yearly cost divided by mileage) are under More details on the card. Adding the rise in servicing and the mileage-related loss of value to the driving cost waits for better sources.</li>
<li><b>Charging losses:</b> in the WLTP test, electricity consumption is measured at the socket, so normal charging losses are already in the official figures. The default still adds 10%, because many people charge at home from an ordinary socket, where losses are higher: in <a href="https://www.adac.de/rund-ums-fahrzeug/elektromobilitaet/laden/ladeverluste-elektroauto-studie/" target="_blank" rel="noopener">ADAC's measurements</a> (8/2026, five cars) losses from a household socket (2.3 kW) were about 15%, and 24% for one car, and below 7% from a wallbox (11–22 kW). If you charge from a wallbox, set the extra loss to 0.</li>
<li><b>Picking a model</b> fills in the purchase price, age and odometer unless you typed them yourself: the age is the youngest model year whose estimated price fits the maximum price, the price is the model's value when new (from Tax Administration taxation values, the same method as for the example cars, at least 5 decisions) times the depreciation factor, and the odometer is age times the model's median annual mileage in Traficom's register. The estimate is indicative: change it to the real price when you know it. About 80% of models have an estimate.</li>
<li><b>The range</b> on the result cards shows the yearly cost at the cheapest and dearest energy prices of the last 15 years (12-month averages in today's money, Statistics Finland). Sources and assumptions are under the results in More about the ranges.</li>
<li><b>How firm is the ranking?</b> The page changes one thing at a time, finds the nearest value at which the cheapest car changes, and shows the two nearest. Search limits: mileage 2,000–50,000 km, fuel and electricity prices from half to double, ownership 1–20 years and depreciation from half to double (the same factor for every car). The limits are not forecasts or ranges, only how far the page looks for a tipping point; one further away is not shown.</li>
<li><b>Insurance</b> is split into compulsory motor liability insurance and optional comprehensive cover. No open statistics give a premium per car (<a href="https://www.finanssivalvonta.fi/en/publications-and-press-releases/news-releases/2025/statistical-survey-of-motor-liability-insurance-profitability-20192023-result-recorded-for-2023-was-excellent-despite-slight-decline-in-underwriting-result/" target="_blank" rel="noopener">the Financial Supervisory Authority</a> reports only market totals), so the defaults are averages from Taloustaito's price comparisons, taking the higher one: <a href="https://www.taloustaito.fi/vapaalla/2026/taloustaito-vertaili-huimat-erot-autovakuutusten-hinnoissa/" target="_blank" rel="noopener">24 Sept 2026</a> (four insurers, 12 three-year-old cars): motor liability €167 for petrol and hybrid cars, €198 for plug-in hybrids and €204 for electric cars, comprehensive €482, €701 and €833; <a href="https://www.taloustaito.fi/vapaalla/sahkoautoilija-nain-paljon-autosi-kayttovoima-korottaa-vakuutusmaksuja/" target="_blank" rel="noopener">20 Oct 2022</a> (Kia Niro 2021–2022, three insurers): mild hybrid €198 and €520, full electric €196 and €771. Defaults: motor liability €200/yr (electric €205), comprehensive €520/yr (petrol, diesel, hybrid), €700 (plug-in hybrid) and €835 (electric); there was no diesel figure. The policyholder in the comparisons was 59 years old with full bonus, living near Helsinki: younger drivers or those without bonus usually pay clearly more. Comprehensive cover also depends on the car's value, and old cheap cars are often not covered. Enter your own quotes under Fine-tune.</li>
<li>The starting level of servicing is a rough assumption. This is a draft, not a verified comparison.</li>`,

const SERV_KM = [80467, 160934]; // 50 000 ja 100 000 mailia

// Kertoimen keskiarvo omistusaikana ajetulle matkalle (mittarilukemasta a lukemaan b)

const rateAt = a => { let r = AGE_DEP[0][1]; for (const [x,q] of AGE_DEP) if (a>=x) r=q; return r; };

// Nuorin vuosimalli, jonka arvioitu hinta mahtuu budjettiin, tai null.
function fitBudget(c, budget){
  const r = findRow([c[1],c[2],c[6]||c[0]]); if (!r) return null;
  let [y0,y1] = String(r[5]).split('–').map(Number);

  const minAge = Math.max(0, CUR_YEAR-y1), maxAge = CUR_YEAR-y0;

// Valitun mallin hinta-arvio: arvo uutena (Verohallinnon verotusarvoista) × arvonalenema iän mukaan
const estPrice = (r, age) => { const v0 = MV0[CATALOG.indexOf(r)]; return v0 ? Math.floor(v0*depFactor(age)/100)*100 : 0; };
// Mallin valinta täyttää ikä-, hinta- ja mittarilukemakentät mallin mukaan, ellei käyttäjä ole itse kirjoittanut niitä:
// ikä = nuorin mallivuosi, jonka arvioitu hinta mahtuu enimmäishintaan (kuten esimerkkiautoissa), mittarilukema = ikä × mallin
// mediaaniajomäärä (Traficom). Jos arviota ei ole, ikä rajataan mallin vuosiin ja hinta jää ennalleen.
function autoPriceAge(c, r){
  const own = c.own || {}, [y0, y1] = String(r[5]).split('–').map(Number);
  const minAge = Math.max(0, CUR_YEAR - (y1||CUR_YEAR)), maxAge = Math.max(minAge, CUR_YEAR - (y0||CUR_YEAR));
  const budget = gv('budget', 0);
  if (!own.age){
    let a = Math.min(maxAge, Math.max(minAge, Math.round(c.age||0)));
    if (MV0[CATALOG.indexOf(r)] && budget > 0){
      a = maxAge;
      for (let x = minAge; x <= maxAge; x++) if (estPrice(r, x) <= budget){ a = x; break; }
    }
    c.age = a;
  }
  if (!own.price){ const v = estPrice(r, c.age); c.priceAuto = !!v; if (v) c.price = v; }
  if (!own.odo) c.odo = Math.round(c.age*(r[6]||14000)/1000)*1000;
}

const labelOf = r => `${r[0]} ${r[1]} – ${T('pt')[r[2]]}`;
let byLabel = new Map(), modelIdx = [];
const normS = t => normB(t).replace(/[^A-Z0-9]+/g,' ');
function buildModels(){
  byLabel = new Map(CATALOG.map(r => [labelOf(r), r]));
  // yleisimmät mallit ensin (rekisterissä olevien autojen määrä)
  modelIdx = CATALOG.map(r => [labelOf(r), normS(labelOf(r)), r[4]||0]).sort((a,b)=>b[2]-a[2]);
}
// Ehdotuslista: kaikki kirjoitetut sanat löytyvät mallin nimestä
function suggest(inp){
  const i = inp.dataset.pick, box = $('sg'+i); if (!box) return;
  const words = normS(inp.value).split(' ').filter(Boolean);
  if (!words.length) return closeSugg(inp);
  const hits = modelIdx.filter(m => words.every(w => m[1].includes(w))).slice(0,40);
  box.innerHTML = hits.length ? hits.map((m,j)=>`<button type="button" role="option" tabindex="-1" id="sg${i}_${j}" aria-selected="false">${esc(m[0])}</button>`).join('')
    : `<div class="none">${T('pick_none')}</div>`;
  box.hidden = false; box.scrollTop = 0;
  inp.setAttribute('aria-expanded','true'); inp.removeAttribute('aria-activedescendant');
}
function closeSugg(inp){
  const box = $('sg'+inp.dataset.pick); if (box){ box.hidden = true; box.innerHTML = ''; }
  inp.setAttribute('aria-expanded','false'); inp.removeAttribute('aria-activedescendant');
}
function choose(inp, label){ inp.value = label; closeSugg(inp); inp.dispatchEvent(new Event('input',{bubbles:true})); }

// Tuloskortin energian hinta: käytetty hinta ja sen lähde (Tilastokeskuksen kuukausi tai oma hinta)
function priceText(c, G){
  const one = (id, key, v, d, u) => { const s = PRICE_SRC[key] || {}, m = /^(\d{4})M(\d\d)$/.exec(s.period||'');
    const own = Math.abs(v - num(PRICE_DEF[id], v)) > 1e-9;
    const src = own ? T('p_own') : (m && s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${T('p_stat')} ${+m[2]}/${m[1]}</a>` : '');
    return `${T(key).toLowerCase()} ${fmt(v,d)} ${u}${src ? ' ('+src+')' : ''}`; };
  const f = c.pt==='D' ? one('pDies','diesel',G.pD,2,'€/l') : one('pBens','petrol',G.pB,2,'€/l');
  const e = one('pEl','electricity',G.pE,3,'€/kWh');
  return c.pt==='E' ? e : c.pt==='P' ? f + ', ' + e : f;
}

// Tasaerälainan kustannus omistusaikana: korot ja kuukausimaksut vuotta kohden,
// keskimääräinen lainapääoma sekä kuukausierä. Myynnissä jäljellä oleva laina maksetaan pois.
function loanCost(P, r, fee, years, own){
  if (P <= 0) return {perYear:0, avgBal:0, pay:0};
  const N = Math.round(years*12), M = Math.round(own*12), i = r/12;
  const pay = i>0 ? P*i/(1-Math.pow(1+i,-N)) : P/N;
  let bal = P, interest = 0, fees = 0, balSum = 0;
  for (let m=0; m<M; m++){
    balSum += bal;
    if (bal <= 0) continue;
    const it = bal*i; interest += it; fees += fee; bal = Math.max(0, bal - (pay - it));
  }
  return {perYear:(interest+fees)/own, avgBal:balSum/M, pay:pay+fee};
}

// --- laskenta (sama malli kuin Excel-prototyypissä) ---
function calc(c, G, km){
  km = km ?? G.km;
  const n = G.years;
  const elShare = c.pt==='E'?1:(c.pt==='P'?Math.min(1,Math.max(0,c.share/100)):0);
  let rate;
  if (c.dep===''||c.dep===null||!isFinite(num(c.dep,NaN))){
    const mid = c.age + n/2; rate = AGE_DEP[0][1];
    for (const [a,r] of AGE_DEP) if (mid>=a) rate=r;
  } else rate = num(c.dep)/100;
  const kmAdj = Math.max(0, 1 - 0.002*Math.max(0,km-15000)/1000*n);
  const resid = Math.max(0, c.price*Math.pow(1-rate,n)*kmAdj);
  const dep = (c.price-resid)/n;
  // Rahoitus: tasaerälaina sille osalle, jota oma raha ei kata
  const loan = c.mine ? 0 : Math.max(0, c.price - G.own), L = loanCost(loan, G.loanRate, G.loanFee, G.loanYears, n);
  const ownTied = Math.max(0, (c.price+resid)/2 - L.avgBal);
  const cap = L.perYear + ownTied*G.rate;
  const litres = km/100*c.fuel*c.real*(1-elShare);
  const kwh = km/100*c.kwh*c.real*elShare*(1+G.loss);
  const fuelPrice = c.pt==='D'?G.pD:G.pB, fuelEm = c.pt==='D'?G.eD:G.eB;
  const energy = litres*fuelPrice + kwh*G.pE;
  const vt = vehicleTax(c), autoTax = c.tax===''||c.tax==null||!isFinite(num(c.tax,NaN));
  const tax = autoTax ? vt.total : num(c.tax);
  const servF = servFactor(c.pt, Math.max(0,num(c.odo,0)), Math.max(0,num(c.odo,0)) + km*n), serv = num(c.serv,0)*servF;
  const ins = num(c.traf,0) + num(c.kasko,0); // liikennevakuutus + kasko
  const other = num(c.other,0) + ins + tax + serv;
  const total = dep+cap+energy+other;
  const drive = litres*fuelEm + kwh*G.eEl;
  const makeT = num(c.make,0) + battT(c); // t CO2e: auto + akku
  const make = c.life>0 ? makeT*1000/c.life : 0;
  // Kuukausimenot (kassavirta): lainaerä kuluineen + energia ja muut kulut kuukautta kohden.
  // Arvonalenema ja oman rahan tuotto eivät ole kuukausittaisia maksuja.
  const runMo = (energy+other)/12, cash = L.pay + runMo, cashAfter = (L.pay>0 && G.loanYears<n) ? runMo : null;
  return {ins,rate,resid,dep,cap,loan,pay:L.pay,cash,cashAfter,energy,other,tax,vt,autoTax,serv,servF,total,drive,make,makeT,em:drive+make,litres,kwh,
    endAge:c.age+n, endOdo:c.odo+km*n};
}

$('cars').addEventListener('input', e => {
  const el = e.target, card = el.closest('.car'); if (!card) return;
  const i = +card.dataset.i, c = cars[i];
  if (el.type==='number' && !markField(el)) return; // virheellinen arvo ei mene laskentaan
  c.exAuto = false;
  if (el.dataset.pick!==undefined){
    const r = byLabel.get(el.value); if (!r){ suggest(el); return; }
    const d = PT_DEF[r[2]];
    Object.assign(c, {name:c.ownName ? c.name : `${r[0]} ${r[1]}`, exKey:null, pt:r[2], kwh:d.kwh, share:d.share,
      other:d.tyre, traf:d.traf, kasko:kaskoDef(r[2]), serv:d.serv, tax:'', mass:d.mass, make:d.make, batt:d.batt, life:d.life});
    c.picked = r; autoPriceAge(c, r); fromRow(c, r); c.batt = battFromName(r) ?? d.batt;
    renderCars(); update(); return;
  }
  const k = el.dataset.k; if (!k) return;
  if (k==='name'){ c.name = el.value; c.exKey = null; }
  else if (k==='pt'){ const d=PT_DEF[el.value]; Object.assign(c,{pt:el.value,mass:PT_DEF[el.value].mass,fuel:(el.value==='P'||!c.fuel)?d.fuel:c.fuel,kwh:c.kwh||d.kwh,share:d.share,make:d.make,batt:d.batt,real:d.real,rw:null,picked:null,autoFuel:true}); refreshStd(c); renderCars(); }
  else if (k==='dep'||k==='tax'||k==='soh'){ c[k] = el.value;
    if (k==='soh') el.closest('.field').classList.toggle('est', el.value===''); }
  else {
    c[k] = num(el.value);
    if (k==='price'||k==='age'||k==='odo'){ c.own = {...(c.own||{}), [k]:true}; if (k==='price') c.priceAuto = false;
      el.closest('.field').classList.remove('est'); } // oma arvo: ei enää arvio
    if (k==='age' && c.priceAuto && c.picked){ // arvioitu hinta seuraa ikää
      const v = estPrice(c.picked, c.age); if (v){ c.price = v; const pe = $('price'+i); if (pe) pe.value = v; } }
    if (k==='age' && c.picked && !(c.own||{}).odo){ // mittarilukema seuraa ikää, ellei sitä ole kirjoitettu itse
      c.odo = Math.round(c.age*(c.picked[6]||14000)/1000)*1000; const oe = $('odo'+i); if (oe) oe.value = c.odo; }
    if (k==='fuel'||k==='real') c.autoFuel = false;
    if (k==='age'){ // päivitä kulutus ja yksiköt paikallaan, ettei kenttä menetä kohdistusta
      refreshStd(c);
      const f=$('fuel'+i), r=$('real'+i), fu=$('fuelu'+i), ru=$('realu'+i);
      if (f) f.value = c.fuel; if (r) r.value = c.real;
      if (fu && c.pt!=='P') fu.textContent = isNedc(c)?T('fuel_u_nedc'):T('fuel_u');
      if (ru) ru.textContent = isNedc(c)?T('real_u_nedc'):T('real_u');
    }
  }
  update();
});
