<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarFootprint</title>
<meta name="description" content="Mitä auto oikeasti maksaa vuodessa ja paljonko se päästää. Suomen hinnoilla, veroilla ja rekisteritiedoilla. Uudet ja käytetyt autot, todellinen kulutus ja arvonalenema.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CarFootprint">
<meta property="og:title" content="CarFootprint – autojen kustannukset ja päästöt">
<meta property="og:description" content="Mitä auto oikeasti maksaa vuodessa ja paljonko se päästää. Suomen hinnoilla, veroilla ja rekisteritiedoilla. Uudet ja käytetyt autot, todellinen kulutus ja arvonalenema.">
<meta property="og:url" content="https://tapiot1986.github.io/CarFootprint/">
<meta property="og:image" content="https://tapiot1986.github.io/CarFootprint/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="CarFootprint: kaavio auton vuosikustannuksesta ajomäärän mukaan.">
<meta property="og:locale" content="fi_FI">
<meta property="og:locale:alternate" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b5cad">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tienvarsi – syötteet vasemmalla kapeana sarakkeena, tulokset leveänä oikealla; puhelimella pinossa */
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#16202a; --muted:#5b6873; --line:#d3dadf;
  --accent:#0b5cad;            /* tienviittojen sininen */
  --accent-ink:#ffffff;
  --input:#f6f8f9;
  --c1:#0b5cad; --c2:#d9822b; --c3:#2e8b57; --c4:#8a4fbf;
  --seg-dep:#16202a; --seg-cap:#6c7a86; --seg-en:#d9822b; --seg-oth:#b8c2ca;
  --seg-drive:#5a6b2f; --seg-make:#a9b98a;
  --good:#2e8b57; --warn:#b45309;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e7edf2; --muted:#9aa8b4; --line:#2b3742;
  --accent:#4d9be6; --accent-ink:#06121e; --input:#121a21;
  --c1:#4d9be6; --c2:#f0a050; --c3:#4cc28a; --c4:#b78ae6;
  --seg-dep:#e7edf2; --seg-cap:#8b99a5; --seg-en:#f0a050; --seg-oth:#4a5966;
  --seg-drive:#a9c46a; --seg-make:#5d6d3c; --good:#4cc28a; --warn:#f0a050; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e7edf2; --muted:#9aa8b4; --line:#2b3742;
  --accent:#4d9be6; --accent-ink:#06121e; --input:#121a21;
  --c1:#4d9be6; --c2:#f0a050; --c3:#4cc28a; --c4:#b78ae6;
  --seg-dep:#e7edf2; --seg-cap:#8b99a5; --seg-en:#f0a050; --seg-oth:#4a5966;
  --seg-drive:#a9c46a; --seg-make:#5d6d3c; --good:#4cc28a; --warn:#f0a050; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:28px 20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.sign{width:44px;height:44px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 22px/1 var(--display);flex:none}
.brand h1{font-size:34px;line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.top .meta{color:var(--muted);font-size:13px;max-width:46ch}

.grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel+.panel{margin-top:16px}
.panel h2{font-size:20px;margin-bottom:12px}
.label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.unit{font-size:12px;color:var(--muted)}

.km{display:flex;flex-direction:column;gap:6px}
.km .read{display:flex;align-items:baseline;gap:8px}
.odo{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:.04em}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:500 12.5px/1 var(--body);border:1px solid var(--line);background:var(--input);color:var(--ink);padding:6px 9px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}

details.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.adv summary{cursor:pointer;font-weight:600;font-size:14px}
details.adv .fields{margin-top:10px}

/* autot */
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.car{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:4px solid var(--cc)}
.car .head{display:flex;align-items:center;gap:8px}
.car .head input{font-weight:600}
.car .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:6px}
.car .x:hover{color:var(--ink);background:var(--input)}
.car .fields{gap:9px}
/* Mallihaun ehdotuslista: oma lista, koska selaimen datalist näkyy osassa puhelimia läpinäkyvänä */
.pickwrap{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.22);max-height:min(50vh,320px);overflow-y:auto;overscroll-behavior:contain;padding:4px}
.sugg[hidden]{display:none}
.sugg button{display:block;width:100%;text-align:left;padding:9px 10px;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;border-radius:6px;cursor:pointer}
.sugg button:hover,.sugg button[aria-selected="true"]{background:var(--input)}
.sugg .none{padding:9px 10px;color:var(--muted);font-size:14px}
.addcar{border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font:600 15px var(--body);cursor:pointer;min-height:120px}
.addcar:hover{border-color:var(--accent);color:var(--accent)}
.tag{font-size:11.5px;color:var(--muted)}
.insp{display:block;margin-top:6px;font-size:11.5px;color:var(--muted);line-height:1.45}
.insp:empty{display:none}
.insp b{font-weight:600;color:var(--ink)}

/* tulokset */
section.results{margin-top:24px}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sum .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.sum .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cc);flex:none}
.big{font:500 28px/1.1 var(--mono);font-variant-numeric:tabular-nums;border-radius:4px}
/* hetkellinen korostus, kun luku muuttuu */
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}
.big.flash{animation:flash 2.5s ease-out}
@media (prefers-reduced-motion:reduce){.big.flash{animation:none}}
.sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.badge.win{border-color:var(--good);color:var(--good)}
.badge.warn{border-color:var(--warn);color:var(--warn)}

.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:760px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.chart.wide{grid-column:1/-1}
.chart h3{font-size:19px}
.chart p.lead{margin:2px 0 10px;color:var(--muted);font-size:13.5px;max-width:70ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{font-family:var(--body)}
.svgbox{overflow-x:auto}

.notes{margin-top:24px;color:var(--muted);font-size:13px;max-width:90ch}
.notes h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.notes ul{padding-left:18px;margin:6px 0}
.notes a{color:var(--accent)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sharebar{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin:16px 0 4px;padding:12px 14px;border:1px solid var(--accent);border-radius:8px;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.sharebar .hint{margin:0;min-width:0;flex:1 1 220px}
.sharebar .shareinv{font-size:14px;color:var(--ink)}
.sharebar #shareMsg:empty{display:none}
.btn.share{display:inline-flex;align-items:center;gap:8px;font-size:16px;padding:11px 18px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.share:hover{filter:brightness(1.1)}
.btn.share svg{width:18px;height:18px;flex:none}
@media (max-width:560px){.btn.share{width:100%;justify-content:center}}
.sharelink{font-family:var(--mono);font-size:12px;margin-top:4px}
.btn{font:600 13.5px var(--body);border:1px solid var(--line);background:var(--input);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.sm{font-size:12.5px;padding:5px 9px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.phead h2{margin-bottom:0}
@media (prefers-reduced-motion:no-preference){.bar{transition:width .25s ease}}
/* Lisäasetukset: rahoitus ja energia yhdessä taitettavassa osiossa */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--input)}
.seg button{font:600 13.5px/1.25 var(--body);color:var(--ink);background:none;border:0;border-left:1px solid var(--line);padding:9px 6px;cursor:pointer;min-width:0}
.seg button:first-child{border-left:0}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
#payNote{margin-top:4px}
details.more>summary{cursor:pointer;list-style:none;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font:600 20px/1.2 var(--display)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin:0 2px 0 2px;flex:none}
details.more[open]>summary::before{transform:rotate(45deg)}
.morecount{font:600 12.5px/1 var(--body);color:var(--accent)}
.morecount:empty{display:none}
.morepart{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.morepart h2{font-size:18px;margin-bottom:12px}
/* Puhelimen tiivistelmäpalkki: autot ja €/v alareunassa, kunnes tulokset ovat ruudulla */
.dock{display:none}
@media (max-width:900px){
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;
    padding:9px max(14px,env(safe-area-inset-right,0px)) calc(9px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
    background:var(--surface);color:var(--ink);border:0;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.14);
    font:inherit;text-align:left;cursor:pointer}
  .dock.off{visibility:hidden;transform:translateY(110%)}
  body{padding-bottom:calc(var(--dockh,0px) + 48px)}
  html{scroll-padding-bottom:calc(var(--dockh,0px) + 12px)}
}
@media (max-width:900px) and (prefers-reduced-motion:no-preference){.dock{transition:transform .2s ease,visibility .2s}}
.dock .dc{min-width:0;border-left:3px solid var(--cc);padding-left:7px;display:flex;flex-direction:column;gap:1px}
.dock .dn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .dv{font:500 16px/1.2 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.dock .dv small{font:500 11.5px var(--body);color:var(--muted)}
.dock.n4{gap:7px}
.dock.n4 .dv{font-size:14px}
.dock.n4 .dv .yr{display:none}
.dock .db{font-size:10.5px;font-weight:600;color:var(--good);line-height:1.25}
.dock .db:empty{display:none}
.foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.foot a{color:var(--accent)}
.topright{display:flex;flex-direction:column;gap:10px;align-items:flex-end;max-width:46ch}
.langs{display:flex;gap:6px}
.lang{padding:5px 10px;font-size:13px}
.lang[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:700px){.topright{align-items:flex-start}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="sign" aria-hidden="true">€</div>
      <div>
        <h1>CarFootprint</h1>
        <p data-i="tagline"></p>
      </div>
    </div>
    <div class="topright">
      <div class="meta" data-i="meta"></div>
      <div class="langs" role="group" aria-label="Kieli / Language">
        <button class="btn lang" id="langFi" type="button" data-lang="fi">Suomi</button>
        <button class="btn lang" id="langEn" type="button" data-lang="en">English</button>
      </div>
    </div>
  </header>

  <div class="grid">
    <aside>
      <div class="panel">
        <div class="phead"><h2 data-i="drive_h"></h2><button class="btn sm" type="button" data-reset data-i="reset"></button></div>
        <div class="km">
          <span class="label" id="kmLabel" data-i="km_label"></span>
          <div class="read"><span class="odo" id="kmOut">15 000</span><span class="unit" data-i="km_unit"></span></div>
          <input type="range" id="km" min="2000" max="50000" step="500" value="15000" aria-labelledby="kmLabel">
          <div class="chips">
            <button class="chip" data-km="11800" type="button" data-i="chipB"></button>
            <button class="chip" data-km="14500" type="button" data-i="chipAll"></button>
            <button class="chip" data-km="20800" type="button" data-i="chipD"></button>
          </div>
          <p class="hint" data-i="km_hint"></p>
        </div>
        <div class="fields" style="margin-top:14px">
          <div class="field full"><label class="label" for="budget" data-i="budget_l"></label><input type="number" id="budget" min="0" step="500" value="12000"><span class="unit" data-i="budget_u"></span></div>
          <div class="field full"><span class="label" id="payLabel" data-i="pay_l"></span>
            <div class="seg" role="radiogroup" aria-labelledby="payLabel"><button type="button" role="radio" data-pay="cash" data-i="pay_cash"></button><button type="button" role="radio" data-pay="part" data-i="pay_part"></button><button type="button" role="radio" data-pay="loan" data-i="pay_loan"></button></div>
            <span class="unit" id="payNote"></span></div>
        </div>
      </div>

      <details class="panel more" id="more">
        <summary><span data-i="more_h"></span><span class="morecount" id="moreCount"></span></summary>
        <div class="morepart">
        <h2 data-i="own_h"></h2>
        <div class="fields">
          <div class="field full"><label class="label" for="years" data-i="years_l"></label><input type="number" id="years" min="1" max="20" step="1" value="5"><span class="unit" data-i="years_u"></span></div>
          <div class="field full"><label class="label" for="monthly" data-i="monthly_l"></label><input type="number" id="monthly" min="0" step="50" value="" placeholder="–"><span class="unit" data-i="monthly_u"></span></div>
        </div>
        </div>
        <div class="morepart">
        <h2 data-i="fin_h"></h2>
        <div class="fields">
          <div class="field full"><label class="label" for="own" data-i="own_l"></label><input type="number" id="own" min="0" step="500" value="6000"><span class="unit" data-i="own_u"></span></div>
          <div class="field"><label class="label" for="loanRate" data-i="loanRate_l"></label><input type="number" id="loanRate" min="0" max="40" step="0.1" value="4.1"><span class="unit" data-i="loanRate_u"></span></div>
          <div class="field"><label class="label" for="loanFee" data-i="loanFee_l"></label><input type="number" id="loanFee" min="0" step="0.5" value="12.5"><span class="unit" data-i="loanFee_u"></span></div>
          <div class="field"><label class="label" for="loanYears" data-i="loanYears_l"></label><input type="number" id="loanYears" min="1" max="10" step="1" value="5"><span class="unit" data-i="years_u"></span></div>
          <div class="field"><label class="label" for="ownRate" data-i="ownRate_l"></label><input type="number" id="ownRate" min="0" max="20" step="0.5" value="2.5"><span class="unit" data-i="rate_u"></span></div>
        </div>
        <p class="hint" data-i="fin_hint"></p>
        </div>
        <div class="morepart">
        <h2 data-i="energy_h"></h2>
        <div class="fields">
          <div class="field"><label class="label" for="pBens" data-i="petrol"></label><input type="number" id="pBens" step="0.01" value="__P_PETROL__"><span class="unit">€ / l</span></div>
          <div class="field"><label class="label" for="pDies" data-i="diesel"></label><input type="number" id="pDies" step="0.01" value="__P_DIESEL__"><span class="unit">€ / l</span></div>
          <div class="field"><label class="label" for="pEl" data-i="el_home"></label><input type="number" id="pEl" step="0.001" value="__P_ELEC__"><span class="unit" data-i="el_home_u"></span></div>
          <div class="field"><label class="label" for="loss" data-i="loss"></label><input type="number" id="loss" step="1" value="10"><span class="unit">%</span></div>
          <div class="field full"><label class="label" for="elSrc" data-i="elsrc"></label>
            <select id="elSrc">
              <option value="42" data-i="el1"></option>
              <option value="12" data-i="el2"></option>
              <option value="12" data-i="el3"></option>
              <option value="24" data-i="el4"></option>
              <option value="48" data-i="el5"></option>
            </select>
            <span class="unit" data-i="el_note"></span>
          </div>
        </div>
        <p class="hint" data-i="prices_src"></p>
        <details class="adv">
          <summary data-i="ef_sum"></summary>
          <div class="fields">
            <div class="field"><label class="label" for="eBens" data-i="petrol"></label><input type="number" id="eBens" step="0.05" value="2.8"><span class="unit">kg CO₂e / l</span></div>

  notes:`<li><b>Arvonalenema:</b> jäännösarvo = hinta × (1 − arvonalenema-%)<sup>vuodet</sup>. Jos jätät prosentin tyhjäksi, se valitaan auton keski-iän mukaan: alle 3 v 17 %, 3–5 v 10 %, 6–9 v 11 %, 10–19 v 12 %, 20 v tai yli 10 %. Prosentit on laskettu <a href="https://www.vero.fi/henkiloasiakkaat/omaisuus/autovero/autoveron-maara/ajoneuvojen-sovellettuja-verotusarvoja/" target="_blank" rel="noopener">Verohallinnon verotusarvoista</a> (114 000 käytettynä tuotua autoa 2024–2026) vertaamalla saman mallin eri-ikäisiä autoja. Keskimääräistä suurempi ajomäärä (yli 15 000 km/v) laskee jäännösarvoa 0,2 % per 1 000 km vuodessa.</li>
<li><b>Esimerkkiautot</b> valitaan enimmäishinnan mukaan: bensiiniauto on aina Golf (Suomen yleisin keski-ikäinen auto), hybridi Toyota Corolla, Auris tai Yaris ja sähköauto rekisterissä yleisin malli, johon budjetti riittää. Kustakin valitaan nuorin vuosimalli, jonka arvioitu hinta mahtuu budjettiin. Hinta-arviot perustuvat <a href="https://www.vero.fi/henkiloasiakkaat/omaisuus/autovero/autoveron-maara/ajoneuvojen-sovellettuja-verotusarvoja/" target="_blank" rel="noopener">Verohallinnon verotusarvoihin</a> ja mittarilukema mallin keskimääräiseen ajomäärään. Kun muutat esimerkkiautoa, se lakkaa seuraamasta budjettia.</li>
<li><b>Rahoitus:</b> se osa hinnasta, jota oma raha ja vaihtohyvitys eivät kata, rahoitetaan tasaerälainalla. Lainan kustannus on omistusaikana maksettu korko ja kuukausimaksut. Jos auto myydään ennen kuin laina on maksettu, loppu maksetaan myyntihinnasta. Lisäksi autoon sitoutuneelle omalle rahalle lasketaan menetetty tuotto. Enimmäishintaa kalliimmat autot merkitään.</li>
<li><b>Kuukausibudjetti</b> (valinnainen) kertoo, mahtuuko auto kuukausittaiseen rahankäyttöösi. Kuukausimenot ovat se, mitä tililtä lähtee kuukaudessa lainan aikana: lainaerä kuluineen sekä energia ja muut kulut (vero, vakuutus, huolto, renkaat) jaettuna kuukausille. Arvonalenema ja oman rahan menetetty tuotto ovat todellisia kuluja, mutta niistä ei tule kuukausittaista laskua, joten ne eivät ole mukana. Siksi kuukausimenot voivat olla pienemmät tai suuremmat kuin vuosikustannus jaettuna kahdellatoista. Jos laina-aika on omistusaikaa lyhyempi, menot pienenevät lainan jälkeen. Yllättäviä korjauksia ei ole mukana. Budjetin ylittävät autot merkitään.</li>
<li><b>Todellinen kulutus:</b> WLTP-arvo kerrotaan kertoimella, joka on mitattu autojen omista kulutusmittareista (luetaan mm. katsastuksissa). Kerroin on <b>mallikohtainen</b> 367 mallille; muille käytetään merkin tai käyttövoiman keskiarvoa, ja auton kortti kertoo kumman. Bensiiniautot kuluttavat keskimäärin 20 % ja dieselit 18 % yli WLTP:n, mutta mallien väliset erot ovat suuria. Luvut ovat koko EU:sta eivätkä huomioi Suomen talvea.</li>
<li><b>Vanhat autot (vuosimalli 2017 tai vanhempi):</b> niiden virallinen kulutus on mitattu vanhalla NEDC-testillä, joka aliarvioi kulutusta selvästi enemmän kuin WLTP. Laskuri käyttää mallin ja vuosimallin omaa NEDC-arvoa Traficomin rekisteristä ja lisää siihen <a href="https://theicct.org/publication/from-laboratory-to-road-a-2018-update/" target="_blank" rel="noopener">ICCT:n</a> mittaaman eron: 8 % vuoden 2001 autoissa, 38 % vuoden 2014 ja 40 % vuoden 2016 autoissa. Välivuodet on interpoloitu suoraviivaisesti.</li>
<li><b>Lataushybridit:</b> oletuskulutus on mallin oma mitattu keskiarvo, tai jos sitä ei ole, merkin keskiarvo. Koko EU:ssa se on 6,0 l/100 km, kun WLTP lupaa 1,4. Oletuksena 25 % ajosta kulkee sähköllä. Nosta osuutta, jos lataat ahkerasti.</li>
<li><b>Sähköautot:</b> kulutus on mallin WLTP-arvo EEA:n rekisteristä (Suomessa 2025 rekisteröidyt autot; jo myynnistä poistuneille malleille 2020–2022). Mitattua kulutusta ei kerätä täyssähköautoista, joten kerroin 1,20 on oletus. Akun kulumisesta laskuri ei lisää kulua: <a href="https://www.geotab.com/blog/ev-battery-health/" target="_blank" rel="noopener">Geotabin tutkimuksessa</a> (22 700 autoa) kapasiteetti laski keskimäärin 2,3 % vuodessa, kotona ladatuissa noin 1,5 % ja paljon pikaladatuissa noin 3 %. Kulunut akku lyhentää toimintamatkaa, mutta ei juuri lisää kulutusta. Akun vaihdoista ei löytynyt luotettavaa yleisyyslukua.</li>
<li><b>Huolto ja korjaukset</b> kasvavat ajokilometrien mukaan. Kentän arvo on vähän ajetun auton (alle 80 000 km) taso, ja se on karkea oletus. Kasvu perustuu <a href="https://advocacy.consumerreports.org/wp-content/uploads/2020/10/TCO-Fact-Sheet-Chapter-2-FINAL.pdf" target="_blank" rel="noopener">Consumer Reportsin</a> omistajakyselyihin (Yhdysvallat, 2020): 80 000–160 000 km ajetun polttomoottoriauton huolto ja korjaukset maksavat kilometriä kohden 2,1-kertaisesti ja sitä enemmän ajetun 2,8-kertaisesti. Sähköautoilla kertoimet ovat 2,3 ja 3,6, mutta lähtötaso on alle puolet polttomoottoriauton tasosta. Laskuri laskee kertoimen keskiarvona sille matkalle, jonka ajat omistusaikana; auton kortti näyttää sen. Lataushybrideille ja tavallisille hybrideille käytetään polttomoottoriauton kertoimia. Lähde on yhdysvaltalainen, joten euromäärät ovat laskurin omia ja vain kasvu on lähteestä. Saksalainen <a href="https://www.datgroup.com/fileadmin/at/DAT_Report/2025/DAT-Report-2025-Kurzbericht.pdf" target="_blank" rel="noopener">DAT-Report 2025</a> näyttää, että yli 6-vuotiaiden autojen omistajat käyttävät huoltoon jopa vähemmän kuin 3–6-vuotiaiden: vanhan auton omistaja usein säästää huolloista, mikä voi tulla myöhemmin kalliiksi.</li>
<li><b>Sähkön päästöt:</b> Suomen tuotannon suorat päästöt 26 g/kWh (Energiateollisuus, 2025) + tuotantoketju 16 g/kWh (Ilmastopaneeli). Tuotantotapojen elinkaariarvot IPCC:n ja UNECE:n mukaan.</li>
<li><b>Lähteet:</b> malliluettelo ja CO₂-arvot <a href="https://avoindata.suomi.fi/data/fi/dataset/ajoneuvojen-avoin-data" target="_blank" rel="noopener">Traficomin avoimesta datasta</a> 30.6.2026, mitattu kulutus <a href="https://climate-energy.eea.europa.eu/topics/transport/real-world-emissions/additional_information" target="_blank" rel="noopener">EEA:n OBFCM-aineistosta</a> ja sähkönkulutus <a href="https://co2cars.apps.eea.europa.eu/" target="_blank" rel="noopener">EEA:n uusien autojen rekisteristä</a> (Suomessa 2020–2025 rekisteröidyt). Kaikki CC BY 4.0. Arvonalenema Verohallinnon verotusarvoista ja NEDC-korjaus ICCT:ltä. Koko laskentamalli ja käytetty data ovat <a href="https://github.com/TapioT1986/CarFootprint" target="_blank" rel="noopener">GitHubissa</a>.</li>
<li><b>Ajoneuvovero</b> lasketaan vuoden 2026 verotaulukoista (<a href="https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2024/814" target="_blank" rel="noopener">ajoneuvoverolaki, muutos 814/2024</a>). Perusvero määräytyy auton virallisen CO₂-päästön mukaan, ja se on 106–654 €/v. Päästö lasketaan mallin virallisesta kulutuksesta: vuosimallit 2017 ja vanhemmat NEDC-taulukolla 1, uudemmat WLTP-taulukolla 1 A. Sähköautoista, jotka on otettu käyttöön 1.10.2021 tai myöhemmin, perusvero on 171 €/v; laskuri pitää vuosimallia 2022 ja uudempia tällaisina. Lataushybridien perusvero on alin porras, koska niiden WLTP-päästö on lähes aina alle 103 g/km. Diesel-, sähkö- ja lataushybridiautoista maksetaan lisäksi käyttövoimaveroa: 5,5, 1,9 tai 0,95 senttiä päivässä jokaiselta kokonaismassan alkavalta 100 kg:lta. Kokonaismassa ei ole vielä malliluettelossa, joten se on oletus (diesel 2 000 kg, sähkö 2 200 kg, lataushybridi 2 300 kg). Oman auton kokonaismassa löytyy rekisteröintitodistuksesta, ja sen voi vaihtaa kohdassa Lisää oletuksia. Hallituksen esitys HE 173/2026 alentaisi yli 10-vuotiaiden polttomoottoriautojen perusveroa keskimäärin noin 6 €/v. Esitys on vielä eduskunnan käsittelyssä, eikä sitä ole otettu huomioon.</li>
<li><b>Katsastus ja elinikä</b> (tietoa autokortilla, ei vaikuta laskelmaan) tulevat <a href="https://trafi2.stat.fi/PXWeb/pxweb/fi/TraFi/TraFi__Katsastuksen_vikatilastot/" target="_blank" rel="noopener">Traficomin katsastuksen vikatilastoista</a> (määräaikaiskatsastukset 2017–2025, avoin data CC BY 4.0). Traficom tilastoi mallisarjoittain, eli kaikki saman mallin käyttövoimat ja sukupolvet ovat yhdessä. Hylkäysprosentti on uusimmalta vuodelta auton ostoiän mukaan, tai lähimmältä iältä, josta on vähintään 50 katsastusta. Viat ovat hylkäykseen johtaneiden vikojen osuudet kaikista ikäluokista. Elinikä lasketaan katsastusmääristä: 10 vuoden iästä alkaen autot katsastetaan joka vuosi, joten saman vuoden autojen katsastusmäärä kertoo, montako on vielä liikenteessä. Ennen 10 vuoden ikää poistuneet autot (kolarit, vienti) eivät näy luvussa. Käytettynä tuodut autot kasvattavat lukuja, ja jos katsastusmäärät kasvavat iän mukana, elinikää ei arvioida. Kun yli puolet on vielä liikenteessä 20-vuotiaana, ikä, jossa puolet on poistunut, on arvio: vuosittainen poistumaosuus jatketaan suorana viivana iän 10–19 havainnoista. Kenttä Käyttöikä (päästöjen jakaminen) on edelleen oletus 18–20 vuotta.</li>
<li><b>Valmistuspäästöt</b> ovat <a href="https://theicct.org/publication/electric-cars-life-cycle-analysis-emissions-europe-jul25/" target="_blank" rel="noopener">ICCT:n</a> EU:n elinkaaritutkimuksesta (2025) keskikokoiselle autolle, kuten Golfille. Auton valmistus ja kierrätys ilman akkua: bensiini-, diesel- ja hybridiauto 8,2 t, lataushybridi 8,6 t ja sähköauto 7,5 t CO₂e. Akun valmistus on 72,8 kg CO₂e/kWh, kun painotetaan solujen valmistusmaita (30 % Eurooppa, 56 % Kiina). Oletusakku on EU:ssa 2023 myytyjen keskikokoisten autojen keskiarvo: sähköauto 53,4 kWh (3,9 t), lataushybridi 13,3 kWh (1,0 t). Akun koon voi vaihtaa oman auton mukaiseksi kohdassa Lisää oletuksia. Pienen auton valmistus tuottaa vähemmän ja ison enemmän päästöjä. Valmistuspäästöt jaetaan auton koko käyttöiälle. ICCT:n mukaan akut kestävät yleensä auton käyttöiän: alle 1 %:ssa vuoden 2016 jälkeen myydyistä sähköautoista akku on vaihdettu (Recurrent, 20 000 autoa).</li>
<li><b>Jaa vertailu</b> tekee lyhyen linkin, jossa on vain valitut mallit ja muutetut luvut; kaikki muu lasketaan avattaessa uudelleen. Tiedot ovat linkin #-merkin jälkeisessä osassa, jota selain ei lähetä palvelimelle, eikä sivu kerää mitään tietoa. Linkkiin tallentuvat vain muutetut asetukset, joten avaaja näkee ajantasaiset polttoaineen ja sähkön hinnat, ellet ole muuttanut niitä. Jaetun linkin avaaminen ei hävitä avaajan omia autoja: ne voi palauttaa.</li>
<li>Vakuutus ja huollon lähtötaso ovat karkeita oletuksia. Tämä on luonnos, ei tarkistettu vertailu.</li>`,

  notes_h:'How the calculation works', reset:'Reset all', reset_q:'Reset all settings and example cars to the defaults? Cars you added or changed will be removed.',
  notes:`<li><b>Finland only, for now:</b> fuel and electricity prices, taxes, grid emissions and the model list describe Finland. The method works for any EU country once those inputs are changed.</li>
<li><b>Depreciation:</b> residual value = price × (1 − depreciation %)<sup>years</sup>. If you leave the percentage blank, it is chosen by the car's average age during ownership: under 3 years 17%, 3–5 years 10%, 6–9 years 11%, 10–19 years 12%, 20 years or more 10%. The rates come from the <a href="https://www.vero.fi/henkiloasiakkaat/omaisuus/autovero/autoveron-maara/ajoneuvojen-sovellettuja-verotusarvoja/" target="_blank" rel="noopener">Finnish Tax Administration's taxation values</a> (114,000 cars imported used in 2024–2026), comparing cars of the same model at different ages. Above-average mileage (over 15,000 km/yr) lowers the residual value by 0.2% per 1,000 km per year.</li>
<li><b>Example cars</b> follow your maximum price: the petrol car is always a Golf (Finland's most common car of median age), the hybrid a Toyota Corolla, Auris or Yaris, and the electric car the most common model in the register that fits your budget. Each is the youngest model year whose estimated price fits. Price estimates come from the <a href="https://www.vero.fi/henkiloasiakkaat/omaisuus/autovero/autoveron-maara/ajoneuvojen-sovellettuja-verotusarvoja/" target="_blank" rel="noopener">Tax Administration's taxation values</a>, mileage from the model's average annual mileage. Once you edit an example car, it stops following the budget.</li>
<li><b>Financing:</b> whatever your own money and trade-in do not cover is financed with an annuity loan. Its cost is the interest and monthly fees paid during ownership. If the car is sold before the loan is repaid, the rest is paid from the sale. On top of that, own money tied up in the car is charged the return it would have earned elsewhere. Cars above your maximum price are flagged.</li>
<li><b>Monthly budget</b> (optional) shows whether the car fits what you can spend each month. Monthly outgoings are what leaves your account each month while the loan runs: the loan payment with fees, plus energy and other costs (tax, insurance, servicing, tyres) spread over the months. Depreciation and the lost return on own money are real costs but never arrive as a monthly bill, so they are left out. That is why monthly outgoings can be lower or higher than the annual cost divided by twelve. If the loan is shorter than the ownership period, outgoings drop once it is paid off. Unexpected repairs are not included. Cars over the budget are flagged.</li>
<li><b>Real-world consumption:</b> the WLTP figure is multiplied by a factor measured from the cars' own on-board fuel consumption meters (read at periodic inspections, among other ways). The factor is <b>model-specific</b> for 367 models; the rest fall back to a brand or powertrain average, and each car's card says which one is in use. On average petrol cars use 20% and diesels 18% more than WLTP, but models differ widely. The figures cover the whole EU and do not account for Finnish winters.</li>
<li><b>Older cars (model year 2017 or earlier):</b> their official consumption was measured with the old NEDC test, which understates consumption far more than WLTP. The calculator uses the model's own NEDC figure for that model year from the Traficom register and adds the gap measured by the <a href="https://theicct.org/publication/from-laboratory-to-road-a-2018-update/" target="_blank" rel="noopener">ICCT</a>: 8% for 2001 cars, 38% for 2014 and 40% for 2016 cars, interpolated linearly in between.</li>
<li><b>Plug-in hybrids:</b> the default consumption is the model's own measured average where there is one, otherwise the brand's. Across the EU that is 6.0 l/100 km, where WLTP promises 1.4. By default 25% of driving is electric. Raise the share if you charge diligently.</li>
<li><b>Electric cars:</b> consumption is the model's WLTP figure from the EEA register (cars registered in Finland in 2025; 2020–2022 for models no longer sold). Measured consumption is not collected from battery-electric cars, so the 1.20 factor is an assumption. Battery wear adds no cost in the calculator: in a <a href="https://www.geotab.com/blog/ev-battery-health/" target="_blank" rel="noopener">Geotab study</a> (22,700 cars) capacity fell by 2.3% a year on average, about 1.5% for cars charged mostly at home and about 3% for heavy fast-charger users. A worn battery shortens the range but barely raises consumption. No reliable figure was found for how often batteries are replaced.</li>
<li><b>Servicing and repairs</b> rise with mileage. The value in the field is the level for a low-mileage car (under 80,000 km) and is a rough assumption. The rise follows <a href="https://advocacy.consumerreports.org/wp-content/uploads/2020/10/TCO-Fact-Sheet-Chapter-2-FINAL.pdf" target="_blank" rel="noopener">Consumer Reports</a> owner surveys (United States, 2020): per kilometre, a combustion car with 80,000–160,000 km costs 2.1 times as much to service and repair, and beyond that 2.8 times. For electric cars the factors are 2.3 and 3.6, but from a starting level under half that of a combustion car. The calculator averages the factor over the distance you drive during ownership; each car's card shows it. Plug-in and regular hybrids use the combustion factors. The source is American, so the euro amounts are the calculator's own and only the rise comes from the source. The German <a href="https://www.datgroup.com/fileadmin/at/DAT_Report/2025/DAT-Report-2025-Kurzbericht.pdf" target="_blank" rel="noopener">DAT Report 2025</a> shows owners of cars over 6 years old spending even less on servicing than owners of 3–6-year-old cars: owners of old cars often save on servicing, which can cost more later.</li>
<li><b>Electricity emissions:</b> direct emissions of Finnish generation 26 g/kWh (Finnish Energy, 2025) + supply chain 16 g/kWh (Finnish Climate Change Panel). Lifecycle values per generation type follow IPCC and UNECE.</li>
<li><b>Sources:</b> model list and CO₂ values from <a href="https://avoindata.suomi.fi/data/fi/dataset/ajoneuvojen-avoin-data" target="_blank" rel="noopener">Traficom open vehicle data</a> (30 June 2026), measured consumption from the <a href="https://climate-energy.eea.europa.eu/topics/transport/real-world-emissions/additional_information" target="_blank" rel="noopener">EEA's OBFCM dataset</a> and electricity consumption from the <a href="https://co2cars.apps.eea.europa.eu/" target="_blank" rel="noopener">EEA new-car register</a> (cars registered in Finland 2020–2025). All CC BY 4.0. Depreciation from the Finnish Tax Administration's taxation values and the NEDC correction from the ICCT. The full calculation model and the data behind it are <a href="https://github.com/TapioT1986/CarFootprint" target="_blank" rel="noopener">on GitHub</a>.</li>
<li><b>Vehicle tax</b> follows the 2026 tax tables (<a href="https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2024/814" target="_blank" rel="noopener">Vehicle Tax Act, amendment 814/2024</a>). The base tax depends on the car's official CO₂ emissions and is €106–654 a year. The emissions are worked out from the model's official consumption: model years 2017 and older use the NEDC table 1, newer cars the WLTP table 1 A. Electric cars first registered on or after 1 October 2021 pay €171 a year; the calculator treats model years 2022 and newer as such. Plug-in hybrids pay the lowest band, as their WLTP emissions are almost always below 103 g/km. Diesel, electric and plug-in hybrid cars also pay a propulsion tax: 5.5, 1.9 or 0.95 cents a day for every started 100 kg of total mass. Total mass is not yet in the model list, so it is an assumption (diesel 2,000 kg, electric 2,200 kg, plug-in hybrid 2,300 kg). Your own car's total mass is on its registration certificate; change it under More assumptions. Government proposal HE 173/2026 would lower the base tax of combustion cars over 10 years old by about €6 a year on average. It is still before Parliament and is not included.</li>
<li><b>Inspections and lifetime</b> (information on the car card, not used in the calculation) come from <a href="https://trafi2.stat.fi/PXWeb/pxweb/fi/TraFi/TraFi__Katsastuksen_vikatilastot/" target="_blank" rel="noopener">Traficom's periodic inspection statistics</a> (inspections 2017–2025, open data CC BY 4.0). Traficom groups cars by model series, so all powertrains and generations of a model are together. The failure rate is for the latest year at the car's age at purchase, or the nearest age with at least 50 inspections. The faults are shares of the faults that caused a failure, all ages together. Lifetime is worked out from inspection counts: from 10 years on, cars are inspected every year, so the count for one model year shows how many are still on the road. Cars that left the road before 10 years (crashes, exports) do not show in the figure. Cars imported used raise the counts, and if the counts rise with age, no lifetime is estimated. When more than half are still on the road at 20, the age at which half have left is an estimate: the yearly drop-out rate is continued as a straight line from ages 10–19. The Lifetime field (spreading manufacturing emissions) is still the 18–20-year assumption.</li>
<li><b>Manufacturing emissions</b> come from the <a href="https://theicct.org/publication/electric-cars-life-cycle-analysis-emissions-europe-jul25/" target="_blank" rel="noopener">ICCT</a> EU life-cycle study (2025) for a medium-size car such as the Golf. Making and recycling the car without its battery: petrol, diesel and hybrid cars 8.2 t, plug-in hybrids 8.6 t and electric cars 7.5 t CO₂e. Battery production is 72.8 kg CO₂e per kWh, weighted by where the cells are made (30% Europe, 56% China). The default battery is the average of medium-size cars sold in the EU in 2023: 53.4 kWh for electric cars (3.9 t) and 13.3 kWh for plug-in hybrids (1.0 t). You can set your own car's battery size under More assumptions. A small car takes less to make and a large one more. Manufacturing emissions are spread over the car's whole lifetime. According to the ICCT, batteries usually outlast the car: fewer than 1% of electric cars sold after 2016 have had their battery replaced (Recurrent, 20,000 cars).</li>
<li><b>Share comparison</b> makes a short link holding only the chosen models and the numbers you changed; everything else is recalculated when it opens. The data sits after the # sign, which browsers never send to the server, and the page collects nothing. Only settings you changed go into the link, so whoever opens it sees current fuel and electricity prices unless you changed them. Opening a shared link does not lose the opener's own cars: they can be restored.</li>
<li>Insurance and the starting level of servicing are rough assumptions. This is a draft, not a verified comparison.</li>`,

// Valmistuspäästöt: ICCT 2025 (EU, keskikokoinen auto). Auto ilman akkua 8,2 t (bensiini, diesel, hybridi),
// 8,6 t (lataushybridi), 7,5 t (sähkö); akku 72,8 kg CO2e/kWh (NMC622, solujen alkuperämaiden painotus).
const BATT_T_PER_KWH = 0.0728;
const OLD_MAKE = {B:7, D:8, H:8, P:10, E:12}; // ennen EX_VERSION 7 (akku sisältyi)
// Akun koko mallin nimestä, jos se on siinä (esim. "LEAF 40KWH", "BORN 58/62 KWH" -> 62)
const battFromName = r => { const m = /(\d+(?:[.,]\d+)?)\s*KWH/i.exec(r[1]); return m ? num(m[1]) : null; };
const battT = c => (c.pt==='E'||c.pt==='P') ? Math.max(0, num(c.batt,0))*BATT_T_PER_KWH : 0;
// Huollon ja korjausten kasvu mittarilukeman mukaan: Consumer Reports 2020 (USA),
// $/maili 0–50k, 50–100k ja 100–200k mailia. Polttomoottori 0,028/0,060/0,079, sähkö 0,012/0,028/0,043.
const SERV_KM = [80467, 160934]; // 50 000 ja 100 000 mailia
const SERV_F = {ice:[1, .060/.028, .079/.028], ev:[1, .028/.012, .043/.012]};
// Kertoimen keskiarvo omistusaikana ajetulle matkalle (mittarilukemasta a lukemaan b)
function servFactor(pt, a, b){
  const f = SERV_F[pt==='E'?'ev':'ice'], edges = [0, ...SERV_KM, Infinity];
  if (!(b > a)) { let k = 0; while (a >= edges[k+1]) k++; return f[k]; }
  let sum = 0;
  for (let k=0; k<f.length; k++) sum += Math.max(0, Math.min(b, edges[k+1]) - Math.max(a, edges[k])) * f[k];
  return sum/(b-a);
} // vero oli ennen osa muita kuluja (tallennukset ennen EX_VERSION 5)
// Ajoneuvovero 2026: perusvero CO2-päästön mukaan (taulukko 1 = NEDC, 1 A = WLTP)
// + käyttövoimavero jokaiselta kokonaismassan alkavalta 100 kg:lta. Senttiä päivässä -> €/v.
const CO2_L = {B:23.3, H:23.3, D:26.4}; // g/km litraa kohden, kuten tools/build.py
function vehicleTax(c){
  let g = 0, tbl = VTAX.t1a;
  if ('BDH'.includes(c.pt)){ g = Math.round(c.fuel*CO2_L[c.pt]); if (isNedc(c)) tbl = VTAX.t1; }
  let base = tbl[Math.max(0, Math.min(400, g))];
  if (c.pt==='E' && regYear(c) >= 2022) base += VTAX.ev_new_add; // käyttöön 1.10.2021 tai myöhemmin
  const prop = (VTAX.propulsion_per_100kg[c.pt]||0) * Math.ceil(Math.max(0, num(c.mass,0))/100);
  return {g, base:base*3.65, prop:prop*3.65, total:(base+prop)*3.65};
}
const normB = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
// Asettaa auton kulutusoletukset mitatun datan mukaan
function applyRW(c, brandName, kwh, rwVal, rwN){
  const b = RW.brand[normB(brandName)] || {}, d = PT_DEF[c.pt];
  c.rw = null;
  if (c.pt==='B'||c.pt==='H'||c.pt==='D'){
    const k = c.pt==='D'?'D':'P';
    if (rwVal){ c.real = rwVal; c.rw = {t:'model', n:rwN}; }               // tämän mallin mitattu kulutus
    else if (b[k]){ c.real = +b[k][0].toFixed(2); c.rw = {t:'brand', brand:brandName, n:b[k][1]}; }
    else { c.real = +RW.fleet[k].k.toFixed(2); c.rw = {t:'fleet', n:RW.fleet[k].n}; }
  } else if (c.pt==='P'){
    const f = rwVal || (b.PE ? b.PE[0] : RW.fleet.PE.ob);
    c.share = 25; c.real = 1; c.fuel = +(f/0.75).toFixed(1); c.kwh = kwh ?? d.kwh;
    c.rw = {t:rwVal?'model':(b.PE?'brand':'fleet'), brand:brandName,
            n:rwVal?rwN:(b.PE?b.PE[1]:RW.fleet.PE.n), avg:f, kwhReg:kwh!=null};
  } else { c.kwh = kwh ?? d.kwh; c.real = d.real; c.rw = {t:'ev', kwhReg:kwh!=null}; }
}
// Arvonalenema iän mukaan, Verohallinnon verotusarvoista (data/depreciation.json)
const AGE_DEP = [[0,.17],[3,.10],[6,.11],[10,.12],[20,.10]];
// NEDC-testin ja todellisen kulutuksen ero (ICCT, From laboratory to road 2015 ja 2018)
const CUR_YEAR = new Date().getFullYear(), LAST_NEDC = 2017;
function nedcGap(y){ const P = [[2001,.08],[2014,.38],[2016,.40],[2017,.39]];
  if (y<=P[0][0]) return P[0][1]; if (y>=P[P.length-1][0]) return P[P.length-1][1];
  for (let i=1;i<P.length;i++) if (y<=P[i][0]){ const [a,ga]=P[i-1],[b,gb]=P[i]; return ga+(gb-ga)*(y-a)/(b-a); } }
const regYear = c => CUR_YEAR - Math.round(c.age||0);
const isNedc = c => 'BDH'.includes(c.pt) && regYear(c) <= LAST_NEDC;
const findRow = ([b,m,pt]) => CATALOG.find(r => r[0]===b && r[1].toUpperCase()===m.toUpperCase() && r[2]===pt);
const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];

// Perusteet ja lähteet: Traficomin rekisteri 30.6.2026 ja Verohallinnon verotusarvot 2025-2026.
// Esimerkkiautot valitaan enimmäishinnan mukaan (data/budget_cars.json):
// [paikka, merkki, malli, nimi, arvo uutena (Verohallinnon verotusarvoista), viimeinen vuosimalli]
const BUDGET_CARS = [
  ["B", "Volkswagen", "GOLF", "Golf", 33400],
  ["H", "Toyota", "Corolla", "Corolla", 39200],
  ["H", "Toyota", "Auris", "Auris", 38900, 2019],
  ["H", "Toyota", "Yaris", "Yaris", 28900],
  ["E", "Tesla", "Model Y", "Tesla Model Y", 53800],
  ["E", "Tesla", "MODEL 3", "Tesla Model 3", 47000],
  ["E", "Volkswagen", "ID.3 PRO 150 KW", "VW ID.3", 37000],
  ["E", "Hyundai", "KONA", "Hyundai Kona", 37600],
  ["E", "Kia", "NIRO", "Kia Niro", 39000],
  ["E", "Nissan", "LEAF 40KWH", "Nissan Leaf", 24500],
  ["E", "Volkswagen", "GOLF", "VW e-Golf", 29000, 2020],
  ["E", "Renault", "ZOE", "Renault Zoe", 24700]
];
const SLOTS = ['B','E','H'];
const rateAt = a => { let r = AGE_DEP[0][1]; for (const [x,q] of AGE_DEP) if (a>=x) r=q; return r; };
const depFactor = a => { let d = 1; for (let t=0; t<a; t++) d *= 1-rateAt(t); return d; };
// Nuorin vuosimalli, jonka arvioitu hinta mahtuu budjettiin, tai null.
function fitBudget(c, budget){
  const r = findRow([c[1],c[2],c[0]]); if (!r) return null;
  let [y0,y1] = String(r[5]).split('–').map(Number);
  if (c[5]) y1 = Math.min(y1, c[5]); // mallin valmistus päättyi (rekisterissä myöhempiä tuonteja)
  const minAge = Math.max(0, CUR_YEAR-y1), maxAge = CUR_YEAR-y0;
  for (let a=minAge; a<=maxAge; a++){ const v = c[4]*depFactor(a); if (v <= budget) return {c, r, age:a, price:Math.floor(v/100)*100}; }
  return {c, r, age:maxAge, price:Math.floor(c[4]*depFactor(maxAge)/100)*100, over:true};
}
function pickExample(slot, budget){
  const opts = BUDGET_CARS.filter(c => c[0]===slot).map(c => fitBudget(c, budget)).filter(Boolean);
  const ok = opts.filter(o => !o.over);
  if (slot==='E') return ok.length ? ok.sort((a,b)=>b.r[4]-a.r[4])[0] : opts.sort((a,b)=>a.price-b.price)[0];
  return ok[0] || opts[opts.length-1];
}
const exName = (ex, pt) => T('ex_name')(ex.label, ex.year, pt);
function exampleCar(slot, budget){
  const o = pickExample(slot, budget>0 ? budget : 12000);
  const c = newCar({pick:[o.c[1],o.c[2],o.c[0]], price:o.price, age:o.age, dep:'',
    odo:Math.round(o.age*(o.r[6]||14000)/1000)*1000});
  c.ex = {slot, label:o.c[3], year:CUR_YEAR-o.age}; c.exAuto = true; c.name = exName(c.ex, c.pt);
  return c;
}
const examples = () => SLOTS.map(sl => exampleCar(sl, num($('budget').value, 12000)));

const fmt = (n,d=0) => (isFinite(n)?n:0).toLocaleString(T('locale'),{maximumFractionDigits:d,minimumFractionDigits:d});
const num = (v,def=0) => { const x = parseFloat(String(v).replace(',','.')); return isFinite(x)?x:def; };

// Asettaa kulutusoletukset rekisteririvistä ja auton iästä.
function fromRow(c, r){
  const d = PT_DEF[r[2]];
  c.fuel = r[3] ?? d.fuel; c.real = d.real; c.std = null;
  applyRW(c, r[0], r[7], r[9], r[10]);
  if (isNedc(c) && r[11] && r[11].length){
    const y = regYear(c), e = r[11].reduce((b,x)=>Math.abs(x[0]-y)<Math.abs(b[0]-y)?x:b);
    c.fuel = e[1]; c.real = +(1+nedcGap(e[0])).toFixed(2); c.std = {year:e[0]};
  }
  c.autoFuel = true;
}
// Ikä muuttui: päivitä kulutus, ellei käyttäjä ole itse muuttanut sitä.
function refreshStd(c){
  if (c.autoFuel === false || !'BDH'.includes(c.pt)) return;
  if (c.picked) return fromRow(c, c.picked);
  const d = PT_DEF[c.pt];
  if (isNedc(c)){ c.real = +(1+nedcGap(regYear(c))).toFixed(2); c.std = {year:regYear(c), manual:true}; }
  else { c.real = d.real; c.std = null; }
}
let cars = [];
function newCar(o={}){
  const pt = o.pt || (o.pick && o.pick[2]) || 'B', d = PT_DEF[pt];
  const c = {name:o.name||T('new_car'), exKey:null, ex:o.ex??null, exAuto:o.exAuto??false, pt, price:o.price??20000, age:o.age??0, odo:o.odo??0, dep:o.dep??'',
    fuel:o.fuel??d.fuel, kwh:o.kwh??d.kwh, share:o.share??d.share, other:o.other??(d.ins+d.tyre), serv:o.serv??d.serv, tax:o.tax??'', mass:o.mass??d.mass,
    make:o.make??d.make, batt:o.batt??d.batt, life:o.life??d.life, real:o.real??d.real, rw:o.rw??null};
  c.std = o.std ?? null; c.autoFuel = o.autoFuel ?? (o.fuel===undefined);
  if (o.pick){ const r = findRow(o.pick); if (r){ c.picked = r; fromRow(c, r); if (o.batt===undefined) c.batt = battFromName(r) ?? c.batt; } }
  else if (o.brand) applyRW(c, o.brand, o.kwhReg);
  else if (o.std===undefined && o.real===undefined) refreshStd(c);
  return c;
}

// Ehdotuslista: kaikki kirjoitetut sanat löytyvät mallin nimestä
function suggest(inp){
  const i = inp.dataset.pick, box = $('sg'+i); if (!box) return;
  const words = normS(inp.value).split(' ').filter(Boolean);
  if (!words.length) return closeSugg(inp);
  const hits = modelIdx.filter(m => words.every(w => m[1].includes(w))).slice(0,40);
  box.innerHTML = hits.length ? hits.map((m,j)=>`<button type="button" role="option" tabindex="-1" id="sg${i}_${j}" aria-selected="false">${esc(m[0])}</button>`).join('')
    : `<div class="none">${T('pick_none')}</div>`;
  box.hidden = false; box.scrollTop = 0;
  inp.setAttribute('aria-expanded','true'); inp.removeAttribute('aria-activedescendant');
}
function closeSugg(inp){
  const box = $('sg'+inp.dataset.pick); if (box){ box.hidden = true; box.innerHTML = ''; }
  inp.setAttribute('aria-expanded','false'); inp.removeAttribute('aria-activedescendant');

// Tasaerälainan kustannus omistusaikana: korot ja kuukausimaksut vuotta kohden,
// keskimääräinen lainapääoma sekä kuukausierä. Myynnissä jäljellä oleva laina maksetaan pois.
function loanCost(P, r, fee, years, own){
  if (P <= 0) return {perYear:0, avgBal:0, pay:0};
  const N = Math.round(years*12), M = Math.round(own*12), i = r/12;
  const pay = i>0 ? P*i/(1-Math.pow(1+i,-N)) : P/N;
  let bal = P, interest = 0, fees = 0, balSum = 0;
  for (let m=0; m<M; m++){
    balSum += bal;
    if (bal <= 0) continue;
    const it = bal*i; interest += it; fees += fee; bal = Math.max(0, bal - (pay - it));
  }
  return {perYear:(interest+fees)/own, avgBal:balSum/M, pay:pay+fee};
}

// --- laskenta (sama malli kuin Excel-prototyypissä) ---
function calc(c, G, km){
  km = km ?? G.km;
  const n = G.years;
  const elShare = c.pt==='E'?1:(c.pt==='P'?Math.min(1,Math.max(0,c.share/100)):0);
  let rate;
  if (c.dep===''||c.dep===null||!isFinite(num(c.dep,NaN))){
    const mid = c.age + n/2; rate = AGE_DEP[0][1];
    for (const [a,r] of AGE_DEP) if (mid>=a) rate=r;
  } else rate = num(c.dep)/100;
  const kmAdj = Math.max(0, 1 - 0.002*Math.max(0,km-15000)/1000*n);
  const resid = Math.max(0, c.price*Math.pow(1-rate,n)*kmAdj);
  const dep = (c.price-resid)/n;
  // Rahoitus: tasaerälaina sille osalle, jota oma raha ei kata
  const loan = Math.max(0, c.price - G.own), L = loanCost(loan, G.loanRate, G.loanFee, G.loanYears, n);
  const ownTied = Math.max(0, (c.price+resid)/2 - L.avgBal);
  const cap = L.perYear + ownTied*G.rate;
  const litres = km/100*c.fuel*c.real*(1-elShare);
  const kwh = km/100*c.kwh*c.real*elShare*(1+G.loss);
  const fuelPrice = c.pt==='D'?G.pD:G.pB, fuelEm = c.pt==='D'?G.eD:G.eB;
  const energy = litres*fuelPrice + kwh*G.pE;
  const vt = vehicleTax(c), autoTax = c.tax===''||c.tax==null||!isFinite(num(c.tax,NaN));
  const tax = autoTax ? vt.total : num(c.tax);
  const servF = servFactor(c.pt, Math.max(0,num(c.odo,0)), Math.max(0,num(c.odo,0)) + km*n), serv = num(c.serv,0)*servF;
  const other = c.other + tax + serv;
  const total = dep+cap+energy+other;
  const drive = litres*fuelEm + kwh*G.eEl;
  const makeT = num(c.make,0) + battT(c); // t CO2e: auto + akku
  const make = c.life>0 ? makeT*1000/c.life : 0;
  // Kuukausimenot (kassavirta): lainaerä kuluineen + energia ja muut kulut kuukautta kohden.
  // Arvonalenema ja oman rahan tuotto eivät ole kuukausittaisia maksuja.
  const runMo = (energy+other)/12, cash = L.pay + runMo, cashAfter = (L.pay>0 && G.loanYears<n) ? runMo : null;
  return {rate,resid,dep,cap,loan,pay:L.pay,cash,cashAfter,energy,other,tax,vt,autoTax,serv,servF,total,drive,make,makeT,em:drive+make,litres,kwh,
    endAge:c.age+n, endOdo:c.odo+km*n};
}

// --- kaaviot ---
function hbars(el, rows, segs, unit){
  const W = 400, rowH = 40, top = 4, left = 128, right = 58;
  const H = top + rows.length*rowH + 4;
  const max = Math.max(1, ...rows.map(r => segs.reduce((s,k)=>s+r[k],0)));
  const sx = v => v/max*(W-left-right);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${unit}">`;
  rows.forEach((r,i) => {
    const y = top + i*rowH; let x = left;
    s += `<circle cx="10" cy="${y+16}" r="5" fill="${r.color}"/><text x="22" y="${y+20}" font-size="13" fill="var(--ink)">${esc(trunc(r.name,15))}</text>`;
    segs.forEach(k => { const w = sx(r[k]); if (w>0) s += `<rect x="${x}" y="${y+4}" width="${w}" height="24" fill="var(--seg-${k})" rx="2"><title>${esc(r.name)}: ${fmt(r[k])} ${unit}</title></rect>`; x += w; });
    const tot = segs.reduce((a,k)=>a+r[k],0);
    s += `<text x="${x+6}" y="${y+21}" font-size="13" font-family="var(--mono)" fill="var(--ink)">${fmt(tot)}</text>`;
  });
  el.innerHTML = s + '</svg>';
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function trunc(t,n){return t.length>n?t.slice(0,n-1)+'…':t;}

function breakEven(el, G){
  const W = 900, H = 320, L = 64, R = 20, T0 = 14, B = 40;
  const kms = []; for (let k=2000;k<=50000;k+=1000) kms.push(k);
  const series = cars.map((c,i) => ({c, color:COLORS[i], pts:kms.map(k=>calc(c,G,k).total)}));
  const all = series.flatMap(s=>s.pts);
  const ymax = Math.ceil(Math.max(...all)*1.05/1000)*1000, ymin = Math.max(0, Math.floor(Math.min(...all)*0.9/1000)*1000);
  const X = k => L + (k-2000)/(48000)*(W-L-R), Y = v => T0 + (1-(v-ymin)/(ymax-ymin||1))*(H-T0-B);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="${T('be_aria')}">`;
  const step = (ymax-ymin)/5 >= 2000 ? 2000 : 1000;
  for (let v=Math.ceil(ymin/step)*step; v<=ymax; v+=step){
    s += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="var(--muted)" font-family="var(--mono)">${fmt(v)}</text>`;
  }
  for (let k=5000;k<=50000;k+=5000) s += `<text x="${X(k)}" y="${H-B+18}" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="var(--mono)">${k/1000}k</text>`;
  s += `<text x="${(L+W-R)/2}" y="${H-4}" font-size="12" text-anchor="middle" fill="var(--muted)">${T('km_unit')}</text>`;
  s += `<text x="12" y="${T0+8}" font-size="12" fill="var(--muted)">€/${T('yr')}</text>`;
  s += `<line x1="${X(G.km)}" x2="${X(G.km)}" y1="${T0}" y2="${H-B}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".6"/><text x="${X(G.km)+6}" y="${T0+12}" font-size="12" fill="var(--ink)">${T('your_km')}</text>`;
  series.forEach(sr => {
    s += `<polyline fill="none" stroke="${sr.color}" stroke-width="2.5" points="${sr.pts.map((v,j)=>X(kms[j])+','+Y(v)).join(' ')}"/>`;
  });
  const cross = [];
  for (let a=0;a<series.length;a++) for (let b=a+1;b<series.length;b++){
    for (let j=1;j<kms.length;j++){
      const d0 = series[a].pts[j-1]-series[b].pts[j-1], d1 = series[a].pts[j]-series[b].pts[j];
      if (d0===0 || d0*d1<0){
        const t = d0/(d0-d1), k = kms[j-1]+t*1000, v = series[a].pts[j-1]+t*(series[a].pts[j]-series[a].pts[j-1]);
        cross.push({a,b,k,v}); s += `<circle cx="${X(k)}" cy="${Y(v)}" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"><title>${esc(cars[a].name)} ${T('and')} ${esc(cars[b].name)}: ${fmt(Math.round(k/100)*100)} km/${T('yr')}</title></circle>`;
      }
    }
  }
  el.innerHTML = s + '</svg>';
  return cross;
}

function rwText(c){
  if (isNedc(c) && c.autoFuel===false) return T('rw_nedc_hint')(regYear(c), fmt(nedcGap(regYear(c))*100));
  if (isNedc(c) && c.std)
    return c.std.manual ? T('rw_nedc_manual')(c.std.year) : T('rw_nedc')(c.std.year, fmt((c.real-1)*100));
  const w = c.rw;
  if (c.pt==='E' && (c.age||0) >= 6) return (w ? rwTextBase(c, w) : '') + T('batt');
  if (!w) return '';
  return rwTextBase(c, w);
}
function rwTextBase(c, w){
  if (w.t==='model' && c.pt!=='P') return T('rw_model')(fmt((c.real-1)*100), fmt(w.n));
  if (w.t==='model') return T('rw_model_phev')(fmt(w.avg,1), fmt(w.n)) + (w.kwhReg?T('rw_phev_kwh'):'');
  if (w.t==='brand' && c.pt!=='P') return T('rw_brand')(w.brand, fmt((c.real-1)*100), fmt(w.n));
  if (w.t==='fleet' && c.pt!=='P') return T('rw_fleet')(fmt((c.real-1)*100));
  if (c.pt==='P') return T('rw_phev')(w.t==='brand'?w.brand:'', fmt(w.avg,1), fmt(w.n)) + (w.kwhReg?T('rw_phev_kwh'):'');
  return w.kwhReg ? T('rw_ev_reg') : T('rw_ev_def');
}
// Katsastustilasto ja elinikä mallisarjalle (Traficom). Ikä = ostohetken ikä, lähin tilastoitu.
function inspSeries(c){
  if (!INSP || !c.picked) return null;
  const name = INSP.idx[CATALOG.indexOf(c.picked)];
  return name ? [name, INSP.m[name]] : null;
}
const prettySeries = n => T('insp_series')(n.replace(/\b([A-ZÄÖ]{4,})\b/g, w => w[0]+w.slice(1).toLowerCase()));
function inspText(c){
  const hit = inspSeries(c); if (!hit) return '';
  const [name, e] = hit, all = INSP.all, m = esc(prettySeries(name));
  let out = '';
  if (e.r){
    const want = Math.max(0, Math.round(c.age||0)), ages = Object.keys(e.r).map(Number);
    const a = ages.reduce((b,x) => Math.abs(x-want) < Math.abs(b-want) ? x : b, ages[0]);
    const [n, p] = e.r[a], q = all.r[a] ? all.r[a][1] : null;
    if (p!=null) out += T('insp_rej')(INSP.y, m, a, fmt(p,1), q!=null?fmt(q,1):'–', fmt(n), a!==want);
  }
  if (e.f){
    const tot = e.f.reduce((s,x)=>s+x,0);
    if (tot >= 30) out += T('insp_f')(e.f.map((x,k)=>[x,k]).sort((x,y)=>y[0]-x[0]).slice(0,3)
      .map(([x,k]) => [T('areas')[k], fmt(x/tot*100)]));
  }
  if (e.s){
    const allMed = fmt(Math.round(all.med));
    if (e.imp) out += T('insp_imp');
    else {
      const [a, v] = e.s[e.s.length-1], av = (all.s.find(([x]) => x===a)||[0,null])[1];
      out += T('insp_s')(a, fmt(v*100), av!=null?fmt(av*100):'–');
      if (e.med!=null) out += !e.medx ? T('insp_med')(fmt(Math.round(e.med)))
        : (e.med > 25 ? T('insp_med25') : T('insp_medx')(fmt(Math.round(e.med)))).replace('__ALLMED__', allMed);
    }
  }
  return out.trim();
}
function update(){
  const G = g(), yr = T('yr');
  $('kmOut').textContent = fmt(G.km);
  const R = cars.map(c => calc(c,G));
  const minCost = Math.min(...R.map(r=>r.total)), minEm = Math.min(...R.map(r=>r.em));
  const before = [...document.querySelectorAll('#sums .big')].map(e=>e.textContent);
  $('sums').innerHTML = cars.map((c,i)=>{ const r=R[i];
    return `<div class="sum" style="--cc:${COLORS[i]}">
      <div class="nm"><span class="dot"></span><span title="${esc(c.name)}">${esc(c.name)}</span></div>
      <div><span class="big">${fmt(r.total)}</span> <span class="sub">€ / ${yr}</span></div>
      <div class="sub">${fmt(r.total/12)} €/${T('mo')} · ${fmt(r.total/G.km,2)} €/km</div>
      <div class="sub">${fmt(r.em)} kg CO₂e/${yr} · ${fmt(r.em*1000/G.km)} g/km</div>
      ${G.monthly>0?`<div class="sub">${T('cash')(fmt(r.cash))}${r.cashAfter!==null?T('cash_after')(fmt(r.cashAfter)):''}</div>`:''}
      <div class="badges">${G.budget>0&&c.price>G.budget?`<span class="badge warn">${T('over')}</span>`:''}${G.monthly>0&&Math.round(r.cash)>G.monthly?`<span class="badge warn">${T('over_mo')}</span>`:''}${cars.length>1&&r.total===minCost?`<span class="badge win">${T('cheapest')}</span>`:''}${cars.length>1&&r.em===minEm?`<span class="badge win">${T('cleanest')}</span>`:''}</div>
    </div>`;}).join('');
  const dock = $('dock');
  dock.classList.toggle('n4', cars.length>3);
  dock.setAttribute('aria-label', T('dock_aria'));
  dock.innerHTML = cars.map((c,i)=>{ const r=R[i], b=[];
    if (cars.length>1 && r.total===minCost) b.push(T('dock_cheap'));
    if (cars.length>1 && r.em===minEm) b.push(T('dock_clean'));
    return `<span class="dc" style="--cc:${COLORS[i]}"><span class="dn">${esc(c.name)}</span><span class="dv">${fmt(r.total)} <small>€<span class="yr">/${yr}</span></small></span><span class="db">${b.join(' · ')}</span></span>`; }).join('');
  moreCount(); renderPay();
  document.querySelectorAll('#sums .big').forEach((e,i)=>{ if (before.length && before[i]!==undefined && before[i]!==e.textContent) e.classList.add('flash'); });
  cars.forEach((c,i)=>{ const e=$('insp'+i); if(e) e.innerHTML = inspText(c); });
  cars.forEach((c,i)=>{ const t=$('tag'+i); if(!t) return; const r=R[i];
    t.textContent = T('tag')(fmt(r.rate*100,0), fmt(r.endAge), fmt(r.endOdo), fmt(r.resid)) + (r.loan>0?T('loan_tag')(fmt(r.loan), fmt(r.pay)):'') + T('make_tag')(fmt(r.makeT,1), battT(c)) + T('serv_tag')(fmt(r.serv), fmt(r.servF,1)) + (r.autoTax?T('tax_tag')(fmt(r.tax), fmt(r.vt.base), fmt(r.vt.prop)):'') + (c.picked?T('reg')(fmt(c.picked[4]), c.picked[5]):'') + rwText(c);
    const tx=$('tax'+i); if (tx) tx.placeholder = fmt(r.vt.total); });
  const rows = cars.map((c,i)=>({name:c.name,color:COLORS[i],...R[i]}));
  hbars($('costChart'), rows.map(r=>({...r,en:r.energy,oth:r.other})), ['dep','cap','en','oth'], '€/'+yr);
  hbars($('emChart'), rows, ['drive','make'], 'kg CO₂e/'+yr);
  const cross = breakEven($('beChart'), G);
  if (cars.length<2){ $('beTitle').textContent=T('be_one_t'); $('beLead').textContent=T('be_one_l'); }
  else if (!cross.length){ const best = cars[R.indexOf(R.reduce((a,b)=>a.total<b.total?a:b))].name;
    $('beTitle').textContent = T('be_none_t')(best); $('beLead').textContent=T('be_none_l'); }
  else { const c0 = cross.sort((x,y)=>Math.abs(x.k-G.km)-Math.abs(y.k-G.km))[0];
    $('beTitle').textContent = T('be_x_t')(cars[c0.a].name, cars[c0.b].name, fmt(Math.round(c0.k/500)*500));
    $('beLead').textContent = T('be_x_l'); }
  save();
}

// Lisäasetukset: montako kenttää on muutettu oletuksesta (näkyy suljetun osion otsikossa)
function isChanged(el){
  if (el.type==='select-one'){ const k = [...el.options].findIndex(o=>o.defaultSelected); return el.selectedIndex !== (k<0?0:k); }
  return el.value !== el.defaultValue;
}
// Maksutapa johdetaan oman rahan ja enimmäishinnan suhteesta (ei omaa tallennettavaa kenttää)
function payState(){
  const own = num($('own').value, 0), budget = num($('budget').value, 0);
  return own <= 0 ? 'loan' : (budget > 0 && own >= budget) ? 'cash' : 'part';
}
let payNow = 'part';
function renderPay(){
  payNow = payState();
  document.querySelectorAll('[data-pay]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.pay===payNow)));
  $('payNote').textContent = (payNow==='part' ? T('pay_n_part')(fmt(num($('own').value,0))) : T('pay_n_'+payNow)) + T('pay_n_more');
}
function setPay(mode){
  const own = $('own'), budget = num($('budget').value, 0), def = num(own.defaultValue, 0);
  if (mode==='cash') own.value = String(budget > 0 ? budget : Math.max(...cars.map(c => num(c.price, 0)), def));
  else if (mode==='loan') own.value = '0';
  else own.value = (def > 0 && (budget <= 0 || def < budget)) ? own.defaultValue : String(Math.round(budget/2/500)*500);
  update();
}
document.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => setPay(b.dataset.pay));

// Vanhojen tallennusten ja linkkien autot nykyiseen muotoon (EX_VERSION-historia)
function migrateCars(list, ev){
  return list.map(c=>ev<5 ? {...c, other:Math.max(0,num(c.other,0)-(OLD_TAX[c.pt]||0))} : c) // vero erotettiin muista kuluista
    .map(c=>ev<6 && PT_DEF[c.pt] ? {...c, other:Math.max(0,num(c.other,0)-PT_DEF[c.pt].serv)} : c) // samoin huolto (EX_VERSION 6)
    .map(c=>ev<7 ? (num(c.make,NaN)===OLD_MAKE[c.pt] ? {...c, make:undefined} : {...c, batt:0}) : c); // valmistus: akku erikseen (EX_VERSION 7)
}
const saved = load();
// Koskemattomat vanhat esimerkkiautot korvataan uusilla; omat autot säilyvät.
const oldExamples = saved && saved.ev !== EX_VERSION && Array.isArray(saved.cars) && saved.cars.every(c => c.exKey || c.exAuto);
if (saved){ // asetukset ensin, jotta esimerkkiautot osataan valita enimmäishinnan mukaan
  const trustAll = (saved.ev||0) >= 4; // vanhemmissa tallennuksissa selain saattoi sekoittaa kenttien arvot
  try{ GIDS.forEach(id=>{ const v=saved.g?.[id]; if(v===undefined) return;
    if (!trustAll && id!=='km' && id!=='years') return;
    if (id in PRICE_DEF){ // oletushinta, jota ei ole muutettu -> käytä uusinta
      const wasDefault = (saved.d && String(v)===String(saved.d[id])) || OLD_DEFS.includes(String(v));
      if (wasDefault || v==='') return; }
    if($(id).type==='select-one') $(id).selectedIndex=v; else $(id).value=v; }); }catch(e){}
}
if (saved && Array.isArray(saved.cars) && saved.cars.length && !oldExamples)
  cars = migrateCars(saved.cars, saved.ev||0)
    .map(c=>newCar({...c,brand:undefined})).map((c,i)=>Object.assign(c,{picked:saved.cars[i].picked}));
else cars = examples();

// --- jaettava linkki: asetukset ja autot linkin #-osaan (selain ei lähetä sitä palvelimelle) ---
// Linkin muoto 'y' (tiivis, luettava): y<versio>~<asetukset>~<auto>~<auto>...
//  asetukset: muutetut kentät, kirjain = GIDS-indeksi (a=km, b=years, ...) + arvo, erottimena _
//  auto: pohja + vain oletuksesta poikkeavat kentät (kirjain + arvo, erottimena _; U = kulutus muutettu käsin). Pohja on
//   eB/eE/eH  koskematon esimerkkiauto (syntyy uudelleen enimmäishinnasta)
//   xB/xE/xH  muokattu esimerkkiauto, pB3k7  rekisteristä valittu malli (rivi + tarkiste), nB  oma auto
//  Johdettuja kenttiä (todellinen kulutus, NEDC-tiedot, lähdeselitteet) ei tallenneta: ne lasketaan uudelleen.
// Vanhat linkit 'z' (pakattu JSON) ja 'j' (JSON) avautuvat edelleen.
const SHARE_KEYS = ['name','pt','price','age','odo','dep','fuel','kwh','share','other','serv','tax','mass','make','batt','life','real','autoFuel','std','rw'];
const SHARE_F = {N:'name',P:'price',A:'age',O:'odo',D:'dep',K:'kwh',S:'share',X:'other',V:'serv',T:'tax',M:'mass',W:'make',B:'batt',L:'life',F:'fuel',R:'real'};
const SHARE_STR = ['name','dep','tax'];
const escS = t => encodeURIComponent(t).replace(/[!'()*_~]/g, ch => '%'+ch.charCodeAt(0).toString(16).toUpperCase()).replace(/\.$/,'%2E');
const decS = t => { try { return decodeURIComponent(t); } catch(e){ return t; } };
const numS = v => String(+(+v).toFixed(4));
const sameV = (a, b) => (typeof a==='number' && typeof b==='number') ? Math.abs(a-b) < 1e-9 : String(a??'')===String(b??'');
// Rekisteririvin tunniste: rivinumero (36-kanta) + 2 merkin tarkiste nimestä, jos luettelo on välillä muuttunut
const rowChk = r => { let h = 0; for (const ch of r[0]+'|'+r[1]+'|'+r[2]) h = (h*31 + ch.charCodeAt(0)) % 1296; return h.toString(36).padStart(2,'0'); };
const rowKey = r => CATALOG.indexOf(r).toString(36) + rowChk(r);
function rowFromKey(k){
  const chk = k.slice(-2), r = CATALOG[parseInt(k.slice(0,-2), 36)];
  return (r && rowChk(r)===chk) ? r : CATALOG.find(x => rowChk(x)===chk) || null;
}
// Auton pohja tunnisteesta; age = auton ikä ennen kuin kulutus lasketaan uudelleen
function shareBase(t, i, age){
  const k = t[0], v = t.slice(1), budget = num($('budget').value, 12000);
  let c = null;
  if ((k==='e'||k==='x') && SLOTS.includes(v)){ c = exampleCar(v, budget); if (k==='x') c.exAuto = false; }
  else if (k==='p'){ const r = rowFromKey(v); if (r) c = newCar({pick:[r[0],r[1],r[2]], name:`${r[0]} ${r[1]}`}); }
  else if (k==='n' && PT_DEF[v]) c = newCar({pt:v, name:T('car_n')+' '+(i+1)});
  if (c && age!==undefined && !sameV(+age, c.age)){ c.age = +age; refreshStd(c); }
  return c;
}
function carFromShare(tok, i){
  const parts = tok.split('_'), f = {};
  parts.slice(1).forEach(x => { const key = SHARE_F[x[0]]; if (!key) return;
    const v = decS(x.slice(1)); f[key] = SHARE_STR.includes(key) ? v : num(v); });
  const c = shareBase(parts[0], i, f.age);
  if (!c) return null;
  if (parts[0][0]==='e') return c;
  Object.entries(f).forEach(([key,v]) => { if (key!=='age') c[key] = v; });
  if (parts.includes('U')) c.autoFuel = false;
  return c;
}
function carToShare(c, i){
  if (c.exAuto && c.ex) return 'e'+c.ex.slot;
  const budget = num($('budget').value, 12000);
  const base = (c.ex && c.picked && exampleCar(c.ex.slot, budget).picked===c.picked) ? 'x'+c.ex.slot
    : c.picked ? 'p'+rowKey(c.picked) : 'n'+c.pt;
  const b = shareBase(base, i, c.age), age0 = shareBase(base, i).age; // b: sama ikä, jotta johdetut kentät täsmäävät
  const toks = [base];
  Object.entries(SHARE_F).forEach(([l,key]) => {
    if (sameV(c[key], key==='age' ? age0 : b[key])) return;
    toks.push(l + (SHARE_STR.includes(key) ? escS(String(c[key]??'')) : numS(c[key])));
  });
  if (c.autoFuel===false) toks.push('U'); // käyttäjä muutti kulutusta: ikä ei enää päivitä sitä
  return toks.join('_');
}
function shareState(){
  const g0 = {};
  GIDS.forEach(id => { const el = $(id);
    if (el.type==='select-one'){ const k = [...el.options].findIndex(o=>o.defaultSelected); if (el.selectedIndex !== (k<0?0:k)) g0[id] = el.selectedIndex; }
    else if (el.value !== el.defaultValue) g0[id] = el.value; });
  return {v:EX_VERSION, g:g0, y:cars.map(carToShare)};
}
const b64u = bytes => { let t=''; bytes.forEach(b => t += String.fromCharCode(b)); return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u = t => Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')), ch => ch.charCodeAt(0));
async function pipe(bytes, stream){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function encodeShare(obj){
  if (obj.y) return 'y' + obj.v + '~' + Object.entries(obj.g).map(([id,v]) => String.fromCharCode(97+GIDS.indexOf(id)) + escS(String(v))).join('_') + '~' + obj.y.join('~');
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  try { if (window.CompressionStream) return 'z' + b64u(await pipe(raw, new CompressionStream('deflate-raw'))); } catch(e){}
  return 'j' + b64u(raw);
}
async function decodeShare(code){
  if (code[0]==='y'){
    const [v, g, ...y] = code.slice(1).split('~'), g0 = {};
    if (g) g.split('_').forEach(x => { const id = GIDS[x.charCodeAt(0)-97]; if (id) g0[id] = decS(x.slice(1)); });
    return {v:+v, g:g0, y};
  }
  let bytes = unb64u(code.slice(1));
  if (code[0]==='z') bytes = await pipe(bytes, new DecompressionStream('deflate-raw'));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function applyShared(st){
  defaultInputs();
  Object.entries(st.g||{}).forEach(([id,v]) => { const el = $(id); if (!el || !GIDS.includes(id)) return;
    if (el.type==='select-one') el.selectedIndex = +v; else el.value = v; });
  if (st.y){ cars = st.y.slice(0,4).map(carFromShare).filter(Boolean); return; }
  cars = migrateCars(st.c||[], st.v||0).slice(0,4).map(c => {
    const car = newCar({...c, brand:undefined, exAuto:false, ex:null});
    if (c.p){ const r = findRow(c.p); if (r) car.picked = r; }
    return car; });
}
$('share').onclick = async () => {
  const url = location.origin + location.pathname + '#s=' + await encodeShare(shareState());
  const msg = $('shareMsg'); msg.textContent = '';
  if (navigator.share && matchMedia('(pointer:coarse)').matches){
    try { await navigator.share({title:document.title, text:T('share_text'), url}); return; }
    catch(e){ if (e.name==='AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); msg.textContent = T('share_ok'); }
  catch(e){ // leikepöytä ei käytettävissä: näytä linkki valmiiksi valittuna kenttänä
    const inp = document.createElement('input'); inp.readOnly = true; inp.value = url; inp.className = 'sharelink';
    inp.setAttribute('aria-label', T('share_copy')); msg.append(T('share_copy') + ' ', inp); inp.focus(); inp.select();
  }
};
// Avattiin jaettu linkki: näytä se, mutta säilytä avaajan omat autot palautettaviksi
(async () => {
  const m = /^#s=([jz][A-Za-z0-9_-]+|y[A-Za-z0-9_.~%-]+)$/.exec(location.hash);
  if (!m) return;
  let st; try { st = await decodeShare(m[1]); } catch(e){ return; }
  if (!st || !(Array.isArray(st.y) ? st.y : st.c) || !(st.y || st.c).length) return;
  history.replaceState(null, '', location.pathname + location.search);
  let prev = null; try { prev = localStorage.getItem('carfootprint.v1'); if (prev) localStorage.setItem('carfootprint.v1.prev', prev); } catch(e){}
  applyShared(st); renderCars(); update();
  const msg = $('shareMsg'); msg.textContent = T('share_loaded') + ' ';
  if (prev){ const b = document.createElement('button'); b.type = 'button'; b.className = 'btn sm'; b.textContent = T('share_restore');
    b.onclick = () => { try { localStorage.setItem('carfootprint.v1', prev); localStorage.removeItem('carfootprint.v1.prev'); } catch(e){} location.reload(); };
    msg.append(b); }
})();
applyLang(LANG);
// Puhelimet näyttävät usein välimuistissa olevaa vanhaa sivua (esim. palautettu välilehti).
// Haetaan sivu palvelimelta ohi välimuistin; jos versio on uudempi, ladataan sivu uudelleen.
// Autot ja asetukset säilyvät, koska ne ovat localStoragessa.
let freshAt = 0;
async function checkFresh(){
  if (!/^https?:$/.test(location.protocol) || Date.now() - freshAt < 60000) return;
  freshAt = Date.now();
  try {
    const r = await fetch(location.pathname, {cache:'reload'});
    const m = /const BUILD = '([0-9a-f]{12})'/.exec(await r.text());
    if (!m || m[1] === BUILD) return;
    let tried = null; try { tried = sessionStorage.getItem('carfootprint.reload'); sessionStorage.setItem('carfootprint.reload', m[1]); } catch(e){}
    if (tried !== m[1]) location.reload();
  } catch(e){}
}
checkFresh();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkFresh(); });
window.addEventListener('pageshow', e => { if (e.persisted) checkFresh(); });
</script>
