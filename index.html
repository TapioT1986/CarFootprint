/* Layout: tienvarsi – syötteet vasemmalla kapeana sarakkeena, tulokset leveänä oikealla; puhelimella pinossa */
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#16202a; --muted:#5b6873; --line:#d3dadf;
  --accent:#0b5cad;            /* tienviittojen sininen */
  --accent-ink:#ffffff;
  --input:#f6f8f9;
  --c1:#0b5cad; --c2:#d9822b; --c3:#2e8b57; --c4:#8a4fbf;
  --seg-dep:#16202a; --seg-cap:#6c7a86; --seg-en:#d9822b; --seg-oth:#b8c2ca;
  --seg-drive:#5a6b2f; --seg-make:#a9b98a;
  --good:#2e8b57; --warn:#b45309;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e7edf2; --muted:#aeb9c3; --line:#2b3742;
  --accent:#4d9be6; --accent-ink:#06121e; --input:#121a21;
  --c1:#4d9be6; --c2:#f0a050; --c3:#4cc28a; --c4:#b78ae6;
  --seg-dep:#e7edf2; --seg-cap:#8b99a5; --seg-en:#f0a050; --seg-oth:#4a5966;
  --seg-drive:#a9c46a; --seg-make:#5d6d3c; --good:#4cc28a; --warn:#f0a050; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e7edf2; --muted:#aeb9c3; --line:#2b3742;
  --accent:#4d9be6; --accent-ink:#06121e; --input:#121a21;
  --c1:#4d9be6; --c2:#f0a050; --c3:#4cc28a; --c4:#b78ae6;
  --seg-dep:#e7edf2; --seg-cap:#8b99a5; --seg-en:#f0a050; --seg-oth:#4a5966;
  --seg-drive:#a9c46a; --seg-make:#5d6d3c; --good:#4cc28a; --warn:#f0a050; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
/* Osionavigaatio: ylälaidassa kiinni; puhelimella piiloutuu alaspäin vieritettäessä ja palaa ylöspäin vieritettäessä */
.secnav{position:sticky;top:0;z-index:25;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;
  margin:-16px 0 20px;padding:6px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.secnav button{font:600 14px/1.1 var(--body);color:var(--muted);background:none;border:0;border-radius:6px;padding:8px 4px;cursor:pointer;min-height:40px}
.secnav button[aria-current="true"]{color:var(--accent);background:var(--surface)}
.secnav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
html{scroll-padding-top:64px}
.ntoc{margin:6px 0 10px}
.ntoc summary{cursor:pointer;color:var(--ink);font:600 18px/1.3 var(--display)}
#ntoc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:2px 14px;margin-top:6px}
#ntoc a{min-width:0;white-space:normal;overflow-wrap:break-word;hyphens:auto}
#ntoc a{color:var(--accent);text-decoration:none;padding:4px 0;font-size:15px;line-height:1.3}
#ntoc a:hover{text-decoration:underline}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:28px 20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.sign{width:44px;height:44px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 22px/1 var(--display);flex:none}
.brand h1{font-size:34px;line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.top .meta{color:var(--muted);font-size:13px;max-width:46ch}

.grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel+.panel{margin-top:16px}
.panel h2{font-size:20px;margin-bottom:12px}
.label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
.kmin{font-family:var(--mono)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.unit{font-size:12px;color:var(--muted)}
input[aria-invalid="true"]{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.errmsg{font-size:12.5px;line-height:1.35;color:var(--warn);font-weight:600}

.km{display:flex;flex-direction:column;gap:6px}
.km .read{display:flex;align-items:baseline;gap:8px}
.odo{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:.04em}
.kmin{width:7.2ch;padding:2px 6px;font-size:30px}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--accent)}
.hint{font-size:13.5px;line-height:1.5;color:var(--muted);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:500 12.5px/1 var(--body);border:1px solid var(--line);background:var(--input);color:var(--ink);padding:6px 9px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.lvl input[type=range]{width:100%}
.lvl + .lvl{margin-top:10px}
.chip:hover{border-color:var(--accent)}

details.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.adv summary{cursor:pointer;font-weight:600;font-size:14px}
details.adv .fields{margin-top:10px}

/* autot */
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.car{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:4px solid var(--cc)}
.car .head{display:flex;align-items:center;gap:8px;min-height:44px}
.car .head .label{flex:1;margin:0}
.car .cname{flex:1;font-size:16px;overflow-wrap:anywhere}
.car .nameed{flex:1;font-weight:600}
.car .ren{border:0;background:none;color:var(--muted);line-height:0;cursor:pointer;padding:6px;border-radius:6px}
.car .ren:hover{color:var(--accent)}
.mine{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.minebtn{display:inline-flex;align-items:center;gap:6px;font:600 13.5px var(--body);border:0;background:none;color:var(--muted);padding:6px 0;cursor:pointer}
.minebtn:hover{color:var(--accent)}
.minebtn[aria-pressed="true"]{color:var(--accent)}
.badge.mineb{border-color:var(--accent);color:var(--accent)}
.sub.vsm{color:var(--ink);font-weight:600}
.pickwrap input{font-weight:600}
.pickwrap input::placeholder{font-weight:400}
.car .x{border:0;background:none;color:var(--muted);line-height:0;cursor:pointer;padding:6px;border-radius:6px}
.car .x:hover{color:var(--ink);background:var(--input)}
.car .fields{gap:9px}
/* Mallihaun ehdotuslista: oma lista, koska selaimen datalist näkyy osassa puhelimia läpinäkyvänä */
.pickwrap{position:relative}
.pickbox{position:relative} /* ehdotuslista avautuu heti kentän alle, ohjetekstin päälle */
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.22);max-height:min(50vh,320px);overflow-y:auto;overscroll-behavior:contain;padding:4px}
.sugg[hidden]{display:none}
.sugg button{display:block;width:100%;text-align:left;padding:9px 10px;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;border-radius:6px;cursor:pointer}
.sugg button:hover,.sugg button[aria-selected="true"]{background:var(--input)}
.sugg .none{padding:9px 10px;color:var(--muted);font-size:14px}
.addcar{border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font:600 15px var(--body);cursor:pointer;min-height:120px}
.addcar:hover{border-color:var(--accent);color:var(--accent)}
.finder{margin:0 0 24px}
.nocar{margin-top:16px}
.nocar > summary{font:600 17px/1.3 var(--display);cursor:pointer;color:var(--accent)}
.nocar .nch{font-size:16px;margin:14px 0 6px}
.ncrows{display:grid;gap:8px;margin:10px 0}
.ncrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,1.3fr) auto;gap:6px;align-items:end}
.ncrow label{font-size:12.5px;color:var(--muted);display:block}
.ncrow .x{min-width:36px}
.ncout{margin:12px 0}
.ncout p{margin:4px 0}
.ncout .ncsum{font-weight:600}
.ncout .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px}
@media (max-width:700px){.ncrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-bottom:8px;border-bottom:1px solid var(--line)}.ncrow .nn{grid-column:1 / -1}}
.finder .ref{margin:0 0 8px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--input);border-radius:0 8px 8px 0}
.finder .diff{font-size:13.5px}
.finder .diff.better{color:var(--good)}
.finder .repl{margin-top:10px}
.finder > summary{font:600 17px/1.3 var(--display);cursor:pointer;color:var(--accent)}
.finder .field{max-width:320px;margin:8px 0 12px}
.findlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}

<noscript><div style="max-width:70ch;margin:24px auto;padding:0 16px;font:16px/1.5 system-ui,sans-serif">
<h1>CarFootprint – auton todelliset vuosikulut ja päästöt</h1>
<p>Laskuri vertaa uusien ja käytettyjen autojen todellisia vuosikuluja ja päästöjä omalla ajomäärälläsi: arvonalenema Verohallinnon verotusarvoista, rahoitus, energia Tilastokeskuksen hinnoilla, ajoneuvovero, vakuutukset, huolto sekä valmistuksen ja ajon päästöt. Kulutus perustuu EEA:n mittaamaan todelliseen kulutukseen. Laskuri tarvitsee JavaScriptin.</p>
<p>CarFootprint compares what new and used cars really cost per year and emit at your own mileage, with Finnish prices, taxes and register data. The calculator needs JavaScript. Method and sources: <a href="https://github.com/TapioT1986/CarFootprint#readme">README</a>.</p>
</div></noscript>

  notes:`<li id="m-dep"><b>Arvonalenema:</b> jäännösarvo = hinta × (1 − arvonalenema-%)<sup>vuodet</sup>. Jos jätät prosentin tyhjäksi, se valitaan auton keski-iän mukaan: alle 3 v 17 %, 3–5 v 10 %, 6–9 v 11 %, 10–19 v 12 %, 20 v tai yli 10 %. Prosentit on laskettu Verohallinnon verotusarvoista (<a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2024.xls" target="_blank" rel="noopener">2024</a>, <a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2025.xls" target="_blank" rel="noopener">2025</a>, <a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2026.xls" target="_blank" rel="noopener">2026</a>) (114 000 käytettynä tuotua autoa 2024–2026) vertaamalla saman mallin eri-ikäisiä autoja. Keskimääräistä suurempi ajomäärä (yli 15 000 km/v) laskee jäännösarvoa 0,2 % per 1 000 km vuodessa; tämä on oletus, jolle ei ole lähdettä. <b>Arvonalenema on mallien keskiarvo, ei yksittäisen auton ennuste:</b> auton kunto, huoltohistoria, varustelu, kysyntä ja sähköautossa akun kunto voivat muuttaa jälleenmyyntihintaa paljon kumpaan suuntaan tahansa. Kääntöpisteet tulosten alla kertovat, kuinka paljon arvonaleneman pitäisi muuttua, jotta halvin auto vaihtuu. Samassa aineistossa puolet yksittäisistä autoista on arvoltaan 7 % mallinsa tyypillistä arvoa halvempia tai kalliimpia, ja joka viides yli 15 %; tuloskortin jälleenmyyntiväli käyttää tuota keskimmäistä puolikasta.</li>
<li id="m-ex"><b>Esimerkkiautot</b> ovat malleja, joita Suomen autokannassa on eniten (<a href="https://avoindata.suomi.fi/data/fi/dataset/ajoneuvojen-avoin-data" target="_blank" rel="noopener">Traficomin avoin ajoneuvodata</a> 30.6.2026), eivät uusien autojen myyntitilaston kärkeä: käytetyn auton ostajalle ne ovat tavallisimpia vaihtoehtoja. Täyshybrideistä kuusi yleisintä ovat Toyotia (Corolla noin 33 000, Yaris 25 000, C-HR 15 800 autoa; ensimmäinen muu on Nissan Qashqai, 7 200), ja sähköautoista yleisimmät ovat Tesla Model Y ja Model 3 (16 300 ja 14 900). Esimerkki ei tarkoita, että malli olisi paras valinta, ja sen voi vaihtaa mihin tahansa malliin. Esimerkit valitaan enimmäishinnan mukaan: bensiiniauto on aina Golf (Suomen yleisin keski-ikäinen auto), hybridi Toyota Corolla, Auris tai Yaris ja sähköauto rekisterissä yleisin malli, johon budjetti riittää. Kustakin valitaan nuorin vuosimalli, jonka arvioitu hinta mahtuu budjettiin. Hinta-arviot perustuvat Verohallinnon verotusarvoihin (<a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2025.xls" target="_blank" rel="noopener">2025</a>, <a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2026.xls" target="_blank" rel="noopener">2026</a>) ja mittarilukema mallin keskimääräiseen ajomäärään. Kun muutat esimerkkiautoa, se lakkaa seuraamasta budjettia.</li>
<li id="m-fin"><b>Rahoitus:</b> se osa hinnasta, jota oma raha ja vaihtohyvitys eivät kata, rahoitetaan tasaerälainalla. Lainan kustannus on omistusaikana maksettu korko ja kuukausimaksut. Jos auto myydään ennen kuin laina on maksettu, loppu maksetaan myyntihinnasta. Lisäksi autoon sitoutuneelle omalle rahalle lasketaan menetetty tuotto. Enimmäishintaa kalliimmat autot merkitään. Oletukset, kun on valittava, autolle epäedullisempi luku: <b>lainan korko 4,40 %</b> = pankkien ajoneuvolainakannan keskikorko toukokuun 2026 lopussa (<a href="https://www.suomenpankki.fi/fi/tilastot/tilastotiedotteet/rahalaitosten-tase/2026/kotitalouslainojen-korot-nousivat-toukokuussa-2026/" target="_blank" rel="noopener">Suomen Pankki 30.6.2026</a>; uusien ajoneuvolainojen korko oli 4,08 %). <b>Oman rahan tuotto 2,48 %</b> = uusien määräaikaistalletusten keskikorko toukokuussa 2026 (<a href="https://www.suomenpankki.fi/fi/tilastot/tilastotiedotteet/rahalaitosten-tase/2026/kotitalouslainojen-korot-nousivat-toukokuussa-2026/" target="_blank" rel="noopener">sama tiedote</a>; talletuskannan keskikorko oli 0,82 %). <b>Lainan kulut 12,50 €/kk</b> = Nordean autolainan esimerkkilaskelman tilinhoitomaksu (<a href="https://www.nordea.fi/henkiloasiakkaat/palvelumme/lainat/kulutusluotot/autolaina.html" target="_blank" rel="noopener">Nordea</a>). Oman rahan tuotto kuvaa, mitä rahat tuottaisivat muualla; 0, jos ne olisivat korottomalla tilillä.</li>
<li id="m-km"><b>Ajomäärän pikavalinnat</b> ovat suomalaisten autojen toteutuneita ajomääriä (mediaani, <a href="https://avoindata.suomi.fi/data/fi/dataset/ajoneuvojen-avoin-data" target="_blank" rel="noopener">Traficomin avoin ajoneuvodata</a> 30.6.2026).</li>
<li id="m-city"><b>Kaupunki- ja maantieajo:</b> oletus 39 % kaupunkiajoa on Suomen henkilöautojen ajokilometreistä laskettu: vuonna 2025 kaduilla ja yksityisteillä ajettiin 9 883 ja maanteillä 29 136 miljoonaa kilometriä (<a href="https://pxdata.stat.fi/PxWeb/pxweb/fi/StatFin/StatFin__tiet/12jx.px/" target="_blank" rel="noopener">Tilastokeskus 12jx</a>), ja maanteiden liikenteestä 18 % oli teillä, joiden nopeusrajoitus on enintään 60 km/h (<a href="https://pxdata.stat.fi/PxWeb/pxweb/fi/StatFin/StatFin__tiet/12k1.px/" target="_blank" rel="noopener">12k1</a>, kaikki ajoneuvot). Kaupunkiajon vaikutus perustuu WLTP-testin vaiheisiin: kaupunkiajoa vastaavat hidas ja keskinopea vaihe (keskinopeus noin 19 ja 39 km/h), maantieajoa nopea ja erittäin nopea vaihe (noin 56 ja 92 km/h, huippu 131 km/h). Vaihekohtaiset kulutukset ovat <a href="https://carfueldata.vehicle-certification-agency.gov.uk/downloads/default.aspx" target="_blank" rel="noopener">Ison-Britannian tyyppihyväksyntäviranomaisen VCA:n</a> avoimessa aineistossa (18.11.2026, noin 3 700 mallia; sähköautoilla kaupunki- ja yhdistetty toimintasäde). Kaupunkikulutus on mallien mediaanina maantiekulutukseen verrattuna bensiiniautolla 1,14-, dieselillä 1,16-, lataushybridin polttomoottorilla 1,01- ja täyshybridillä 0,81-kertainen, ja sähköautolla 0,68-kertainen. Oletusosuudella kulutus on sama kuin mitattu todellinen kulutus; osuuden muutos muuttaa sitä näiden suhteiden mukaan. Kun saman malliperheen versioita on aineistossa vähintään kolme (noin 180 mallia, esim. Toyota Corolla -hybridi 0,73, VW Golf eTSI 1,16), käytetään mallin omaa suhdetta, muuten käyttövoiman mediaania. Näin kevythybridit, jotka käyttäytyvät bensiiniauton tavoin (mediaani 1,13), erottuvat täyshybrideistä silloinkin, kun aineiston oma luokittelu on epäjohdonmukainen. Rajoitus: luvut ovat laboratoriotestistä, ja Suomen talvi lisää etenkin lyhyiden kaupunkimatkojen kulutusta. Hybridin, jolle mallikohtaista lukua ei ole, oletus on täyshybridien mediaani.</li>
<li id="m-mine"><b>Nykyinen autosi:</b> yhden auton voi merkitä nykyiseksi autoksi. Sen ostohinnaksi kirjoitetaan nykyinen arvo (paljonko saisit myymällä) ja mahdollinen jäljellä oleva laina laina-aikoineen. Arvo vähennettynä lainalla on omaa rahaa kiinni autossa, ja sen menetetty tuotto lasketaan kuten muillakin autoilla; jäljellä olevan lainan korot ja kulut lasketaan Rahoituksen korolla. Jos vaihtohyvitys on valittu (oletus), nykyisen auton nettoarvo eli myyntiarvo miinus laina lisätään muiden autojen omaan rahaan; jos laina on arvoa suurempi, erotus kasvattaa uuden auton lainaa. Muiden autojen tuloskorteissa näkyy ero nykyiseen autoon euroina ja päästöinä vuodessa sekä koko omistusaikana. <b>Vaihtopäätöksen päästöt</b> näytetään erikseen koko omistusajalta: muu vertailu jakaa jokaisen auton valmistuspäästön tasan sen käyttöiälle, mutta päätöksessä pitää vai vaihtaa nykyisen auton valmistus on jo tapahtunut, joten pitämiseen lasketaan vain ajo. Uuteen autoon (ikä alle vuoden) vaihtamiseen lasketaan sen koko valmistuspäästö, koska ostos synnyttää uuden auton. Käytetylle autolle lasketaan omistusvuosien osuus sen jäljellä olevasta käyttöiästä (valmistus × vuodet ÷ (käyttöikä − ikä), vähintään omistusajan mittainen). Tämä on tarkoituksella epäedullisempi tapa; toinen perusteltu tapa on laskea käytetylle autolle valmistuspäästöä 0, koska sen ostaminen ei synnytä uutta autoa. Jakotapa on laskurin oletus, ei lähteestä. Nykyinen auto ei vaihdu enimmäishinnan mukana. Kaikki tiedot tallentuvat vain tähän selaimeen; jakolinkki vie ne mukanaan vain, jos jaat sen itse.</li>
<li id="m-month"><b>Kaksi kuukausilukua</b> tuloskortissa: <i>todellinen kustannus</i> on vuosikustannus jaettuna kahdellatoista, ja <i>tililtä lähtee</i> on se, mitä tililtä lähtee kuukaudessa lainan aikana: lainaerä kuluineen sekä energia ja muut kulut (vero, vakuutus, huolto, renkaat) jaettuna kuukausille. Arvonalenema ja oman rahan menetetty tuotto ovat todellisia kuluja, mutta niistä ei tule kuukausittaista laskua, joten ne eivät ole mukana. Siksi tililtä lähtevä summa voi olla pienempi tai suurempi kuin todellinen kustannus. Vero, vakuutukset ja huolto laskutetaan todellisuudessa harvemmin, joten luku on kuukausien keskiarvo. Jos laina-aika on omistusaikaa lyhyempi, menot pienenevät lainan jälkeen. Yllättäviä korjauksia ei ole mukana. Käteisostossa kortti näyttää kertaostoon tarvittavan summan, osittain lainalla oman rahan ja lainan osuudet. Jos annat kuukausibudjetin (valinnainen), sen ylittävät autot merkitään.</li>
<li id="m-real"><b>Todellinen kulutus:</b> WLTP-arvo kerrotaan kertoimella, joka on mitattu autojen omista kulutusmittareista (luetaan mm. katsastuksissa). Kerroin on <b>mallikohtainen</b> 367 mallille; muille käytetään merkin tai käyttövoiman keskiarvoa, ja auton kortti kertoo kumman. Bensiiniautot kuluttavat keskimäärin 20 % ja dieselit 18 % yli WLTP:n, mutta mallien väliset erot ovat suuria. Luvut ovat koko EU:sta eivätkä huomioi Suomen talvea.</li>
<li id="m-old"><b>Vanhat autot (vuosimalli 2017 tai vanhempi):</b> niiden virallinen kulutus on mitattu vanhalla NEDC-testillä, joka aliarvioi kulutusta selvästi enemmän kuin WLTP. Laskuri käyttää mallin ja vuosimallin omaa NEDC-arvoa Traficomin rekisteristä ja lisää siihen <a href="https://theicct.org/publication/from-laboratory-to-road-a-2018-update/" target="_blank" rel="noopener">ICCT:n</a> mittaaman eron: 8 % vuoden 2001 autoissa, 38 % vuoden 2014 ja 40 % vuoden 2016 autoissa. Välivuodet on interpoloitu suoraviivaisesti.</li>
<li id="m-phev"><b>Lataushybridit:</b> oletuskulutus on mallin oma mitattu keskiarvo, tai jos sitä ei ole, merkin keskiarvo. Koko EU:ssa se on 6,0 l/100 km, kun WLTP lupaa 1,4. Oletuksena 25 % ajosta kulkee sähköllä. Nosta osuutta, jos lataat ahkerasti.</li>
<li id="m-ev"><b>Sähköautot:</b> kulutus on mallin WLTP-arvo EEA:n rekisteristä (Suomessa 2025 rekisteröidyt autot; jo myynnistä poistuneille malleille 2020–2022). Mitattua kulutusta ei kerätä täyssähköautoista, joten kerroin 1,20 on oletus. Akun kulumisesta laskuri ei lisää kulua: <a href="https://www.geotab.com/blog/ev-battery-health/" target="_blank" rel="noopener">Geotabin tutkimuksessa</a> (22 700 autoa) kapasiteetti laski keskimäärin 2,3 % vuodessa, kotona ladatuissa noin 1,5 % ja paljon pikaladatuissa noin 3 %. Kulunut akku lyhentää toimintamatkaa, mutta ei juuri lisää kulutusta. Akun vaihdoista ei löytynyt luotettavaa yleisyyslukua.</li>
<li id="m-serv"><b>Huolto ja korjaukset</b> kasvavat ajokilometrien mukaan. Kentän arvo on vähän ajetun auton (alle 80 000 km) taso, ja se on karkea oletus. Kasvu perustuu <a href="https://advocacy.consumerreports.org/wp-content/uploads/2020/10/TCO-Fact-Sheet-Chapter-2-FINAL.pdf" target="_blank" rel="noopener">Consumer Reportsin</a> omistajakyselyihin (Yhdysvallat, 2020): 80 000–160 000 km ajetun polttomoottoriauton huolto ja korjaukset maksavat kilometriä kohden 2,1-kertaisesti ja sitä enemmän ajetun 2,8-kertaisesti. Sähköautoilla kertoimet ovat 2,3 ja 3,6, mutta lähtötaso on alle puolet polttomoottoriauton tasosta. Laskuri laskee kertoimen keskiarvona sille matkalle, jonka ajat omistusaikana; auton kortti näyttää sen. Lataushybrideille ja tavallisille hybrideille käytetään polttomoottoriauton kertoimia. Lähde on yhdysvaltalainen, joten euromäärät ovat laskurin omia ja vain kasvu on lähteestä. Saksalainen <a href="https://www.datgroup.com/fileadmin/at/DAT_Report/2025/DAT-Report-2025-Kurzbericht.pdf" target="_blank" rel="noopener">DAT-Report 2025</a> näyttää, että yli 6-vuotiaiden autojen omistajat käyttävät huoltoon jopa vähemmän kuin 3–6-vuotiaiden: vanhan auton omistaja usein säästää huolloista, mikä voi tulla myöhemmin kalliiksi. <b>Huollon tasot</b> (Lisäasetukset → Muut kulut): <b>Keskiverto 100 %</b> on laskurin oletus, joka on lähellä Tilastokeskuksen kulutustutkimuksen vuoden 2016 tasoa (huolto ja korjaukset noin 1 000 € ja osat 135 € autoa kohden vuodessa, vuoden 2022 rahassa; <a href="https://pxdata.stat.fi/PXWeb/pxweb/fi/StatFin/StatFin__ktutk/14pg.px" target="_blank" rel="noopener">taulukko 14pg</a>). <b>Budjetti 42 %</b> on saman tutkimuksen vuoden 2022 taso suhteessa vuoteen 2016: (380 + 98) / (1 000 + 135) €. Siinä näkyy myös itse huoltaminen ja säästäminen huolloista, mutta Tilastokeskuksen mukaan pudotus johtuu pääosin keruutavan muutoksesta. <b>Premium 110 %</b> on merkkikorjaamon huolto: määräaikaishuollot olivat merkkikorjaamoissa keskimäärin noin 10 % yleiskorjaamoja kalliimpia (Fordin teettämä Promiran puhelinkysely, 56 merkki- ja noin 120 yleiskorjaamoa; <a href="https://www.taloustaito.fi/vapaalla/auto-huoltoon--merkkihuolto-vai-riippumaton-korjaamo-kumpi-kannattaa/" target="_blank" rel="noopener">Taloustaito 31.5.2019</a>). Tutkimuksen teetti autonvalmistaja, ja ero voi olla korjaustöissä suurempi.</li>
<li id="m-tyre"><b>Renkaat</b> lasketaan valitun vannekoon mukaan (oletus 17″, muutettavissa auton kohdassa Tarkenna; rekisterissä ei ole rengaskokoa). Suomessa tarvitaan kesä- ja talvisarja, ja kumpikin ajaa puolet vuoden kilometreistä. Sarja uusitaan, kun se on ajettu loppuun, 30 000 km (<a href="https://www.verkkouutiset.fi/a/joka-toinen-ajaa-renkaansa-loppuun-ei-kannattaisi/" target="_blank" rel="noopener">Autonrengasliitto: kesärengas tavallisesti 30 000–35 000 km</a>, alaraja), tai viimeistään 6 vuoden käytön jälkeen (<a href="https://moottori.fi/uutinen/autoliitto-ohjeistaa-muista-nama-asiat-renkaanvaihdon-yhteydessa/" target="_blank" rel="noopener">Autoliitto</a>). Sähköauton renkaat kuluvat 20 % nopeammin (<a href="https://www.moveelectric.com/e-cars/do-electric-cars-wear-out-tyres-faster" target="_blank" rel="noopener">Michelin ja Emissions Analytics</a>). Hinnat: 16″ talvirengas Nokian Hakkapeliitta R5 185,07 € ja kesärengas Nokian Wetproof 1 94,16 € kappaleelta, Rengas Online 10.11.2026 (<a href="https://easygarage247.fi/?p=5417" target="_blank" rel="noopener">Easy Garage 24/7:n hintavertailu</a>; vertailun kalliimpia kauppoja, edullisin 149,47 € ja 73,99 €). Muut koot samassa suhteessa kuin Hakkapeliitta R5:n mediaanihinta vannekoon mukaan (<a href="https://www.rengas365.fi/renkaat/tuotemerkki/nokian/talvirenkaat/kitka/hakkapeliitta-r5/6129" target="_blank" rel="noopener">Rengas365</a> 19.11.2026): 15″ 0,75, 17″ 1,24, 18″ 1,43, 19″ 1,81, 20″ 2,19 kertaa 16″. Esimerkiksi 17″ ja 15 000 km/v: 4 × (117 + 229) € × 7 500 / 30 000 ≈ 350 €/v. <b>Muut kulut</b> ovat oletuksena ADAC:n pesun ja hoidon 250 €/v (<a href="https://assets.adac.de/Autodatenbank/Autokosten/autokosten_grundlagen.pdf" target="_blank" rel="noopener">ADAC 10/2026</a>, Saksa); renkaanvaihdoille ja säilytykselle ei löytynyt lähdettä. <b>Vertailu Tilastokeskuksen kulutustutkimukseen</b> (<a href="https://pxdata.stat.fi/PXWeb/pxweb/fi/StatFin/StatFin__ktutk/14pg.px" target="_blank" rel="noopener">taulukko 14pg</a>; noin yksi auto kotitaloutta kohden, <a href="https://pxdata.stat.fi/PxWeb/pxweb/fi/StatFin/StatFin__ktutk/13qy.px/" target="_blank" rel="noopener">13qy</a>): suomalaiset kotitaloudet käyttivät autoa kohden vuonna 2022 renkaisiin noin 47 €, osiin noin 98 € ja huoltoon ja korjauksiin noin 380 €; vuonna 2016 vastaavasti noin 80, 135 ja 1 000 € (vuoden 2022 rahassa). Tilastokeskuksen mukaan huolto- ja korjausmenojen pudotus johtuu pääosin keruutavan muutoksesta. Laskurin huoltooletus on lähellä korkeampaa tasoa ja rengaskulu selvästi tilastoa suurempi: tilasto on koko autokannan keskiarvo, ja moni ostaa edullisia tai käytettyjä renkaita. Tämä on tarkoituksella epäedullisempi valinta. <b>Renkaiden hintatasot</b> (Lisäasetukset → Muut kulut): Tasot ovat prosentteja oletuksen kesä- ja talvirenkaan yhteishinnasta (279,23 € koossa 205/55 R16: Nokian Wetproof 1 ja Hakkapeliitta R5, Rengas Online 10.11.2026). <b>Premium 100 %</b> on tämä oletus. <b>Keskiverto 83 %</b> on <a href="https://www.rengas365.fi/etsi-tuote/renkaat?Width=205&Profile=55&Diameter=16&Season=1" target="_blank" rel="noopener">Rengas365:n</a> koon 205/55 R16 mediaanihinta 19.11.2026: kesärengas 98,13 € (98 rengasta) ja <a href="https://www.rengas365.fi/etsi-tuote/renkaat?Width=205&Profile=55&Diameter=16&Season=2" target="_blank" rel="noopener">pohjoismainen talvirengas</a>, kitka tai nasta, 132,99 € (32 rengasta). <b>Budjetti 57 %</b> on samojen valikoimien alaneljännes: kesärengas 78,42 € ja talvirengas 81,16 €. Käytettyjä renkaita ja asennusta ei ole mukana. <b>Miksi tämä on enemmän kuin Tilastokeskuksen 47–80 € autoa kohden vuodessa?</b> Laskuri kysyy, mitä renkaiden kuluminen maksaa sinulle, kun ostat uudet renkaat aina kun vanhat kuluvat loppuun. Tilasto kertoo, mitä kotitaloudet keskimäärin maksoivat renkaista sinä vuonna. Ero syntyy luultavasti näistä syistä: (1) Käytetyn auton mukana tulevat yleensä kesä- ja talvirenkaat, joten renkaisiin ei mene rahaa moneen vuoteen. Laskuri jakaa uusien renkaiden hinnan tasaisesti joka vuodelle. (2) Laskuri käyttää kestoa 30 000 km tai 6 vuotta, kun moni ajaa samoilla renkailla pidempään. (3) Vanhoissa autoissa on usein 15–16″ vanteet, ja moni ostaa halpoja tai käytettyjä renkaita. (4) Tilasto on luultavasti alakanttiin: harvoin tehdyt ostot jäävät helposti kirjaamatta, ja Tilastokeskuksen mukaan vuoden 2022 pudotus huolto- ja korjausmenoissa johtuu pääosin keruutavan muutoksesta (renkaat 2016 noin 80 €, 2022 noin 47 €). Korjaamolla asennettujen renkaiden hinta saattaa myös päätyä huollon riviin; tätä ei ole tarkistettu. Esimerkiksi 16″ budjettirenkaat, jotka kestävät 45 000 km, maksavat 15 000 km:n vuosiajolla noin 106 € vuodessa. Autojen vertailuun laskurin tapa on reilumpi, koska se ottaa huomioon esimerkiksi sähköauton nopeamman rengaskulumisen ja isommat vanteet.</li>
<li id="m-excl"><b>Kulun jättäminen pois:</b> huollon, renkaat ja muut kulut voi jättää pois vertailusta kulutaulukon napeilla (Jätä pois / Ota mukaan), esimerkiksi jos huollat auton itse tai ostat käytetyt renkaat. Valinta koskee kaikkia autoja, jotta vertailu pysyy reiluna, ja se näkyy tulosten alla. Kulu poistuu vuosikulusta ja kuukausimenoista; pois jätetty rivi näkyy taulukossa himmennettynä.</li>
<li id="m-elem"><b>Sähkön päästöt:</b> Suomen sähköntuotannon suorat päästöt 26 g/kWh vuonna 2025 (<a href="https://energia.fi/wp-content/uploads/2026/01/Sahkovuosi-2025_v1.pdf" target="_blank" rel="noopener">Energiateollisuus, Sähkövuosi 2025</a>; sama luku <a href="https://fingridlehti.fi/sahkon-paastojen-lasku-jatkuu/" target="_blank" rel="noopener">Fingridiltä</a>) + polttoaineiden tuotantoketju 16 g/kWh (<a href="https://doi.org/10.1016/j.trd.2017.07.012" target="_blank" rel="noopener">Moro ja Lonza 2018, EU:n JRC</a>; luku on tarkistettu vain toissijaisesta lähteestä). Tuotantotapojen elinkaariarvot (ydin- ja tuulisähkö 12, vesi 24, aurinko 48 g/kWh) ovat <a href="https://www.ipcc.ch/site/assets/uploads/2018/02/ipcc_wg3_ar5_annex-iii.pdf" target="_blank" rel="noopener">IPCC:n AR5-raportin liitteen III</a> mediaaneja. <a href="https://unece.org/sed/documents/2021/10/reports/life-cycle-assessment-electricity-generation-options" target="_blank" rel="noopener">UNECE:n 2021 elinkaariarvio</a> antaa ydin- ja tuulisähkölle pienempiä arvoja (noin 5–16 g/kWh); oletuksena on suurempi.</li>
<li id="m-fuelem"><b>Polttoaineiden päästökertoimet:</b> pakoputki + tuotantoketju (well-to-wheel), <a href="https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2025" target="_blank" rel="noopener">Ison-Britannian energiaministeriön kertoimet 2025</a>, keskimääräinen bioseos: bensiini 2,07 + 0,58 kg/l, diesel 2,57 + 0,61 kg/l. Oletuksessa on lisäksi biopolttoaineen pakoputken CO₂ (0,13 ja 0,14 kg/l), joka tavallisesti jätetään pois: ilman sitä luvut olisivat 2,65 ja 3,18 kg/l. Suomen polttoaineissa biokomponenttia on yleensä enemmän.</li>
<li id="m-src"><b>Pääaineistot ja avoin koodi:</b> malliluettelo ja CO₂-arvot <a href="https://avoindata.suomi.fi/data/fi/dataset/ajoneuvojen-avoin-data" target="_blank" rel="noopener">Traficomin avoimesta datasta</a> 30.6.2026, mitattu kulutus <a href="https://climate-energy.eea.europa.eu/topics/transport/real-world-emissions/additional_information" target="_blank" rel="noopener">EEA:n OBFCM-aineistosta</a> ja sähkönkulutus <a href="https://co2cars.apps.eea.europa.eu/" target="_blank" rel="noopener">EEA:n uusien autojen rekisteristä</a> (Suomessa 2020–2025 rekisteröidyt). Kaikki CC BY 4.0. Arvonalenema Verohallinnon verotusarvoista ja NEDC-korjaus ICCT:ltä. Koko laskentamalli ja käytetty data ovat <a href="https://github.com/TapioT1986/CarFootprint" target="_blank" rel="noopener">GitHubissa</a>.</li>
<li id="m-cmp"><b>Vertailu muihin laskureihin</b> (tarkistettu 20.11.2026). <a href="https://autokalkulaattori.fi/" target="_blank" rel="noopener">Ilmastopaneelin Autokalkulaattori</a> (Traficom, uudet autot, oletukset sivun tiedoissa): sähkön päästö 96 + 16 g/kWh (laskurissa 26 + 16: Energiateollisuuden vuoden 2025 luku on uudempi), bensiini 2,35 + 0,66 ja diesel 2,69 + 0,75 kg/l (laskurissa 2,78 ja 3,32 kg/l yhteensä: Ison-Britannian kertoimet 2025 keskimääräisellä bioseoksella; Autokalkulaattorin lähde on EU:n JRC 2014), akun valmistus 70 kg/kWh (laskurissa 72,8), keskikokoisen polttomoottoriauton valmistus 5,4 t (laskurissa 8,2 t, ICCT 2025, epäedullisempi), huolto 300 €/v polttomoottori- ja 240 €/v sähköautolle tasaisena (laskurissa 400 ja 250 €/v vähän ajetulle, kasvaa ajon mukaan). Autokalkulaattorissa on lisäksi kotilaturi 1 200 €, akun vaihto 300 000 km:n välein (300 €/kWh), auton romutuksen päästöt (0,96 t, sähköauto 1,24 t) ja energian hintojen nousu 1,5 %/v; laskurissa näitä ei ole. <a href="https://www.ayvens.com/fi-fi/tietoa-meista/uutiset-ja-artikkelit/uutiset/car-cost-index-2026/" target="_blank" rel="noopener">Ayvens Car Cost Index 2026</a> (27.4.2026: uudet leasingautot yritysasiakkaille, 30 000 km/v, 4 v, ilman arvonlisäveroa, täyskasko mukana): Suomessa keskikokoinen sähköauto 956 ja bensiiniauto 988 €/kk, pieni 773 ja 806 €/kk. Laskuri antaa samoilla ajoilla uusille autoille arvonlisäveroineen esimerkiksi VW ID.3 892, VW Golf 1 154, Skoda Octavia 1 104, Renault ZOE 721 ja VW Polo 877 €/kk, eli samaa suuruusluokkaa; bensiiniautot ovat laskurissa kalliimpia, koska kulutus on todellinen eikä virallinen ja hinnoissa on arvonlisävero.</li>
<li id="m-tax"><b>Ajoneuvovero</b> lasketaan vuoden 2026 verotaulukoista (<a href="https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2024/814" target="_blank" rel="noopener">ajoneuvoverolaki, muutos 814/2024</a>). Perusvero määräytyy auton virallisen CO₂-päästön mukaan, ja se on 106–654 €/v. Päästö lasketaan mallin virallisesta kulutuksesta: vuosimallit 2017 ja vanhemmat NEDC-taulukolla 1, uudemmat WLTP-taulukolla 1 A. Sähköautoista, jotka on otettu käyttöön 1.10.2021 tai myöhemmin, perusvero on 171 €/v; laskuri pitää vuosimallia 2022 ja uudempia tällaisina. Lataushybridien perusvero on alin porras, koska niiden WLTP-päästö on lähes aina alle 103 g/km. Diesel-, sähkö- ja lataushybridiautoista maksetaan lisäksi käyttövoimaveroa: 5,5, 1,9 tai 0,95 senttiä päivässä jokaiselta kokonaismassan alkavalta 100 kg:lta. Kokonaismassa ei ole vielä malliluettelossa, joten se on oletus (diesel 2 000 kg, sähkö 2 200 kg, lataushybridi 2 300 kg). Oman auton kokonaismassa löytyy rekisteröintitodistuksesta, ja sen voi vaihtaa kohdassa Lisää oletuksia. <a href="https://www.edilex.fi/he/20260173" target="_blank" rel="noopener">Hallituksen esitys HE 173/2026</a> alentaisi verotaulukoilla 1 ja 2 verotettujen autojen (pääosin vähintään 10 vuotta vanhat polttomoottoriautot) perusveroa keskimäärin noin 6 €/v vuodesta 2028 alkaen. Esitys on vielä eduskunnan käsittelyssä, eikä sitä ole otettu huomioon.</li>
<li id="m-insp"><b>Katsastus ja elinikä</b> (tietoa autokortilla, ei vaikuta laskelmaan) tulevat <a href="https://trafi2.stat.fi/PXWeb/pxweb/fi/TraFi/TraFi__Katsastuksen_vikatilastot/" target="_blank" rel="noopener">Traficomin katsastuksen vikatilastoista</a> (määräaikaiskatsastukset 2017–2025, avoin data CC BY 4.0). Traficom tilastoi mallisarjoittain, eli kaikki saman mallin käyttövoimat ja sukupolvet ovat yhdessä. Hylkäysprosentti on uusimmalta vuodelta auton ostoiän mukaan, tai lähimmältä iältä, josta on vähintään 50 katsastusta. Viat ovat hylkäykseen johtaneiden vikojen osuudet kaikista ikäluokista. Elinikä lasketaan katsastusmääristä: 10 vuoden iästä alkaen autot katsastetaan joka vuosi, joten saman vuoden autojen katsastusmäärä kertoo, montako on vielä liikenteessä. Ennen 10 vuoden ikää poistuneet autot (kolarit, vienti) eivät näy luvussa. Käytettynä tuodut autot kasvattavat lukuja, ja jos katsastusmäärät kasvavat iän mukana, elinikää ei arvioida. Kun yli puolet on vielä liikenteessä 20-vuotiaana, ikä, jossa puolet on poistunut, on arvio: vuosittainen poistumaosuus jatketaan suorana viivana iän 10–19 havainnoista. Kenttä Käyttöikä (päästöjen jakaminen) on edelleen oletus 18–20 vuotta.</li>
<li id="m-make"><b>Valmistuspäästöt</b> ovat <a href="https://theicct.org/publication/electric-cars-life-cycle-analysis-emissions-europe-jul25/" target="_blank" rel="noopener">ICCT:n</a> EU:n elinkaaritutkimuksesta (2025) keskikokoiselle autolle, kuten Golfille. Auton valmistus ja kierrätys ilman akkua: bensiini-, diesel- ja hybridiauto 8,2 t, lataushybridi 8,6 t ja sähköauto 7,5 t CO₂e. Akun valmistus on 72,8 kg CO₂e/kWh, kun painotetaan solujen valmistusmaita (30 % Eurooppa, 56 % Kiina). Rekisterissä ei ole akun kokoa. Kun se on mallin nimessä (esim. Nissan Leaf 40 kWh), käytetään sitä. Muuten sähköauton akku arvioidaan EEA:n rekisterin luvuista: WLTP-toimintasäde × WLTP-sähkönkulutus (esim. Tesla Model 3: 520 km × 13,8 kWh/100 km ≈ 72 kWh, 5,2 t). Kulutus mitataan pistorasiasta latauslaitteineen, joten arvio on yleensä 5–20 % todellista akkua suurempi (esim. VW ID.3 Pro S arvio 86 vs 82 kWh, Nissan Leaf 40 kWh -mallin arvio 48 kWh). Tämä on tarkoituksella valmistuksen päästöille epäedullisempi valinta; todellinen koko on yleensä hieman pienempi. Lataushybridin arvio heittelee molempiin suuntiin (esim. Toyota RAV4 PHEV arvio 13 vs 18 kWh), joten sille käytetään suurempaa arviosta ja EU:ssa 2023 myytyjen keskikokoisten autojen keskiarvosta 13,3 kWh (1,0 t). Ilman rekisterilukuja sähköauton oletus on sama keskiarvo 53,4 kWh (3,9 t). Akun koon voi vaihtaa oman auton mukaiseksi: sähköautossa kortilla, lataushybridissä kohdassa Tarkenna. Pienen auton valmistus tuottaa vähemmän ja ison enemmän päästöjä. Valmistuspäästöt jaetaan auton koko käyttöiälle. ICCT:n mukaan akut kestävät yleensä auton käyttöiän: alle 1 %:ssa vuoden 2016 jälkeen myydyistä sähköautoista akku on vaihdettu (Recurrent, 20 000 autoa; <a href="https://www.energy.gov/cmei/vehicles/articles/fotw-1339-april-22-2024-plug-electric-vehicle-battery-replacements-due" target="_blank" rel="noopener">Yhdysvaltain energiaministeriön mukaan</a> vuosimallien 2016–2023 vaihdot vikojen vuoksi selvästi alle 1 %).</li>
<li id="m-share"><b>Jaa vertailu</b> tekee lyhyen linkin, jossa on vain valitut mallit ja muutetut luvut; kaikki muu lasketaan avattaessa uudelleen. Tiedot ovat linkin #-merkin jälkeisessä osassa, jota selain ei lähetä palvelimelle, eikä sivu kerää mitään tietoa. Linkkiin tallentuvat vain muutetut asetukset, joten avaaja näkee ajantasaiset polttoaineen ja sähkön hinnat, ellet ole muuttanut niitä. Jaetun linkin avaaminen ei hävitä avaajan omia autoja: ne voi palauttaa.</li>
<li id="m-range"><b>Toimintasäde sähköllä</b> näkyy rekisteristä valituille sähköautoille ja lataushybrideille: virallinen WLTP-toimintasäde on Suomessa 2025 rekisteröityjen saman mallin autojen mediaani, tai uutena enää myymättömille malleille vuosina 2020–2024 rekisteröityjen (lopulliset tiedot) (<a href="https://co2cars.apps.eea.europa.eu/" target="_blank" rel="noopener">EEA:n rekisteri</a>). Talven luvut ovat arvioita Norjan autoliiton El Prix -talvitesteistä: lauhassa talvessa (−6…+8 °C, 2025) autot jäivät keskimäärin 18 % ja kovassa pakkasessa (−7…−32 °C, 2026) 38 % alle WLTP-toimintasäteen (<a href="https://www.naf.no/elbil/elprix-nytt/elprix-vinter-2026-rekkeviddetest" target="_blank" rel="noopener">NAF</a>). Testit ajettiin sähköautoilla; lataushybridille sama suhde on oletus. Vanhemmissa mallivuosissa toimintasäde on usein lyhyempi kuin rekisterin luku. Yksittäinen auto voi poiketa paljonkin. <b>Akun kunto</b> (SOH) lyhentää sähköauton toimintasädettä samassa suhteessa. Jos et kirjoita sitä, se arvioidaan auton iästä: 2,3 % vuodessa, mikä on keskimääräinen kapasiteetin lasku 22 700 sähköauton aineistossa (<a href="https://www.geotab.com/blog/ev-battery-health/" target="_blank" rel="noopener">Geotab 28.4.2026</a>; aiemmassa tutkimuksessa 1,8 %/v, ja runsaasti pikalatatuilla autoilla 3,0 %/v). Oletus on näistä epäedullisempi keskiarvo. Yksittäisen auton akku voi olla selvästi paremmassa tai huonommassa kunnossa, joten pyydä kuntoraportti. <b>Akun koko</b> muuttaa toimintasädettä samassa suhteessa, kun mallin akku tiedetään mallin nimestä (esim. Nissan Leaf 40 kWh). Rekisterissä ei ole akun kokoa, joten muille malleille kenttä vaikuttaa vain valmistuksen päästöihin.</li>
<li id="m-ekm"><b>€/km tuloskortissa on ajon energia:</b> polttoaine tai sähkö kilometriä kohden (kulutus × hinta), eli se, mitä ajaminen itse maksaa. Kaikki kulut kilometriä kohden (vuosikulu jaettuna ajomäärällä) löytyy kortin kohdasta Erittely ja vaihteluvälit. Huollon kasvun ja arvon kilometrikohtaisen laskun lisääminen ajon hintaan odottaa parempia lähteitä.</li>
<li id="m-loss"><b>Lataushäviö:</b> WLTP-testissä sähkönkulutus mitataan pistorasiasta, joten latauksen tavanomaiset häviöt ovat jo virallisissa luvuissa. Oletuksena lisätään silti 10 %, koska moni lataa kotona tavallisesta pistorasiasta, jossa häviö on suurempi: <a href="https://www.adac.de/rund-ums-fahrzeug/elektromobilitaet/laden/ladeverluste-elektroauto-studie/" target="_blank" rel="noopener">ADAC:n mittauksessa</a> (8/2026, viisi autoa) häviöt olivat pistorasiasta (2,3 kW) noin 15 % ja yhdellä autolla 24 %, latausasemalla (11–22 kW) alle 7 %. Jos lataat latausasemalla, aseta lisähäviöksi 0.</li>
<li id="m-nocar"><b>Ilman omaa autoa</b> -vertailu kuvaa vuoden matkat matkatyyppeinä (määrä, pituus ja kulkutapa). Oletuksena on yksi matkatyyppi: ajomääräsi 19,5 km:n matkoina, mikä on henkilöauton kuljettajana tehdyn matkan keskipituus (<a href="https://www.traficom.fi/files/media/publication/HLT_2021_p%C3%A4%C3%A4raportti.pdf" target="_blank" rel="noopener">Henkilöliikennetutkimus 2021</a>, Traficom; vuoden 2021 tuloksiin vaikutti korona, ja keskipituus oli sama kuin 2016). Auton ja matkustajan matkat jakautuvat tutkimuksen mukaan melko tasaisesti 1–50 km:n välille, joten lyhyet ja pitkät matkat kannattaa lisätä omina rivinään. <b>Taksi:</b> sovelluksella tilattu 10 km:n kyyti maksoi kesäkuussa 2024 13–20 € (<a href="https://traficom.fi/en/news/regional-variation-taxi-service-prices-and-availability-continues" target="_blank" rel="noopener">Traficom 12.11.2024</a>); oletuksena on haarukan yläpää 20 €, koska halvempi vaihtoehto on autolle epäedullisempi valinta. Puhelimella tai tolpalta tilatun 10 km:n ja 15 minuutin esimerkkimatkan mediaani oli Taksiliiton 30 suurimmalla välitysyhtiöllä (noin 70 % takseista) 30,77 € ilman arvonlisäveroa (<a href="https://www.traficom.fi/files/media/regulation/taksihinnasto%202024%20Perustelumuistio.pdf" target="_blank" rel="noopener">Traficomin perustelumuistio 19.12.2024</a>), arvonlisäveron 13,5 % kanssa 34,92 €. Muiden pituuksien hinta lasketaan suhteessa matkan pituuteen; tämä on oletus: lyhyillä matkoilla todellinen hinta on aloitusmaksun vuoksi suhteessa suurempi ja pitkillä pienempi. Sovellushinnat ovat lähinnä suurista kaupungeista, ja taksin saatavuus vaihtelee alueittain. <b>Vuokra-auton, yhteiskäyttöauton ja joukkoliikenteen</b> hinnoille ei löytynyt koko maata kuvaavaa lähdettä, joten ne kirjoitetaan itse oman alueen mukaan (tyhjä = ei käytössä). Vuokra-autolle lasketaan yksi vuorokausi matkaa kohden; kausilippu lasketaan kerran, jos jokin matkatyyppi käyttää joukkoliikennettä. Kävely ja pyöräily ovat 0 €; pyörän hankintaa ei lasketa. Aikaa ja vaivaa ei lasketa rahaksi. Oman auton viiva on sama vuosikulu kuin vertailussa, ja autoton vuosikulu kasvaa suoraan ajomäärän mukaan. Asetukset tallentuvat tähän selaimeen, mutta eivät kulje jakolinkissä.</li>
<li id="m-find"><b>Hae edullisin</b> käy läpi kaikki mallit, joille on hinta-arvio ja joita on rekisterissä vähintään 200 (harvinaisista malleista hinta- ja kulutustieto on epävarmaa). Kustakin valitaan nuorin vuosimalli, jonka arvioitu hinta mahtuu enimmäishintaan, kuten mallin valinnassa, ja vuosikulu lasketaan samoilla asetuksilla kuin vertailun autoille (ajomäärä, omistusaika, rahoitus, vakuutus, renkaat ja huolto sekä pois jätetyt kulut). Saman mallin versioista näytetään halvin. Järjestys perustuu mallien keskiarvoihin: yksittäisen auton kunto, varustelu ja huoltohistoria voivat muuttaa hintaa paljon, ja todellinen kulutus on mallin oma mitattu luku vain, kun EEA:n aineistossa on sille tarpeeksi autoja (muuten merkin keskiarvo, ja tulos on merkitty). Rekisterissä ei ole korimallia eikä kokoa, joten haku ei tiedä, sopiiko auto tarpeisiisi: vertaa itse tiloja ja kokoa. Jos olet merkinnyt nykyisen autosi, haku näyttää sen vuosikulun vertailukohtana ja jokaisen tuloksen eron siihen; nykyisen auton arvo (vaihtohyvitys) on silloin mukana muiden autojen omassa rahassa. Napilla voit korvata vertailun muut autot edullisimmilla, jolloin nykyinen auto jää vertailuun.</li>
<li id="m-pick"><b>Mallin valinta</b> täyttää ostohinnan, iän ja mittarilukeman, ellet ole kirjoittanut niitä itse: ikä on nuorin mallivuosi, jonka arvioitu hinta mahtuu enimmäishintaan, hinta on mallin arvo uutena (Verohallinnon verotusarvoista, sama menetelmä kuin esimerkkiautoissa, vähintään 5 päätöstä) kerrottuna arvonaleneman kertoimella, ja mittarilukema on ikä kertaa mallin mediaaniajomäärä Traficomin rekisterissä. Arvio on suuntaa-antava: vaihda oikea hinta, kun tiedät sen. Noin 80 %:lle malleista on arvio.</li>
<li id="m-var"><b>Vaihteluväli</b> tuloskorteissa näyttää vuosikulun 15 vuoden halvimmilla ja kalleimmilla energian hinnoilla (12 kuukauden keskihinnat nykyrahassa, Tilastokeskus). Lähteet ja oletukset ovat tulosten alla kohdassa Lisätietoja vaihteluväleistä.</li>
<li id="m-tip"><b>Kuinka varma järjestys on?</b> Sivu muuttaa yhtä asiaa kerrallaan ja etsii lähimmän arvon, jolla halvin auto vaihtuu, ja näyttää kaksi lähintä. Haun rajat: ajomäärä 2 000–50 000 km, polttoaineen ja sähkön hinta puolesta kaksinkertaiseen, omistusaika 1–20 vuotta ja arvonalenema puolesta kaksinkertaiseen (sama kerroin kaikille autoille). Rajat eivät ole ennusteita tai vaihteluvälejä, vaan sitä, kuinka kaukaa kääntöpistettä haetaan; kaukana olevaa kääntöpistettä ei näytetä.</li>
<li id="m-ins"><b>Vakuutus</b> on jaettu pakolliseen liikennevakuutukseen ja vapaaehtoiseen kaskoon. Avointa tilastoa henkilöauton vakuutusmaksuista ei löytynyt (<a href="https://www.finanssivalvonta.fi/en/publications-and-press-releases/news-releases/2025/statistical-survey-of-motor-liability-insurance-profitability-20192023-result-recorded-for-2023-was-excellent-despite-slight-decline-in-underwriting-result/" target="_blank" rel="noopener">Finanssivalvonta</a> kertoo vain koko markkinan maksutulon), joten oletukset ovat Taloustaidon hintavertailujen keskiarvoja, kustakin suurempi: <a href="https://www.taloustaito.fi/vapaalla/2026/taloustaito-vertaili-huimat-erot-autovakuutusten-hinnoissa/" target="_blank" rel="noopener">vertailu 24.9.2026</a> (neljä yhtiötä, 12 kolme vuotta vanhaa autoa): liikennevakuutus bensiini- ja hybridiautoilla 167, lataushybrideillä 198 ja sähköautoilla 204 €/v, kasko 482, 701 ja 833 €/v; <a href="https://www.taloustaito.fi/vapaalla/sahkoautoilija-nain-paljon-autosi-kayttovoima-korottaa-vakuutusmaksuja/" target="_blank" rel="noopener">vertailu 20.10.2022</a> (Kia Niro 2021–2022, kolme yhtiötä): kevythybridi liikenne 198 ja kasko 520 €/v, täyssähkö 196 ja 771 €/v. Oletukset: liikennevakuutus 200 €/v (sähkö 205), kasko 520 €/v (bensiini, diesel, hybridi), 700 (lataushybridi) ja 835 (sähkö); dieselistä ei ollut omaa lukua. Vertailujen vakuutuksenottaja oli 59-vuotias täysillä bonuksilla pääkaupunkiseudun ympäristökunnassa: nuoremmalle tai bonuksettomalle hinta on usein selvästi suurempi. Kasko riippuu myös auton arvosta, ja vanhaa halpaa autoa ei usein kaskoteta. Kirjoita omat tarjouksesi kohtaan Tarkenna. Osakasko on 37 % täyskaskon hinnasta Taloustaidon <a href="https://www.taloustaito.fi/vapaalla/2025/autovakuutus--ala-maksa-turhasta/" target="_blank" rel="noopener">26.9.2025</a> vertailun mukaan (neljä yhtiötä, 14 v vanha Octavia: osakasko keskimäärin 86 €/v, laaja kasko 231 €/v). Osakasko ei korvaa omaa kolaria.</li>
<li>Huollon lähtötaso on karkea oletus. Tämä on luonnos, ei tarkistettu vertailu.</li>`,

  notes:`<li id="m-fi"><b>Finland only, for now:</b> fuel and electricity prices, taxes, grid emissions and the model list describe Finland. The method works for any EU country once those inputs are changed.</li>
<li id="m-dep"><b>Depreciation:</b> residual value = price × (1 − depreciation %)<sup>years</sup>. If you leave the percentage blank, it is chosen by the car's average age during ownership: under 3 years 17%, 3–5 years 10%, 6–9 years 11%, 10–19 years 12%, 20 years or more 10%. The rates come from the Finnish Tax Administration's taxation values (<a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2024.xls" target="_blank" rel="noopener">2024</a>, <a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2025.xls" target="_blank" rel="noopener">2025</a>, <a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2026.xls" target="_blank" rel="noopener">2026</a>) (114,000 cars imported used in 2024–2026), comparing cars of the same model at different ages. Above-average mileage (over 15,000 km/yr) lowers the residual value by 0.2% per 1,000 km per year; this is an assumption without a source. <b>Depreciation is an average over models, not a forecast for one car:</b> its condition, service history, equipment, demand and, for an electric car, the battery can move the resale price a lot either way. The tipping points under the results show how much depreciation would have to change for the cheapest car to change. In the same data half of the individual cars are within 7% of their model\'s typical value, and one in five differ by more than 15%; the resale range on the result cards uses that middle half.</li>
<li id="m-ex"><b>Example cars</b> are the models most common in the Finnish car fleet (<a href="https://avoindata.suomi.fi/data/fi/dataset/ajoneuvojen-avoin-data" target="_blank" rel="noopener">Traficom open vehicle data</a>, 30 June 2026), not the top of the new-car sales charts: for someone buying a used car they are the most usual options. The six most common full hybrids are all Toyotas (Corolla about 33,000, Yaris 25,000, C-HR 15,800 cars; the first other make is the Nissan Qashqai, 7,200), and the most common electric cars are the Tesla Model Y and Model 3 (16,300 and 14,900). An example car is not a recommendation, and you can swap it for any model. The examples follow your maximum price: the petrol car is always a Golf (Finland's most common car of median age), the hybrid a Toyota Corolla, Auris or Yaris, and the electric car the most common model in the register that fits your budget. Each is the youngest model year whose estimated price fits. Price estimates come from the Tax Administration's taxation values (<a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2025.xls" target="_blank" rel="noopener">2025</a>, <a href="https://www.vero.fi/contentassets/f3326d05d3954bed9c1686a17917754d/henkiloautojen-sovelletut-verotusarvot-2026.xls" target="_blank" rel="noopener">2026</a>), mileage from the model's average annual mileage. Once you edit an example car, it stops following the budget.</li>
<li id="m-fin"><b>Financing:</b> whatever your own money and trade-in do not cover is financed with an annuity loan. Its cost is the interest and monthly fees paid during ownership. If the car is sold before the loan is repaid, the rest is paid from the sale. On top of that, own money tied up in the car is charged the return it would have earned elsewhere. Cars above your maximum price are flagged. Defaults, taking the figure less favourable to the car where there is a choice: <b>loan interest 4.40%</b> = average rate on the stock of vehicle loans at the end of May 2026 (<a href="https://www.suomenpankki.fi/fi/tilastot/tilastotiedotteet/rahalaitosten-tase/2026/kotitalouslainojen-korot-nousivat-toukokuussa-2026/" target="_blank" rel="noopener">Bank of Finland, 30 June 2026, in Finnish</a>; new vehicle loans 4.08%). <b>Return on own money 2.48%</b> = average rate on new term deposits in May 2026 (<a href="https://www.suomenpankki.fi/fi/tilastot/tilastotiedotteet/rahalaitosten-tase/2026/kotitalouslainojen-korot-nousivat-toukokuussa-2026/" target="_blank" rel="noopener">same release</a>; all deposits 0.82%). <b>Loan fees €12.50/month</b> = the account fee in the Nordea car loan example (<a href="https://www.nordea.fi/en/personal/our-services/loans/consumer-credit/autolaina.html" target="_blank" rel="noopener">Nordea</a>). Return on own money is what the money would earn elsewhere; 0 if it would sit in an account without interest.</li>
<li id="m-km"><b>Mileage shortcuts</b> are actual annual mileages of cars in Finland (median, <a href="https://avoindata.suomi.fi/data/fi/dataset/ajoneuvojen-avoin-data" target="_blank" rel="noopener">Traficom open vehicle data</a>, 30 June 2026).</li>
<li id="m-city"><b>City and highway driving:</b> the default 39% city driving comes from Finnish passenger-car kilometres: in 2025, 9,883 million km on streets and private roads and 29,136 million km on public roads (<a href="https://pxdata.stat.fi/PxWeb/pxweb/fi/StatFin/StatFin__tiet/12jx.px/" target="_blank" rel="noopener">Statistics Finland 12jx</a>), and 18% of public-road traffic was on roads with a limit of 60 km/h or less (<a href="https://pxdata.stat.fi/PxWeb/pxweb/fi/StatFin/StatFin__tiet/12k1.px/" target="_blank" rel="noopener">12k1</a>, all vehicles). The effect of city driving comes from the WLTP test phases: city driving corresponds to the low and medium phases (about 19 and 39 km/h on average), highway driving to the high and extra-high phases (about 56 and 92 km/h, peak 131 km/h). Phase consumption is in the open data of <a href="https://carfueldata.vehicle-certification-agency.gov.uk/downloads/default.aspx" target="_blank" rel="noopener">the UK type-approval authority VCA</a> (18 Nov 2026, about 3,700 models; for electric cars the city and combined range). As a median over models, city consumption is 1.14 times highway consumption for petrol cars, 1.16 for diesels, 1.01 for plug-in hybrids on fuel, 0.81 for full hybrids, and 0.68 for electric cars. At the default share consumption equals the measured real-world figure; changing the share changes it by these ratios. When the data has at least three versions of the same model family (about 180 models, e.g. Toyota Corolla hybrid 0.73, VW Golf eTSI 1.16), the model's own ratio is used, otherwise the powertrain median. This separates mild hybrids, which behave like petrol cars (median 1.13), from full hybrids even where the data's own labels are inconsistent. Limitation: the figures are from a laboratory test, and Finnish winters raise consumption especially on short town trips. A hybrid without a model figure gets the full-hybrid median.</li>
<li id="m-mine"><b>Your current car:</b> one car can be marked as your current car. Its purchase price is its current value (what you would get by selling it), plus any loan still on it and the years left. The value minus the loan is own money tied up in the car, and its lost return is counted as for other cars; interest and fees on the remaining loan use the Financing rate. If the trade-in option is on (the default), the current car's net value, sale value minus loan, is added to the own money for the other cars; if the loan exceeds the value, the difference increases the new car's loan. The other cars' result cards show the difference to your current car in euros and emissions per year and over the whole ownership period. <b>Switching-decision emissions</b> are shown separately over the whole ownership period: the rest of the comparison spreads each car's manufacturing evenly over its lifetime, but when deciding whether to keep or switch, the current car is already built, so keeping it counts driving only. Switching to a new car (under a year old) counts its whole manufacturing, because the purchase causes a new car to be made. A used car gets the ownership years' share of its remaining lifetime (manufacturing × years ÷ (lifetime − age), at least the ownership period). This is deliberately the less favourable way; another defensible way is to count 0 for a used car, since buying it does not cause a new car to be made. The allocation is the calculator's assumption, not from a source. The current car does not change with the maximum price. All data stays in this browser; a shared link carries it only if you share it yourself.</li>
<li id="m-month"><b>Two monthly figures</b> on the result card: the <i>true cost</i> is the annual cost divided by twelve, and <i>paid out</i> is what leaves your account each month while the loan runs: the loan payment with fees, plus energy and other costs (tax, insurance, servicing, tyres) spread over the months. Depreciation and the lost return on own money are real costs but never arrive as a monthly bill, so they are left out. That is why the amount paid out can be lower or higher than the true cost. Tax, insurance and servicing are really billed less often, so the figure is a monthly average. If the loan is shorter than the ownership period, outgoings drop once it is paid off. Unexpected repairs are not included. For a cash purchase the card shows the sum needed at once; when partly financed, the own money and the loan. If you enter a monthly budget (optional), cars over it are flagged.</li>
<li id="m-real"><b>Real-world consumption:</b> the WLTP figure is multiplied by a factor measured from the cars' own on-board fuel consumption meters (read at periodic inspections, among other ways). The factor is <b>model-specific</b> for 367 models; the rest fall back to a brand or powertrain average, and each car's card says which one is in use. On average petrol cars use 20% and diesels 18% more than WLTP, but models differ widely. The figures cover the whole EU and do not account for Finnish winters.</li>
<li id="m-old"><b>Older cars (model year 2017 or earlier):</b> their official consumption was measured with the old NEDC test, which understates consumption far more than WLTP. The calculator uses the model's own NEDC figure for that model year from the Traficom register and adds the gap measured by the <a href="https://theicct.org/publication/from-laboratory-to-road-a-2018-update/" target="_blank" rel="noopener">ICCT</a>: 8% for 2001 cars, 38% for 2014 and 40% for 2016 cars, interpolated linearly in between.</li>
<li id="m-phev"><b>Plug-in hybrids:</b> the default consumption is the model's own measured average where there is one, otherwise the brand's. Across the EU that is 6.0 l/100 km, where WLTP promises 1.4. By default 25% of driving is electric. Raise the share if you charge diligently.</li>
<li id="m-ev"><b>Electric cars:</b> consumption is the model's WLTP figure from the EEA register (cars registered in Finland in 2025; 2020–2022 for models no longer sold). Measured consumption is not collected from battery-electric cars, so the 1.20 factor is an assumption. Battery wear adds no cost in the calculator: in a <a href="https://www.geotab.com/blog/ev-battery-health/" target="_blank" rel="noopener">Geotab study</a> (22,700 cars) capacity fell by 2.3% a year on average, about 1.5% for cars charged mostly at home and about 3% for heavy fast-charger users. A worn battery shortens the range but barely raises consumption. No reliable figure was found for how often batteries are replaced.</li>
<li id="m-serv"><b>Servicing and repairs</b> rise with mileage. The value in the field is the level for a low-mileage car (under 80,000 km) and is a rough assumption. The rise follows <a href="https://advocacy.consumerreports.org/wp-content/uploads/2020/10/TCO-Fact-Sheet-Chapter-2-FINAL.pdf" target="_blank" rel="noopener">Consumer Reports</a> owner surveys (United States, 2020): per kilometre, a combustion car with 80,000–160,000 km costs 2.1 times as much to service and repair, and beyond that 2.8 times. For electric cars the factors are 2.3 and 3.6, but from a starting level under half that of a combustion car. The calculator averages the factor over the distance you drive during ownership; each car's card shows it. Plug-in and regular hybrids use the combustion factors. The source is American, so the euro amounts are the calculator's own and only the rise comes from the source. The German <a href="https://www.datgroup.com/fileadmin/at/DAT_Report/2025/DAT-Report-2025-Kurzbericht.pdf" target="_blank" rel="noopener">DAT Report 2025</a> shows owners of cars over 6 years old spending even less on servicing than owners of 3–6-year-old cars: owners of old cars often save on servicing, which can cost more later. <b>Servicing levels</b> (More settings → Other costs): <b>Average 100%</b> is the calculator\'s default, close to the 2016 level of the Statistics Finland household budget survey (servicing and repairs about €1,000 and parts €135 per car a year, in 2022 money; <a href="https://pxdata.stat.fi/PXWeb/pxweb/fi/StatFin/StatFin__ktutk/14pg.px" target="_blank" rel="noopener">table 14pg</a>). <b>Budget 42%</b> is the same survey\'s 2022 level relative to 2016: (380 + 98) / (1,000 + 135) €. It also reflects people servicing their own cars and skipping servicing, but Statistics Finland says the drop is mainly due to a change in data collection. <b>Premium 110%</b> is dealer servicing: scheduled servicing at brand dealers cost on average about 10% more than at general garages (Promira telephone survey commissioned by Ford, 56 dealer and about 120 general garages; <a href="https://www.taloustaito.fi/vapaalla/auto-huoltoon--merkkihuolto-vai-riippumaton-korjaamo-kumpi-kannattaa/" target="_blank" rel="noopener">Taloustaito 31 May 2019</a>, in Finnish). A carmaker commissioned the survey, and the gap may be larger for repairs.</li>
<li id="m-tyre"><b>Tyres</b> are costed by the chosen rim size (default 17″, change it under Fine-tune on the car; the register has no tyre size). Finland needs a summer and a winter set, each covering half the year's kilometres. A set is replaced when worn out, after 30,000 km (<a href="https://www.verkkouutiset.fi/a/joka-toinen-ajaa-renkaansa-loppuun-ei-kannattaisi/" target="_blank" rel="noopener">Finnish Tyre Association: summer tyres usually 30,000–35,000 km</a>, lower bound), or after 6 years of use at the latest (<a href="https://moottori.fi/uutinen/autoliitto-ohjeistaa-muista-nama-asiat-renkaanvaihdon-yhteydessa/" target="_blank" rel="noopener">Autoliitto</a>). Electric cars wear tyres 20% faster (<a href="https://www.moveelectric.com/e-cars/do-electric-cars-wear-out-tyres-faster" target="_blank" rel="noopener">Michelin and Emissions Analytics</a>). Prices: 16″ winter tyre Nokian Hakkapeliitta R5 €185.07 and summer tyre Nokian Wetproof 1 €94.16 each at Rengas Online on 10 Nov 2026 (<a href="https://easygarage247.fi/?p=5417" target="_blank" rel="noopener">Easy Garage 24/7 price comparison</a>; one of the dearer shops, cheapest €149.47 and €73.99). Other sizes in the same proportion as the median Hakkapeliitta R5 price by rim size (<a href="https://www.rengas365.fi/renkaat/tuotemerkki/nokian/talvirenkaat/kitka/hakkapeliitta-r5/6129" target="_blank" rel="noopener">Rengas365</a>, 19 Nov 2026): 15″ 0.75, 17″ 1.24, 18″ 1.43, 19″ 1.81, 20″ 2.19 times 16″. For example 17″ at 15,000 km/yr: 4 × (117 + 229) € × 7,500 / 30,000 ≈ €350/yr. <b>Other costs</b> default to ADAC's washing and care, €250/yr (<a href="https://assets.adac.de/Autodatenbank/Autokosten/autokosten_grundlagen.pdf" target="_blank" rel="noopener">ADAC 10/2026</a>, Germany); no source was found for tyre changes and storage. <b>Cross-check with the Statistics Finland household budget survey</b> (<a href="https://pxdata.stat.fi/PXWeb/pxweb/fi/StatFin/StatFin__ktutk/14pg.px" target="_blank" rel="noopener">table 14pg</a>; about one car per household, <a href="https://pxdata.stat.fi/PxWeb/pxweb/fi/StatFin/StatFin__ktutk/13qy.px/" target="_blank" rel="noopener">13qy</a>): in 2022 Finnish households spent per car about €47 on tyres, €98 on parts and €380 on servicing and repairs; in 2016 about €80, €135 and €1,000 (in 2022 money). Statistics Finland says the drop in servicing and repairs is mainly due to a change in how the data were collected. The calculator's servicing default is near the higher level and its tyre cost well above the survey: the survey averages the whole fleet, and many people buy cheap or used tyres. This is deliberately the less favourable choice. <b>Tyre price levels</b> (More settings → Other costs): The levels are percentages of the default summer plus winter tyre price (€279.23 in size 205/55 R16: Nokian Wetproof 1 and Hakkapeliitta R5, Rengas Online 10 Nov 2026). <b>Premium 100%</b> is this default. <b>Average 83%</b> is the median price for 205/55 R16 at <a href="https://www.rengas365.fi/etsi-tuote/renkaat?Width=205&Profile=55&Diameter=16&Season=1" target="_blank" rel="noopener">Rengas365</a> on 19 Nov 2026: summer tyre €98.13 (98 tyres) and <a href="https://www.rengas365.fi/etsi-tuote/renkaat?Width=205&Profile=55&Diameter=16&Season=2" target="_blank" rel="noopener">Nordic winter tyre</a>, friction or studded, €132.99 (32 tyres). <b>Budget 57%</b> is the lower quartile of the same ranges: summer €78.42 and winter €81.16. Used tyres and fitting are not included. <b>Why is this more than the €47–80 per car a year in the Statistics Finland survey?</b> The calculator asks what tyre wear costs you when you buy new tyres whenever the old ones wear out. The survey shows what households on average paid for tyres that year. The gap probably comes from: (1) A used car usually comes with summer and winter tyres, so no money goes on tyres for years. The calculator spreads the price of new tyres evenly over every year. (2) The calculator uses a life of 30,000 km or 6 years, while many people drive on the same tyres longer. (3) Older cars often have 15–16″ rims, and many people buy cheap or used tyres. (4) The survey is probably on the low side: infrequent purchases are easily left unrecorded, and Statistics Finland says the 2022 drop in servicing and repairs is mainly due to a change in data collection (tyres about €80 in 2016, €47 in 2022). Tyres fitted at a garage may also be recorded under servicing; this has not been checked. For example, 16″ budget tyres lasting 45,000 km cost about €106 a year at 15,000 km a year. For comparing cars the calculator\'s approach is fairer, because it accounts for, say, faster tyre wear on electric cars and larger rims.</li>
<li id="m-excl"><b>Leaving a cost out:</b> servicing, tyres and other costs can be left out of the comparison with the buttons in the cost table (Leave out / Include), for example if you service the car yourself or buy used tyres. The choice applies to all cars so the comparison stays fair, and a note under the results says so. The cost leaves the yearly total and the monthly figures; the row stays in the table, dimmed.</li>
<li id="m-elem"><b>Electricity emissions:</b> direct emissions of Finnish generation 26 g/kWh in 2025 (<a href="https://energia.fi/wp-content/uploads/2026/01/Sahkovuosi-2025_v1.pdf" target="_blank" rel="noopener">Finnish Energy, Electricity year 2025</a>; the same figure from <a href="https://fingridlehti.fi/sahkon-paastojen-lasku-jatkuu/" target="_blank" rel="noopener">Fingrid</a>) + fuel supply chain 16 g/kWh (<a href="https://doi.org/10.1016/j.trd.2017.07.012" target="_blank" rel="noopener">Moro and Lonza 2018, EU JRC</a>; checked only through a secondary source). Lifecycle values by generation type (nuclear and wind 12, hydro 24, solar 48 g/kWh) are medians from <a href="https://www.ipcc.ch/site/assets/uploads/2018/02/ipcc_wg3_ar5_annex-iii.pdf" target="_blank" rel="noopener">IPCC AR5 Annex III</a>. <a href="https://unece.org/sed/documents/2021/10/reports/life-cycle-assessment-electricity-generation-options" target="_blank" rel="noopener">UNECE's 2021 life-cycle assessment</a> gives lower values for nuclear and wind (about 5–16 g/kWh); the default uses the higher ones.</li>
<li id="m-fuelem"><b>Fuel emission factors:</b> tailpipe + supply chain (well-to-wheel), <a href="https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2025" target="_blank" rel="noopener">UK government conversion factors 2025</a>, average biofuel blend: petrol 2.07 + 0.58 kg/l, diesel 2.57 + 0.61 kg/l. The default also counts the tailpipe CO₂ of the biofuel part (0.13 and 0.14 kg/l), which is usually left out: without it the figures would be 2.65 and 3.18 kg/l. Finnish fuels usually contain more bio content.</li>
<li id="m-src"><b>Main data and open code:</b> model list and CO₂ values from <a href="https://avoindata.suomi.fi/data/fi/dataset/ajoneuvojen-avoin-data" target="_blank" rel="noopener">Traficom open vehicle data</a> (30 June 2026), measured consumption from the <a href="https://climate-energy.eea.europa.eu/topics/transport/real-world-emissions/additional_information" target="_blank" rel="noopener">EEA's OBFCM dataset</a> and electricity consumption from the <a href="https://co2cars.apps.eea.europa.eu/" target="_blank" rel="noopener">EEA new-car register</a> (cars registered in Finland 2020–2025). All CC BY 4.0. Depreciation from the Finnish Tax Administration's taxation values and the NEDC correction from the ICCT. The full calculation model and the data behind it are <a href="https://github.com/TapioT1986/CarFootprint" target="_blank" rel="noopener">on GitHub</a>.</li>
<li id="m-cmp"><b>Comparison with other calculators</b> (checked 20 Nov 2026). <a href="https://autokalkulaattori.fi/" target="_blank" rel="noopener">The Finnish Climate Panel's Autokalkulaattori</a> (Traficom, new cars, defaults from the site's data): electricity 96 + 16 g/kWh (here 26 + 16: the Finnish Energy figure for 2025 is newer), petrol 2.35 + 0.66 and diesel 2.69 + 0.75 kg/l (here 2.78 and 3.32 kg/l in total: UK conversion factors 2025 with the average biofuel blend; Autokalkulaattori uses EU JRC 2014), battery manufacturing 70 kg/kWh (here 72.8), manufacturing a medium combustion car 5.4 t (here 8.2 t, ICCT 2025, the less favourable figure), servicing a flat €300/yr for combustion and €240/yr for electric cars (here €400 and €250/yr at low mileage, rising with mileage). Autokalkulaattori also includes a home charger (€1,200), a battery replacement every 300,000 km (€300/kWh), end-of-life emissions (0.96 t, electric 1.24 t) and energy prices rising 1.5%/yr; this calculator does not. <a href="https://www.ayvens.com/fi-fi/tietoa-meista/uutiset-ja-artikkelit/uutiset/car-cost-index-2026/" target="_blank" rel="noopener">Ayvens Car Cost Index 2026</a> (27 Apr 2026: new lease cars for business customers, 30,000 km/yr, 4 years, before VAT, full comprehensive cover): in Finland a medium electric car €956 and a petrol car €988 a month, small €773 and €806. With the same use this calculator gives new cars, VAT included, for example VW ID.3 892, VW Golf 1,154, Skoda Octavia 1,104, Renault ZOE 721 and VW Polo €877 a month, the same order of magnitude; petrol cars cost more here because consumption is real-world rather than official and prices include VAT.</li>
<li id="m-tax"><b>Vehicle tax</b> follows the 2026 tax tables (<a href="https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2024/814" target="_blank" rel="noopener">Vehicle Tax Act, amendment 814/2024</a>). The base tax depends on the car's official CO₂ emissions and is €106–654 a year. The emissions are worked out from the model's official consumption: model years 2017 and older use the NEDC table 1, newer cars the WLTP table 1 A. Electric cars first registered on or after 1 October 2021 pay €171 a year; the calculator treats model years 2022 and newer as such. Plug-in hybrids pay the lowest band, as their WLTP emissions are almost always below 103 g/km. Diesel, electric and plug-in hybrid cars also pay a propulsion tax: 5.5, 1.9 or 0.95 cents a day for every started 100 kg of total mass. Total mass is not yet in the model list, so it is an assumption (diesel 2,000 kg, electric 2,200 kg, plug-in hybrid 2,300 kg). Your own car's total mass is on its registration certificate; change it under More assumptions. <a href="https://www.edilex.fi/he/20260173" target="_blank" rel="noopener">Government proposal HE 173/2026</a> would lower the base tax of cars taxed under tables 1 and 2 (mainly combustion cars at least 10 years old) by about €6 a year on average from 2028. It is still before Parliament and is not included.</li>
<li id="m-insp"><b>Inspections and lifetime</b> (information on the car card, not used in the calculation) come from <a href="https://trafi2.stat.fi/PXWeb/pxweb/fi/TraFi/TraFi__Katsastuksen_vikatilastot/" target="_blank" rel="noopener">Traficom's periodic inspection statistics</a> (inspections 2017–2025, open data CC BY 4.0). Traficom groups cars by model series, so all powertrains and generations of a model are together. The failure rate is for the latest year at the car's age at purchase, or the nearest age with at least 50 inspections. The faults are shares of the faults that caused a failure, all ages together. Lifetime is worked out from inspection counts: from 10 years on, cars are inspected every year, so the count for one model year shows how many are still on the road. Cars that left the road before 10 years (crashes, exports) do not show in the figure. Cars imported used raise the counts, and if the counts rise with age, no lifetime is estimated. When more than half are still on the road at 20, the age at which half have left is an estimate: the yearly drop-out rate is continued as a straight line from ages 10–19. The Lifetime field (spreading manufacturing emissions) is still the 18–20-year assumption.</li>
<li id="m-make"><b>Manufacturing emissions</b> come from the <a href="https://theicct.org/publication/electric-cars-life-cycle-analysis-emissions-europe-jul25/" target="_blank" rel="noopener">ICCT</a> EU life-cycle study (2025) for a medium-size car such as the Golf. Making and recycling the car without its battery: petrol, diesel and hybrid cars 8.2 t, plug-in hybrids 8.6 t and electric cars 7.5 t CO₂e. Battery production is 72.8 kg CO₂e per kWh, weighted by where the cells are made (30% Europe, 56% China). The register does not give the battery size. When it is in the model name (e.g. Nissan Leaf 40 kWh), that is used. Otherwise an electric car's battery is estimated from the EEA register: WLTP range × WLTP electricity consumption (e.g. Tesla Model 3: 520 km × 13.8 kWh/100 km ≈ 72 kWh, 5.2 t). Consumption is measured at the socket including charging losses, so the estimate is usually 5–20% above the real battery (e.g. VW ID.3 Pro S estimate 86 vs 82 kWh, Nissan Leaf 40 kWh estimate 48 kWh). This is deliberately the less favourable choice for manufacturing emissions; the real size is usually a little smaller. For plug-in hybrids the estimate goes both ways (e.g. Toyota RAV4 PHEV estimate 13 vs 18 kWh), so they use the larger of the estimate and the 2023 EU average for medium-size cars, 13.3 kWh (1.0 t). Without register figures an electric car defaults to the same average, 53.4 kWh (3.9 t). You can set your own car's battery size: on the card for electric cars, under Fine-tune for plug-in hybrids. A small car takes less to make and a large one more. Manufacturing emissions are spread over the car's whole lifetime. According to the ICCT, batteries usually outlast the car: fewer than 1% of electric cars sold after 2016 have had their battery replaced (Recurrent, 20,000 cars; <a href="https://www.energy.gov/cmei/vehicles/articles/fotw-1339-april-22-2024-plug-electric-vehicle-battery-replacements-due" target="_blank" rel="noopener">the US Department of Energy</a> puts replacements due to failure in model years 2016–2023 well under 1%).</li>
<li id="m-share"><b>Share comparison</b> makes a short link holding only the chosen models and the numbers you changed; everything else is recalculated when it opens. The data sits after the # sign, which browsers never send to the server, and the page collects nothing. Only settings you changed go into the link, so whoever opens it sees current fuel and electricity prices unless you changed them. Opening a shared link does not lose the opener's own cars: they can be restored.</li>

on.</li>

// Asettaa auton kulutusoletukset mitatun datan mukaan
function applyRW(c, brandName, kwh, rwVal, rwN){
  const b = RW.brand[normB(brandName)] || {}, d = PT_DEF[c.pt];
  c.rw = null;

    else { c.real = +RW.fleet[k].k.toFixed(2); c.rw = {t:'fleet', n:RW.fleet[k].n}; }

            n:rwVal?rwN:(b.PE?b.PE[1]:RW.fleet.PE.n), avg:f, kwhReg:kwh!=null};

// Arvonalenema iän mukaan, Verohallinnon verotusarvoista (data/depreciation.json)
const AGE_DEP = [[0,.17],[3,.10],[6,.11],[10,.12],[20,.10]];
// NEDC-testin ja todellisen kulutuksen ero (ICCT, From laboratory to road 2015 ja 2018)
const CUR_YEAR = new Date().getFullYear(), LAST_NEDC = 2017;
function nedcGap(y){ const P = [[2001,.08],[2014,.38],[2016,.40],[2017,.39]];
  if (y<=P[0][0]) return P[0][1]; if (y>=P[P.length-1][0]) return P[P.length-1][1];
  for (let i=1;i<P.length;i++) if (y<=P[i][0]){ const [a,ga]=P[i-1],[b,gb]=P[i]; return ga+(gb-ga)*(y-a)/(b-a); } }
const regYear = c => CUR_YEAR - Math.round(c.age||0);
const isNedc = c => 'BDH'.includes(c.pt) && regYear(c) <= LAST_NEDC;
const findRow = ([b,m,pt]) => CATALOG.find(r => r[0]===b && r[1].toUpperCase()===m.toUpperCase() && r[2]===pt);
const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];

// Golf eTSI: vuodesta 2020 Golfit ovat kevythybridejä, jotka Traficom luokittelee hybrideiksi; bensiini-Golf päättyy
// rekisterissä vuoteen 2020. Arvot uutena laskee tools/budget_values.py Verohallinnon verotusarvoista.
const BUDGET_CARS = [["B","Volkswagen","GOLF","Golf",32800,null,null],["B","Volkswagen","GOLF","Golf eTSI",36500,null,"H"],["H","Toyota","Corolla","Corolla",36600,null,null],["H","Toyota","Auris","Auris",38800,2019,null],["H","Toyota","Yaris","Yaris",29000,null,null],["E","Tesla","Model Y","Tesla Model Y",53800,null,null],["E","Tesla","MODEL 3","Tesla Model 3",47000,null,null],["E","Volkswagen","ID.3 PRO 150 KW","VW ID.3",36900,null,null],["E","Hyundai","KONA","Hyundai Kona",37500,null,null],["E","Kia","NIRO","Kia Niro",39000,null,null],["E","Nissan","LEAF 40KWH","Nissan Leaf",24500,null,null],["E","Volkswagen","GOLF","VW e-Golf",29100,2020,null],["E","Renault","ZOE","Renault Zoe",24700,null,null]]; // data/budget_cars.json (tools/budget_values.py)
const SLOTS = ['B','E','H'];
const rateAt = a => { let r = AGE_DEP[0][1]; for (const [x,q] of AGE_DEP) if (a>=x) r=q; return r; };
const depFactor = a => { let d = 1; for (let t=0; t<a; t++) d *= 1-rateAt(t); return d; };
// Nuorin vuosimalli, jonka arvioitu hinta mahtuu budjettiin, tai null.
function fitBudget(c, budget){
  const r = findRow([c[1],c[2],c[6]||c[0]]); if (!r) return null;
  let [y0,y1] = String(r[5]).split('–').map(Number);
  if (c[5]) y1 = Math.min(y1, c[5]); // mallin valmistus päättyi (rekisterissä myöhempiä tuonteja)
  const minAge = Math.max(0, CUR_YEAR-y1), maxAge = CUR_YEAR-y0;
  for (let a=minAge; a<=maxAge; a++){ const v = c[4]*depFactor(a); if (v <= budget) return {c, r, age:a, price:Math.floor(v/100)*100}; }
  return {c, r, age:maxAge, price:Math.floor(c[4]*depFactor(maxAge)/100)*100, over:true};
}
function pickExample(slot, budget){

  const ok = opts.filter(o => !o.over);
  if (slot==='E') return ok.length ? ok.sort((a,b)=>b.r[4]-a.r[4])[0] : opts.sort((a,b)=>a.price-b.price)[0];
  // bensiini: nuorin budjettiin mahtuva Golf (tasatilanteessa bensiini-Golf); jos mikään ei mahdu, halvin
  if (slot==='B') return ok.length ? ok.sort((a,b)=>a.age-b.age)[0] : opts.sort((a,b)=>a.price-b.price)[0];
  return ok[0] || opts[opts.length-1];
}
