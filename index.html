<style>
/* Layout: tienvarsi – syötteet vasemmalla kapeana sarakkeena, tulokset leveänä oikealla; puhelimella pinossa */
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#16202a; --muted:#5b6873; --line:#d3dadf;
  --accent:#0b5cad;            /* tienviittojen sininen */
  --accent-ink:#ffffff;
  --input:#f6f8f9;
  --c1:#0b5cad; --c2:#d9822b; --c3:#2e8b57; --c4:#8a4fbf;
  --seg-dep:#16202a; --seg-cap:#6c7a86; --seg-en:#d9822b; --seg-oth:#b8c2ca;
  --seg-drive:#5a6b2f; --seg-make:#a9b98a;
  --good:#2e8b57;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e7edf2; --muted:#9aa8b4; --line:#2b3742;
  --accent:#4d9be6; --accent-ink:#06121e; --input:#121a21;
  --c1:#4d9be6; --c2:#f0a050; --c3:#4cc28a; --c4:#b78ae6;
  --seg-dep:#e7edf2; --seg-cap:#8b99a5; --seg-en:#f0a050; --seg-oth:#4a5966;
  --seg-drive:#a9c46a; --seg-make:#5d6d3c; --good:#4cc28a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e7edf2; --muted:#9aa8b4; --line:#2b3742;
  --accent:#4d9be6; --accent-ink:#06121e; --input:#121a21;
  --c1:#4d9be6; --c2:#f0a050; --c3:#4cc28a; --c4:#b78ae6;
  --seg-dep:#e7edf2; --seg-cap:#8b99a5; --seg-en:#f0a050; --seg-oth:#4a5966;
  --seg-drive:#a9c46a; --seg-make:#5d6d3c; --good:#4cc28a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:28px 20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.sign{width:44px;height:44px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 22px/1 var(--display);flex:none}
.brand h1{font-size:34px;line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.top .meta{color:var(--muted);font-size:13px;max-width:46ch}

.grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel+.panel{margin-top:16px}
.panel h2{font-size:20px;margin-bottom:12px}
.label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.unit{font-size:12px;color:var(--muted)}

.km{display:flex;flex-direction:column;gap:6px}
.km .read{display:flex;align-items:baseline;gap:8px}
.odo{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:.04em}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:500 12.5px/1 var(--body);border:1px solid var(--line);background:var(--input);color:var(--ink);padding:6px 9px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}

details.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.adv summary{cursor:pointer;font-weight:600;font-size:14px}
details.adv .fields{margin-top:10px}

/* autot */
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.car{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:4px solid var(--cc)}
.car .head{display:flex;align-items:center;gap:8px}
.car .head input{font-weight:600}
.car .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:6px}
.car .x:hover{color:var(--ink);background:var(--input)}
.car .fields{gap:9px}
.addcar{border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font:600 15px var(--body);cursor:pointer;min-height:120px}
.addcar:hover{border-color:var(--accent);color:var(--accent)}
.tag{font-size:11.5px;color:var(--muted)}

/* tulokset */
section.results{margin-top:24px}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sum .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.sum .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cc);flex:none}
.big{font:500 28px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.badge.win{border-color:var(--good);color:var(--good)}

.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:760px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.chart.wide{grid-column:1/-1}
.chart h3{font-size:19px}
.chart p.lead{margin:2px 0 10px;color:var(--muted);font-size:13.5px;max-width:70ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{font-family:var(--body)}
.svgbox{overflow-x:auto}

.notes{margin-top:24px;color:var(--muted);font-size:13px;max-width:90ch}
.notes h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.notes ul{padding-left:18px;margin:6px 0}
.notes a{color:var(--accent)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:600 13.5px var(--body);border:1px solid var(--line);background:var(--input);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.bar{transition:width .25s ease}}
.foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.foot a{color:var(--accent)}
.topright{display:flex;flex-direction:column;gap:10px;align-items:flex-end;max-width:46ch}
.langs{display:flex;gap:6px}
.lang{padding:5px 10px;font-size:13px}
.lang[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:700px){.topright{align-items:flex-start}}
</style>

const PT_DEF = { // oletukset käyttövoiman mukaan
  B:{fuel:6.0, kwh:0, share:0, tax:200, ins:600, serv:400, tyre:200, make:7, life:18, real:1.15},

const normB = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
// Asettaa auton kulutusoletukset mitatun datan mukaan
function applyRW(c, brandName, kwh, rwVal, rwN){
  const b = RW.brand[normB(brandName)] || {}, d = PT_DEF[c.pt];
  c.rw = null;
  if (c.pt==='B'||c.pt==='H'||c.pt==='D'){
    const k = c.pt==='D'?'D':'P';
    if (rwVal){ c.real = rwVal; c.rw = {t:'model', n:rwN}; }               // tämän mallin mitattu kulutus
    else if (b[k]){ c.real = +b[k][0].toFixed(2); c.rw = {t:'brand', brand:brandName, n:b[k][1]}; }
    else { c.real = +RW.fleet[k].k.toFixed(2); c.rw = {t:'fleet', n:RW.fleet[k].n}; }
  } else if (c.pt==='P'){
    const f = rwVal || (b.PE ? b.PE[0] : RW.fleet.PE.ob);
    c.share = 25; c.real = 1; c.fuel = +(f/0.75).toFixed(1); c.kwh = kwh ?? d.kwh;
    c.rw = {t:rwVal?'model':(b.PE?'brand':'fleet'), brand:brandName,
            n:rwVal?rwN:(b.PE?b.PE[1]:RW.fleet.PE.n), avg:f, kwhReg:kwh!=null};
  } else { c.kwh = kwh ?? d.kwh; c.real = d.real; c.rw = {t:'ev', kwhReg:kwh!=null}; }
}

// --- laskenta (sama malli kuin Excel-prototyypissä) ---
function calc(c, G, km){
  km = km ?? G.km;
  const n = G.years;
  const elShare = c.pt==='E'?1:(c.pt==='P'?Math.min(1,Math.max(0,c.share/100)):0);
  let rate;
  if (c.dep===''||c.dep===null||!isFinite(num(c.dep,NaN))){
    const mid = c.age + n/2; rate = AGE_DEP[0][1];
    for (const [a,r] of AGE_DEP) if (mid>=a) rate=r;
  } else rate = num(c.dep)/100;
  const kmAdj = Math.max(0, 1 - 0.002*Math.max(0,km-15000)/1000*n);
  const resid = Math.max(0, c.price*Math.pow(1-rate,n)*kmAdj);
  const dep = (c.price-resid)/n;
  const cap = (c.price+resid)/2*G.rate;
  const litres = km/100*c.fuel*c.real*(1-elShare);
  const kwh = km/100*c.kwh*c.real*elShare*(1+G.loss);
  const fuelPrice = c.pt==='D'?G.pD:G.pB, fuelEm = c.pt==='D'?G.eD:G.eB;
  const energy = litres*fuelPrice + kwh*G.pE;
  const other = c.other;
  const total = dep+cap+energy+other;
  const drive = litres*fuelEm + kwh*G.eEl;
  const make = c.life>0 ? c.make*1000/c.life : 0;
  return {rate,resid,dep,cap,energy,other,total,drive,make,em:drive+make,litres,kwh,
    endAge:c.age+n, endOdo:c.odo+km*n};
}

function hbars(el, rows, segs, unit){
  const W = 400, rowH = 40, top = 4, left = 128, right = 58;
  const H = top + rows.length*rowH + 4;
  const max = Math.max(1, ...rows.map(r => segs.reduce((s,k)=>s+r[k],0)));
  const sx = v => v/max*(W-left-right);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${unit}">`;
  rows.forEach((r,i) => {
    const y = top + i*rowH; let x = left;
    s += `<circle cx="10" cy="${y+16}" r="5" fill="${r.color}"/><text x="22" y="${y+20}" font-size="13" fill="var(--ink)">${esc(trunc(r.name,15))}</text>`;
    segs.forEach(k => { const w = sx(r[k]); if (w>0) s += `<rect x="${x}" y="${y+4}" width="${w}" height="24" fill="var(--seg-${k})" rx="2"><title>${esc(r.name)}: ${fmt(r[k])} ${unit}</title></rect>`; x += w; });
    const tot = segs.reduce((a,k)=>a+r[k],0);
    s += `<text x="${x+6}" y="${y+21}" font-size="13" font-family="var(--mono)" fill="var(--ink)">${fmt(tot)}</text>`;
  });
  el.innerHTML = s + '</svg>';
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function trunc(t,n){return t.length>n?t.slice(0,n-1)+'…':t;}

function breakEven(el, G){
  const W = 900, H = 320, L = 64, R = 20, T0 = 14, B = 40;
  const kms = []; for (let k=2000;k<=50000;k+=1000) kms.push(k);
  const series = cars.map((c,i) => ({c, color:COLORS[i], pts:kms.map(k=>calc(c,G,k).total)}));
  const all = series.flatMap(s=>s.pts);
  const ymax = Math.ceil(Math.max(...all)*1.05/1000)*1000, ymin = Math.max(0, Math.floor(Math.min(...all)*0.9/1000)*1000);
  const X = k => L + (k-2000)/(48000)*(W-L-R), Y = v => T0 + (1-(v-ymin)/(ymax-ymin||1))*(H-T0-B);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="${T('be_aria')}">`;
  const step = (ymax-ymin)/5 >= 2000 ? 2000 : 1000;
  for (let v=Math.ceil(ymin/step)*step; v<=ymax; v+=step){
    s += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="var(--muted)" font-family="var(--mono)">${fmt(v)}</text>`;
  }
  for (let k=5000;k<=50000;k+=5000) s += `<text x="${X(k)}" y="${H-B+18}" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="var(--mono)">${k/1000}k</text>`;
  s += `<text x="${(L+W-R)/2}" y="${H-4}" font-size="12" text-anchor="middle" fill="var(--muted)">${T('km_unit')}</text>`;
  s += `<text x="12" y="${T0+8}" font-size="12" fill="var(--muted)">€/${T('yr')}</text>`;
  s += `<line x1="${X(G.km)}" x2="${X(G.km)}" y1="${T0}" y2="${H-B}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".6"/><text x="${X(G.km)+6}" y="${T0+12}" font-size="12" fill="var(--ink)">${T('your_km')}</text>`;
  series.forEach(sr => {
    s += `<polyline fill="none" stroke="${sr.color}" stroke-width="2.5" points="${sr.pts.map((v,j)=>X(kms[j])+','+Y(v)).join(' ')}"/>`;
  });
  const cross = [];
  for (let a=0;a<series.length;a++) for (let b=a+1;b<series.length;b++){
    for (let j=1;j<kms.length;j++){
      const d0 = series[a].pts[j-1]-series[b].pts[j-1], d1 = series[a].pts[j]-series[b].pts[j];
      if (d0===0 || d0*d1<0){
        const t = d0/(d0-d1), k = kms[j-1]+t*1000, v = series[a].pts[j-1]+t*(series[a].pts[j]-series[a].pts[j-1]);
        cross.push({a,b,k,v}); s += `<circle cx="${X(k)}" cy="${Y(v)}" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"><title>${esc(cars[a].name)} ${T('and')} ${esc(cars[b].name)}: ${fmt(Math.round(k/100)*100)} km/${T('yr')}</title></circle>`;
      }
    }
  }
  el.innerHTML = s + '</svg>';
  return cross;
}

function rwText(c){
  const w = c.rw; if (!w) return '';
  if (w.t==='model' && c.pt!=='P') return T('rw_model')(fmt((c.real-1)*100), fmt(w.n));
  if (w.t==='model') return T('rw_model_phev')(fmt(w.avg,1), fmt(w.n)) + (w.kwhReg?T('rw_phev_kwh'):'');
  if (w.t==='brand' && c.pt!=='P') return T('rw_brand')(w.brand, fmt((c.real-1)*100), fmt(w.n));
  if (w.t==='fleet' && c.pt!=='P') return T('rw_fleet')(fmt((c.real-1)*100));
  if (c.pt==='P') return T('rw_phev')(w.t==='brand'?w.brand:'', fmt(w.avg,1), fmt(w.n)) + (w.kwhReg?T('rw_phev_kwh'):'');
  return w.kwhReg ? T('rw_ev_reg') : T('rw_ev_def');
}
function update(){
  const G = g(), yr = T('yr');
  $('kmOut').textContent = fmt(G.km);
  const R = cars.map(c => calc(c,G));
  const minCost = Math.min(...R.map(r=>r.total)), minEm = Math.min(...R.map(r=>r.em));
  $('sums').innerHTML = cars.map((c,i)=>{ const r=R[i];
    return `<div class="sum" style="--cc:${COLORS[i]}">
      <div class="nm"><span class="dot"></span><span title="${esc(c.name)}">${esc(c.name)}</span></div>
      <div><span class="big">${fmt(r.total)}</span> <span class="sub">€ / ${yr}</span></div>
      <div class="sub">${fmt(r.total/12)} €/${T('mo')} · ${fmt(r.total/G.km,2)} €/km</div>
      <div class="sub">${fmt(r.em)} kg CO₂e/${yr} · ${fmt(r.em*1000/G.km)} g/km</div>
      <div class="badges">${cars.length>1&&r.total===minCost?`<span class="badge win">${T('cheapest')}</span>`:''}${cars.length>1&&r.em===minEm?`<span class="badge win">${T('cleanest')}</span>`:''}</div>
    </div>`;}).join('');
  cars.forEach((c,i)=>{ const t=$('tag'+i); if(!t) return; const r=R[i];
    t.textContent = T('tag')(fmt(r.rate*100,0), fmt(r.endAge), fmt(r.endOdo), fmt(r.resid)) + (c.picked?T('reg')(fmt(c.picked[4]), c.picked[5]):'') + rwText(c); });
  const rows = cars.map((c,i)=>({name:c.name,color:COLORS[i],...R[i]}));
  hbars($('costChart'), rows.map(r=>({...r,en:r.energy,oth:r.other})), ['dep','cap','en','oth'], '€/'+yr);
  hbars($('emChart'), rows, ['drive','make'], 'kg CO₂e/'+yr);
  const cross = breakEven($('beChart'), G);
  if (cars.length<2){ $('beTitle').textContent=T('be_one_t'); $('beLead').textContent=T('be_one_l'); }
  else if (!cross.length){ const best = cars[R.indexOf(R.reduce((a,b)=>a.total<b.total?a:b))].name;
    $('beTitle').textContent = T('be_none_t')(best); $('beLead').textContent=T('be_none_l'); }
  else { const c0 = cross.sort((x,y)=>Math.abs(x.k-G.km)-Math.abs(y.k-G.km))[0];
    $('beTitle').textContent = T('be_x_t')(cars[c0.a].name, cars[c0.b].name, fmt(Math.round(c0.k/500)*500));
    $('beLead').textContent = T('be_x_l'); }
  save();
}

// --- kielen vaihto ---
function applyLang(lang){
  const prev = LANG; LANG = I18N[lang] ? lang : 'fi';
  try { localStorage.setItem('carfootprint.lang', LANG); } catch(e){}
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i]').forEach(el => { const v = T(el.dataset.i); if (typeof v === 'string') el.innerHTML = v; });
  document.querySelectorAll('.lang').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang===LANG)));
  cars.forEach(c => { if (c.exKey && c.name===I18N[prev][c.exKey]) c.name = T(c.exKey); });
  buildModels(); renderCars(); update();
}
document.querySelectorAll('.lang').forEach(b => b.onclick = () => applyLang(b.dataset.lang));

GIDS.forEach(id => $(id).addEventListener('input', update));
document.querySelectorAll('.chip').forEach(b => b.onclick = () => { $('km').value = b.dataset.km; update(); });
$('reset').onclick = () => { cars = EXAMPLES.map(newCar); renderCars(); update(); };

const saved = load();
if (saved && Array.isArray(saved.cars) && saved.cars.length){
  cars = saved.cars.map(c=>newCar({...c,brand:undefined})).map((c,i)=>Object.assign(c,{picked:saved.cars[i].picked}));
  try{ GIDS.forEach(id=>{ const v=saved.g?.[id]; if(v===undefined) return; if($(id).type==='select-one') $(id).selectedIndex=v; else $(id).value=v; }); }catch(e){}
} else cars = EXAMPLES.map(newCar);
applyLang(LANG);
</script>
