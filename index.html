const num = (v,def=0) => { const x = parseFloat(String(v).replace(',','.')); return isFinite(x)?x:def; };
// Syötteiden järkevyysrajat: arvo rajojen ulkopuolella (tai tyhjä pakollinen kenttä) näytetään kentän virheenä,
// eikä sitä käytetä laskennassa (laskenta käyttää edellistä kelvollista arvoa). Avain = auton kenttä (data-k) tai id.
const LIM = {price:[0,1e6], age:[0,60], odo:[0,2e6], dep:[0,100], fuel:[0.5,50], kwh:[5,60], share:[0,100],
  traf:[0,5000], kasko:[0,10000], other:[0,20000], serv:[0,20000], tax:[0,10000], real:[0.5,3], make:[0,100],

  km:[1000,300000], city:[0,100], tyreLvl:[30,150], servLvl:[30,200], years:[1,20], budget:[0,1e6], monthly:[0,1e5], own:[0,1e6], loanRate:[0,40], loanFee:[0,100],
  loanYears:[1,10], ownRate:[0,20], pBens:[0,10], pDies:[0,10], pEl:[0,2], loss:[0,100], eBens:[0,10], eDies:[0,10]};
const LIM_OPT = new Set(['dep','tax','soh','debtYears','monthly']); // tyhjä = automaattinen tai ei käytössä
function fieldOk(el){

// Yleisasetus laskentaan: kelvollinen arvo, muuten edellinen kelvollinen (tai HTML-oletus)
const gLast = {};
function gv(id, def){ const el = $(id);
  if (fieldOk(el)){ const v = num(el.value, def); gLast[id] = v; return v; }

// Asettaa kulutusoletukset rekisteririvistä ja auton iästä.
function fromRow(c, r){
  const d = PT_DEF[r[2]];
  c.fuel = r[3] ?? d.fuel; c.real = d.real; c.std = null;
  applyRW(c, r[0], r[7], r[9], r[10]);
  if (isNedc(c) && r[11] && r[11].length){
    const y = regYear(c), e = r[11].reduce((b,x)=>Math.abs(x[0]-y)<Math.abs(b[0]-y)?x:b);
    c.fuel = e[1]; c.real = +(1+nedcGap(e[0])).toFixed(2); c.std = {year:e[0]};
  }
  c.autoFuel = true;
}
// Ikä muuttui: päivitä kulutus, ellei käyttäjä ole itse muuttanut sitä.
function refreshStd(c){
  if (c.autoFuel === false || !'BDH'.includes(c.pt)) return;
  if (c.picked) return fromRow(c, c.picked);
  const d = PT_DEF[c.pt];
  if (isNedc(c)){ c.real = +(1+nedcGap(regYear(c))).toFixed(2); c.std = {year:regYear(c), manual:true}; }
  else { c.real = d.real; c.std = null; }
}
let cars = [];
function newCar(o={}){

  const c = {name:o.name||T('new_car'), exKey:null, ex:o.ex??null, exAuto:o.exAuto??false, pt, price:o.price??20000, age:o.age??0, odo:o.odo??0, dep:o.dep??'',
    fuel:o.fuel??d.fuel, kwh:o.kwh??d.kwh, share:o.share??d.share, other:o.other??TYRES.misc_eur, rim:o.rim??TYRES.default_rim, traf:o.traf??d.traf, kasko:o.kasko??kaskoDef(pt), serv:o.serv??d.serv, tax:o.tax??'', mass:o.mass??d.mass,
    make:o.make??d.make, batt:o.batt??d.batt, soh:o.soh??'', debt:o.debt??0, debtYears:o.debtYears??'', life:o.life??d.life, real:o.real??d.real, rw:o.rw??null};

  else if (o.brand) applyRW(c, o.brand, o.kwhReg);

// Hakukentän teksti: oma nimi näkyy otsikossa, jolloin hakukentässä on malli; muuten auton nimi
const modelName = c => c.picked ? `${c.picked[0]} ${c.picked[1]}` : '';
const pickText = c => (c.ownName && c.picked) ? modelName(c) : c.name;
let renaming = -1; // auto, jonka nimeä muokataan
// Valitun mallin hinta-arvio: arvo uutena (Verohallinnon verotusarvoista) × arvonalenema iän mukaan
const estPrice = (r, age) => { const v0 = MV0[CATALOG.indexOf(r)]; return v0 ? Math.floor(v0*depFactor(age)/100)*100 : 0; };
// Mallin valinta täyttää ikä-, hinta- ja mittarilukemakentät mallin mukaan, ellei käyttäjä ole itse kirjoittanut niitä:
// ikä = nuorin mallivuosi, jonka arvioitu hinta mahtuu enimmäishintaan (kuten esimerkkiautoissa), mittarilukema = ikä × mallin
// mediaaniajomäärä (Traficom). Jos arviota ei ole, ikä rajataan mallin vuosiin ja hinta jää ennalleen.
function autoPriceAge(c, r){
  const own = c.own || {}, [y0, y1] = String(r[5]).split('–').map(Number);
  const minAge = Math.max(0, CUR_YEAR - (y1||CUR_YEAR)), maxAge = Math.max(minAge, CUR_YEAR - (y0||CUR_YEAR));
  const budget = gv('budget', 0);
  if (!own.age){
    let a = Math.min(maxAge, Math.max(minAge, Math.round(c.age||0)));
    if (MV0[CATALOG.indexOf(r)] && budget > 0){
      a = maxAge;
      for (let x = minAge; x <= maxAge; x++) if (estPrice(r, x) <= budget){ a = x; break; }
    }
    c.age = a;
  }
  if (!own.price){ const v = estPrice(r, c.age); c.priceAuto = !!v; if (v) c.price = v; }
  if (!own.odo) c.odo = Math.round(c.age*(r[6]||14000)/1000)*1000;
}

// --- Ilman omaa autoa ---
// Taksin hinta 10 km:n esimerkkimatkalle: sovelluksella tilattu 13–20 € (Traficom 12.11.2024, yläraja), muuten tilattu
// Taksiliiton 30 suurimman välitysyhtiön mediaani 30,77 € alv 0 (Traficomin perustelumuistio 19.12.2024) + alv 13,5 %.
// Muiden pituuksien hinta suhteessa matkan pituuteen (oletus; lyhyillä matkoilla todellinen hinta on suhteessa suurempi).
const NC_TAXI10 = {app:20, call:34.92};
function ncCost(G, k){ // autoton vuosikulu ajomäärällä k, tai null jos jonkin kulkutavan hinta puuttuu
  const rows = NC.rows.map(r => ({...r, km: Math.max(0.1, num(r.km, NC_KM)), fixed: r.n!=='' && r.n!=null}));
  const fixedKm = rows.filter(r=>r.fixed).reduce((a,r)=>a + num(r.n,0)*r.km, 0), f = G.km > 0 ? k / G.km : 0;
  let sum = 0, pt = false, missing = [];
  for (const r of rows){
    const n = (r.fixed ? num(r.n,0) : Math.max(0, G.km - fixedKm)/r.km) * f;
    if (r.m==='taxi') sum += n * r.km/10 * NC_TAXI10[NC.book==='call'?'call':'app'];
    else if (r.m==='rent'){ if (NC.rent==='') missing.push('rent'); else sum += n * (num(NC.rent,0) + r.km*num(NC.rentKm,0)); }
    else if (r.m==='share'){ if (NC.share==='') missing.push('share'); else sum += n * (num(NC.share,0) + r.km*num(NC.shareKm,0)); }
    else if (r.m==='pt'){ if (NC.pt==='') missing.push('pt'); else pt = true; }
  }
  if (pt) sum += 12*num(NC.pt,0);
  return missing.length ? {missing:[...new Set(missing)]} : {total:sum};
}
const ncModes = () => ['taxi','rent','share','pt','walk'];

function ncUpdate(G){
  const out = $('ncOut'); if (!out || !$('nocar').open) return;
  const now = ncCost(G, G.km), yr = T('yr');
  if (now.missing){ out.innerHTML = `<p class="hint">${T('nc_missing')(now.missing.map(m=>T('nc_m_'+m)).join(', '))}</p>`; $('ncChart').innerHTML=''; return; }
  const R = cars.map(c => calc(c, G).total), best = R.indexOf(Math.min(...R));
  const kmax = Math.max(10000, Math.ceil(G.km*1.5/5000)*5000), step = kmax/100, ks = [];
  for (let k = step; k <= kmax+1; k += step) ks.push(k);
  const ncl = ks.map(k => ncCost(G, k).total), lines = cars.map(c => ks.map(k => calc(c, G, k).total));
  const cross = lines.map(pts => { for (let j=1;j<ks.length;j++){ const d0 = pts[j-1]-ncl[j-1], d1 = pts[j]-ncl[j];
      if (d0 > 0 && d1 <= 0) return ks[j-1] + d0/(d0-d1)*step; } return pts[0] <= ncl[0] ? 0 : null; });
  out.innerHTML = `<p class="ncsum">${T('nc_sum')(fmt(Math.round(now.total)), fmt(G.km))}</p>`
    + cars.map((c,i) => `<p><span class="dot" style="background:${COLORS[i]}"></span> ${esc(c.name)}: ${fmt(Math.round(R[i]))} € / ${yr} – `
      + (cross[i]===0 ? T('nc_always') : cross[i]==null ? T('nc_never')(fmt(kmax)) : T('nc_cross')(fmt(Math.round(cross[i]/100)*100))) + '</p>').join('')
    + `<p class="hint">${T('nc_note')}</p>`;
  // kaavio: omat autot ja autoton yhdistelmä ajomäärän mukaan
  const W = 900, H = 300, L = 64, Rr = 20, T0 = 14, B = 40, carMax = Math.max(...lines.flat());
  const ymax = Math.ceil(carMax*1.15/1000)*1000, X = k => L + k/kmax*(W-L-Rr), Y = v => T0 + (1 - Math.min(v, ymax*1.02)/ymax)*(H-T0-B);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="${T('nc_aria')}"><defs><clipPath id="ncClip"><rect x="${L}" y="${T0}" width="${W-L-Rr}" height="${H-T0-B}"/></clipPath></defs>`;

  for (let k=kmax/5; k<=kmax+1; k+=kmax/5) s += `<text x="${X(k)}" y="${H-B+18}" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="var(--mono)">${k/1000}k</text>`;
  s += `<text x="${(L+W-Rr)/2}" y="${H-4}" font-size="12" text-anchor="middle" fill="var(--muted)">${T('km_unit')}</text><text x="12" y="${T0+8}" font-size="12" fill="var(--muted)">€/${yr}</text>`;
  s += `<line x1="${X(G.km)}" x2="${X(G.km)}" y1="${T0}" y2="${H-B}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".6"/><text x="${X(G.km)+6}" y="${T0+12}" font-size="12" fill="var(--ink)">${T('your_km')}</text>`;
  s += `<g clip-path="url(#ncClip)">` + lines.map((pts,i) => `<polyline fill="none" stroke="${COLORS[i]}" stroke-width="2.5" points="${pts.map((v,j)=>X(ks[j])+','+Y(v)).join(' ')}"/>`).join('')
    + `<polyline fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="7 5" points="${ncl.map((v,j)=>X(ks[j])+','+Y(v)).join(' ')}"/></g>`;
  cross.forEach((k,i) => { if (k) s += `<circle cx="${X(k)}" cy="${Y(lines[i][Math.min(ks.length-1, Math.round(k/step)-1)])}" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>`; });
  s += `<text x="${W-Rr-4}" y="${T0+28}" font-size="12" text-anchor="end" fill="var(--ink)">- - ${T('nc_line')}</text>`;
  $('ncChart').innerHTML = s + '</svg>';
}

// --- Hae edullisin minun ajollani ---
// Kaikki mallit, joilla on hinta-arvio (MV0) ja vähintään FIND_MIN autoa rekisterissä: nuorin vuosimalli, joka mahtuu
// enimmäishintaan (sama kuin mallin valinnassa), laskettuna käyttäjän asetuksilla. Saman mallin versioista näytetään halvin.
const FIND_MIN = 200, FIND_N = 5;
function carFromRow(r){
  const c = newCar({pt:r[2], name:`${r[0]} ${r[1]}`});
  c.picked = r; autoPriceAge(c, r); fromRow(c, r); c.batt = battDef(r, r[2]); return c;
}
function findCheapest(G, pt){
  const best = new Map();
  CATALOG.forEach((r, k) => {
    if (!MV0[k] || (r[4]||0) < FIND_MIN || (pt && r[2]!==pt)) return;
    const c = carFromRow(r); if (G.budget > 0 && c.price > G.budget) return;
    const t = calc(c, G), key = `${r[0]} ${String(r[1]).split(' ')[0]} ${r[2]}`, o = best.get(key);
    if (!o || t.total < o.t.total) best.set(key, {r, c, t});
  });
  return [...best.values()].sort((a,b) => a.t.total - b.t.total);
}
function renderFinder(){
  const box = $('findRes'); if (!box || !$('finder').open) return;
  const G = g(), all = findCheapest(G, $('findPt').value), yr = T('yr'), full = cars.length >= 4;
  // nykyinen auto vertailukohdaksi: sen vuosikulu ja jokaisen tuloksen ero siihen
  const mc = cars.find(c => c.mine), mt = mc ? calc(mc, G).total : null;
  const diff = t => { const d = Math.round(t - mt); return mc ? ` <span class="diff${d < 0 ? ' better' : ''}">${d < 0 ? T('find_less')(fmt(-d)) : T('find_more')(fmt(d))}</span>` : ''; };
  const keep = Math.max(0, 4 - cars.filter(c => c.mine).length);
  box.innerHTML = !all.length ? `<p class="hint">${T('find_none')}</p>` :
    (mc ? `<p class="ref">${T('find_ref')(esc(mc.name), fmt(mt))}</p>` : '')
    + `<p class="hint">${T('find_n')(all.length, fmt(G.km), G.years, fmt(G.budget))}</p><ol class="findlist">` + all.slice(0, FIND_N).map((o,i) => {
      const thin = o.r[9]==null && o.r[2]!=='E';
      return `<li><span class="rk">${i+1}</span><div class="fn"><b>${esc(o.r[0]+' '+o.r[1])}</b> <span class="unit">${T('pt')[o.r[2]]}, ${T('find_my')(CUR_YEAR-o.c.age)}, ${T('find_price')(fmt(o.c.price))}${thin?' · '+T('find_thin'):''}</span></div>`
        + `<div class="fv"><span class="num">${fmt(o.t.total)} € / ${yr}</span>${diff(o.t.total)}<span class="unit">${fmt(o.t.em)} kg CO₂e / ${yr}</span></div>`
        + `<button class="btn sm" type="button" data-find="${CATALOG.indexOf(o.r)}"${full?' disabled':''}>${T('find_add')}</button></li>`; }).join('')
    + `</ol>${full ? `<p class="hint">${T('find_full')}</p>` : ''}`
    + `<button class="btn repl" type="button" id="findRepl">${T(mc ? 'find_repl_mine' : 'find_repl')(Math.min(keep, all.length))}</button>`;
}

// Korvaa vertailun muut autot edullisimmilla; nykyiseksi merkitty auto jää vertailukohdaksi
function replaceWithCheapest(){
  const all = findCheapest(g(), $('findPt').value), mine = cars.filter(c => c.mine), n = Math.min(4 - mine.length, all.length);

function suggest(inp){
  const i = inp.dataset.pick, box = $('sg'+i); if (!box) return;

  if (!words.length) return closeSugg(inp);

function cityRatio(c, fuel){

  return (own && m) ? m : fuel ? (CITY_R[c.pt==='E'?'B':c.pt] ?? CITY_R.B) : CITY_R.E;

const cityMix = (s, r) => (s*r + 1 - s)/(CITY0*r + 1 - CITY0);
function loanCost(P, r, fee, years, own){
  if (P <= 0) return {perYear:0, avgBal:0, pay:0};
  const N = Math.round(years*12), M = Math.round(own*12), i = r/12;
  const pay = i>0 ? P*i/(1-Math.pow(1+i,-N)) : P/N;
  let bal = P, interest = 0, fees = 0, balSum = 0;
  for (let m=0; m<M; m++){
    balSum += bal;
    if (bal <= 0) continue;
    const it = bal*i; interest += it; fees += fee; bal = Math.max(0, bal - (pay - it));
  }
  return {perYear:(interest+fees)/own, avgBal:balSum/M, pay:pay+fee};
}

function calc(c, G, km){
  km = km ?? G.km;
  const n = G.years;
  const elShare = c.pt==='E'?1:(c.pt==='P'?Math.min(1,Math.max(0,c.share/100)):0);
  let rate;
  if (c.dep===''||c.dep===null||!isFinite(num(c.dep,NaN))){
    const mid = c.age + n/2; rate = AGE_DEP[0][1];
    for (const [a,r] of AGE_DEP) if (mid>=a) rate=r;
  } else rate = num(c.dep)/100;
  const kmAdj = Math.max(0, 1 - 0.002*Math.max(0,km-15000)/1000*n);
  // G.residK: jälleenmyyntiarvon skenaario (1 = mallin tyypillinen arvo, RESALE.p25/p75 = puolet autoista tällä välillä)
  const resid = Math.max(0, c.price*Math.pow(1-rate,n)*kmAdj*(G.residK ?? 1));
  const dep = (c.price-resid)/n;
  // Rahoitus: tasaerälaina sille osalle, jota oma raha ei kata
  // Nykyinen auto: jäljellä oleva laina omalla laina-ajallaan. Muut: oma raha + nykyisen auton nettoarvo (vaihtohyvitys).
  const loan = c.mine ? Math.max(0, num(c.debt,0)) : Math.max(0, c.price - Math.max(0, G.own + (G.trade||0)));
  const L = loanCost(loan, G.loanRate, G.loanFee, c.mine ? (num(c.debtYears,0) || G.loanYears) : G.loanYears, n);
  const ownTied = Math.max(0, (c.price+resid)/2 - L.avgBal);
  const cap = L.perYear + ownTied*G.rate;
  const cs = G.city ?? CITY0;
  const litres = km/100*c.fuel*c.real*(1-elShare)*cityMix(cs, cityRatio(c, true));
  const kwh = km/100*c.kwh*c.real*elShare*(1+G.loss)*cityMix(cs, cityRatio(c, false));
  const fuelPrice = c.pt==='D'?G.pD:G.pB, fuelEm = c.pt==='D'?G.eD:G.eB;
  const energy = litres*fuelPrice + kwh*G.pE;
  const vt = vehicleTax(c), autoTax = c.tax===''||c.tax==null||!isFinite(num(c.tax,NaN));
  const tax = autoTax ? vt.total : num(c.tax);
  // G.excl: käyttäjä voi jättää huollon (s) tai renkaat ja muut (o) pois vertailusta (itse huoltava, käytetyt renkaat...)
  const ex = G.excl || '';
  const servF = servFactor(c.pt, Math.max(0,num(c.odo,0)), Math.max(0,num(c.odo,0)) + km*n), serv = ex.includes('s') ? 0 : num(c.serv,0)*servF*(G.servL ?? 1);
  const tyres = ex.includes('t') ? 0 : tyreCost(c, km)*(G.tyreL ?? 1); // renkaat (vannekoon ja hintatason mukaan)
  const tyre = ex.includes('o') ? 0 : num(c.other,0);   // muut kulut (pesu ym.)
  const ins = num(c.traf,0) + num(c.kasko,0); // liikennevakuutus + kasko
  const other = tyres + tyre + ins + tax + serv;
  const total = dep+cap+energy+other;
  const drive = litres*fuelEm + kwh*G.eEl;
  const makeT = num(c.make,0) + battT(c); // t CO2e: auto + akku
  const make = c.life>0 ? makeT*1000/c.life : 0;
  // Vaihtopäätöksen valmistuspäästö koko omistusajalta (kg): nykyinen auto 0 (valmistus on jo tapahtunut),
  // uusi auto (ikä < 1 v) koko valmistus, käytetty auto omistusvuosien osuus jäljellä olevasta käyttöiästä
  // (omistaja valitsi 2026-11-19 tämän epäedullisemman tavan; vaihtoehto 0 kerrotaan sivulla).
  const age0 = Math.max(0, num(c.age,0)), swMake = c.mine ? 0 : age0 < 1 ? makeT*1000 : makeT*1000*n/Math.max(n, num(c.life,0) - age0);
  // Kuukausimenot (kassavirta): lainaerä kuluineen + energia ja muut kulut kuukautta kohden.
  // Arvonalenema ja oman rahan tuotto eivät ole kuukausittaisia maksuja.
  const runMo = (energy+other)/12, cash = L.pay + runMo, cashAfter = (L.pay>0 && G.loanYears<n) ? runMo : null;
  return {ins,rate,resid,dep,cap,loan,pay:L.pay,cash,cashAfter,energy,other,tax,vt,autoTax,serv,servF,tyres,tyre,total,drive,make,makeT,em:drive+make,swMake,swEm:drive*n+swMake,litres,kwh,
    endAge:c.age+n, endOdo:c.odo+km*n};
}

function hbars(el, rows, segs, unit){

function breakEven(el, G){
  const W = 900, H = 320, L = 64, R = 20, T0 = 14, B = 40;
  const kmax = G.km <= 45000 ? 50000 : Math.min(300000, Math.ceil(G.km*1.2/10000)*10000), kstep = kmax/50;
  const kms = []; for (let k=kmax/25;k<=kmax+1;k+=kstep) kms.push(k);
  const series = cars.map((c,i) => ({c, color:COLORS[i], pts:kms.map(k=>calc(c,G,k).total)}));
  const all = series.flatMap(s=>s.pts);
  const ymax = Math.ceil(Math.max(...all)*1.05/1000)*1000, ymin = Math.max(0, Math.floor(Math.min(...all)*0.9/1000)*1000);
  const X = k => L + (k-kms[0])/(kmax-kms[0])*(W-L-R), Y = v => T0 + (1-(v-ymin)/(ymax-ymin||1))*(H-T0-B);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="${T('be_aria')}">`;
  const step = (ymax-ymin)/5 >= 2000 ? 2000 : 1000;
  for (let v=Math.ceil(ymin/step)*step; v<=ymax; v+=step){
    s += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="var(--muted)" font-family="var(--mono)">${fmt(v)}</text>`;
  }
  for (let k=kmax/10;k<=kmax+1;k+=kmax/10) s += `<text x="${X(k)}" y="${H-B+18}" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="var(--mono)">${k/1000}k</text>`;
  s += `<text x="${(L+W-R)/2}" y="${H-4}" font-size="12" text-anchor="middle" fill="var(--muted)">${T('km_unit')}</text>`;
  s += `<text x="12" y="${T0+8}" font-size="12" fill="var(--muted)">€/${T('yr')}</text>`;
  s += `<line x1="${X(G.km)}" x2="${X(G.km)}" y1="${T0}" y2="${H-B}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".6"/><text x="${X(G.km)+6}" y="${T0+12}" font-size="12" fill="var(--ink)">${T('your_km')}</text>`;
  series.forEach(sr => {
    s += `<polyline fill="none" stroke="${sr.color}" stroke-width="2.5" points="${sr.pts.map((v,j)=>X(kms[j])+','+Y(v)).join(' ')}"/>`;
  });
  const cross = [];
  for (let a=0;a<series.length;a++) for (let b=a+1;b<series.length;b++){
    for (let j=1;j<kms.length;j++){
      const d0 = series[a].pts[j-1]-series[b].pts[j-1], d1 = series[a].pts[j]-series[b].pts[j];
      if (d0===0 || d0*d1<0){
        const t = d0/(d0-d1), k = kms[j-1]+t*kstep, v = series[a].pts[j-1]+t*(series[a].pts[j]-series[a].pts[j-1]);
        cross.push({a,b,k,v}); s += `<circle cx="${X(k)}" cy="${Y(v)}" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"><title>${esc(cars[a].name)} ${T('and')} ${esc(cars[b].name)}: ${fmt(Math.round(k/100)*100)} km/${T('yr')}</title></circle>`;
      }
    }
  }
  el.innerHTML = s + '</svg>';
  cross.range = [kms[0], kmax];
  return cross;
}

// --- kääntöpisteet: lähin arvo, jolla halvin auto vaihtuu, kun yhtä asiaa muutetaan kerrallaan ---
const winnerOf = t => t.reduce((k, v, i) => v < t[k] - 1e-9 ? i : k, 0);
// f(x) -> halvimman auton indeksi. Hakee x0:sta kumpaankin suuntaan ensimmäisen vaihdon ja tarkentaa sen puolittamalla.
function tipSearch(f, x0, lo, hi, tol, integer){
  const w0 = f(x0), out = [];
  for (const dir of [-1, 1]){
    const end = dir < 0 ? lo : hi;
    if ((end - x0)*dir <= 0) continue;
    const steps = integer ? Math.abs(end - x0) : 48;
    let prev = x0;
    for (let s = 1; s <= steps; s++){
      const x = integer ? x0 + dir*s : x0 + (end - x0)*s/steps;
      if (f(x) === w0){ prev = x; continue; }
      let a = prev, b = x; // a: sama halvin, b: eri
      if (integer) while (Math.abs(b - a) > 1){ const m = Math.round((a + b)/2); if (f(m) === w0) a = m; else b = m; }
      else while (Math.abs(b - a) > tol){ const m = (a + b)/2; if (f(m) === w0) a = m; else b = m; }
      out.push({x:b, dir, w:f(b)}); break;
    }
  }
  return out;
}
function tipping(G){
  if (cars.length < 2) return null;
  const win = (G2, km) => winnerOf(cars.map(c => calc(c, G2, km).total));
  const uses = {pB: cars.some(c => 'BHP'.includes(c.pt)), pD: cars.some(c => c.pt==='D'), pE: cars.some(c => c.pt==='E' || c.pt==='P')};
  const rates = cars.map(c => calc(c, G).rate);
  const V = [{k:'km', x0:G.km, lo:1000, hi:Math.max(100000, G.km*2), tol:25, f:x => win(G, x)}];
  ['pB','pD','pE'].forEach(k => { if (uses[k] && G[k] > 0) V.push({k, x0:G[k], lo:G[k]/2, hi:G[k]*2, tol:0.0005, f:x => win({...G, [k]:x})}); });
  V.push({k:'years', x0:Math.round(G.years), lo:1, hi:20, int:true, f:x => win({...G, years:x})});
  V.push({k:'dep', x0:1, lo:0.5, hi:2, tol:0.002, f:x => winnerOf(cars.map((c,i) => calc({...c, dep:rates[i]*x*100}, G).total))});
  const tips = [];
  V.forEach(v => { const t = tipSearch(v.f, v.x0, v.lo, v.hi, v.tol, v.int)
    .map(o => ({...o, k:v.k, rel:Math.abs(o.x - v.x0)/v.x0})).sort((a,b) => a.rel - b.rel)[0];
    if (t) tips.push(t); });
  return tips.sort((a,b) => a.rel - b.rel).slice(0, 2);
}
// Pyöristys aina kääntöpisteen puolelle ("alle" alaspäin, "yli" ylöspäin); lähellä nykyistä tarkemmin
const roundTo = (x, step, dir) => (dir < 0 ? Math.floor(x/step) : Math.ceil(x/step))*step;

  else if (t.k==='years') s = T('sens_years')(t.dir, t.x);
  else if (t.k==='dep') s = T('sens_dep')(t.dir, fmt(Math.ceil(Math.abs(t.x - 1)*100)));
  else { const d = close ? 3 : 2; s = T('sens_p')(t.k, t.dir, fmt(roundTo(t.x, Math.pow(10,-d), t.dir), d)); }
  return `${s} (→ ${esc(cars[t.w].name)})`;
}

(() => {

    let cur = 0; bs.forEach((b,i) => { const t = $(b.dataset.go); if (t && t.getBoundingClientRect().top <= line + 40) cur = i; });

    else nav.classList.remove('hide');

(() => {

  const pick = () => { const y = ($('secnav') ? $('secnav').offsetHeight : 0) + 8;
    for (const x of [0.5, 0.25, 0.75]) { const e = document.elementFromPoint(innerWidth*x, y), el = e && e.closest(BLOCK);
      if (el) { const r = el.getBoundingClientRect(); return {el, f: r.height ? (y - r.top)/r.height : 0, y}; } }
    return null; };
  const restore = () => { if (!anchor || !anchor.el.isConnected) return;
    const r = anchor.el.getBoundingClientRect(); scrollBy(0, r.top + anchor.f*r.height - anchor.y); };
  addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(() => { if (innerWidth === w) anchor = pick(); }, 150); }, {passive:true});
  addEventListener('resize', () => { if (innerWidth === w) return; w = innerWidth; clearTimeout(t);

  return list.map(c=>ev<5 ? {...c, other:Math.max(0,num(c.other,0)-(OLD_TAX[c.pt]||0))} : c) // vero erotettiin muista kuluista
    .map(c=>ev<6 && PT_DEF[c.pt] ? {...c, other:Math.max(0,num(c.other,0)-PT_DEF[c.pt].serv)} : c) // samoin huolto (EX_VERSION 6)
    .map(c=>ev<7 ? (num(c.make,NaN)===OLD_MAKE[c.pt] ? {...c, make:undefined} : {...c, batt:0}) : c) // valmistus: akku erikseen (EX_VERSION 7)
    .map(c=>ev<8 ? splitIns(c) : c) // vakuutus omiksi kentikseen (EX_VERSION 8)
    .map(c=>ev===8 && PT_DEF[c.pt] ? {...c, // koskemattomat vanhat vakuutusoletukset uusiin (EX_VERSION 9)
      traf: num(c.traf,NaN)===200 ? PT_DEF[c.pt].traf : c.traf, kasko: num(c.kasko,NaN)===OLD_KASKO[c.pt] ? PT_DEF[c.pt].kasko : c.kasko} : c)
    .map(c=>{ if (ev>=10 || !(c.pt==='E'||c.pt==='P') || num(c.batt,NaN)!==PT_DEF[c.pt].batt) return c; // EX_VERSION 10: mallin akku
      const r = Array.isArray(c.picked) ? findRow(c.picked) : c.p ? findRow(c.p) : null; return r ? {...c, batt:battDef(r, c.pt)} : c; })
    // EX_VERSION 11: renkaat omaksi kuluksi. Koskematon vanha "renkaat ja muut" -oletus -> uusi muiden kulujen oletus ja
    // laskettu rengaskulu; itse kirjoitettu summa sisälsi jo renkaat, joten rengaskulu 0 (vannekoko "sisältyy muihin").
    .map(c=>ev<11 && PT_DEF[c.pt] ? (num(c.other,NaN)===PT_DEF[c.pt].tyre ? {...c, other:undefined} : {...c, rim:0}) : c);
}
const saved = load();
// Koskemattomat vanhat esimerkkiautot korvataan uusilla; omat autot säilyvät.
// PT_DEF.tyre = vanha "renkaat ja muut" -oletus (ennen EX_VERSION 11), käytetään vain vanhojen tallennusten tunnistamiseen.
const oldExamples = saved && saved.ev !== EX_VERSION && Array.isArray(saved.cars) && saved.cars.every(c => c.exKey || c.exAuto);
if (saved){ // asetukset ensin, jotta esimerkkiautot osataan valita enimmäishinnan mukaan
  const trustAll = (saved.ev||0) >= 4; // vanhemmissa tallennuksissa selain saattoi sekoittaa kenttien arvot
  try{ GIDS.forEach(id=>{ const v=saved.g?.[id]; if(v===undefined) return;
    if (!trustAll && id!=='km' && id!=='years') return;
    if (id in PRICE_DEF){ // oletushinta, jota ei ole muutettu -> käytä uusinta
      const wasDefault = (saved.d && String(v)===String(saved.d[id])) || OLD_DEFS.includes(String(v));
      if (wasDefault || v==='') return; }
    if ((OLD_RATE_DEFS[id]||[]).includes(String(v))) return; // vanha oletuskorko -> uusi oletus
    if($(id).type==='select-one') $(id).selectedIndex=v; else $(id).value=v; }); }catch(e){}
}
if (saved && Array.isArray(saved.cars) && saved.cars.length && !oldExamples)
  cars = migrateCars(saved.cars, saved.ev||0)
    .map(c=>newCar({...c,brand:undefined})).map((c,i)=>{ const p = saved.cars[i].picked; // tallennettu kopio -> luettelon rivi
      return Object.assign(c,{picked: Array.isArray(p) ? (findRow(p) || p) : null}); });
else cars = examples();

// --- jaettava linkki: asetukset ja autot linkin #-osaan (selain ei lähetä sitä palvelimelle) ---
// Linkin muoto 'y' (tiivis, luettava): y<versio>~<asetukset>~<auto>~<auto>...
//  asetukset: muutetut kentät, kirjain = GIDS-indeksi (a=km, b=years, ...) + arvo, erottimena _
//  auto: pohja + vain oletuksesta poikkeavat kentät (kirjain + arvo, erottimena _; U = kulutus muutettu käsin). Pohja on
//   eB/eE/eH  koskematon esimerkkiauto (syntyy uudelleen enimmäishinnasta)
//   xB/xE/xH  muokattu esimerkkiauto, pB3k7  rekisteristä valittu malli (rivi + tarkiste), nB  oma auto
//  Johdettuja kenttiä (todellinen kulutus, NEDC-tiedot, lähdeselitteet) ei tallenneta: ne lasketaan uudelleen.
// Vanhat linkit 'z' (pakattu JSON) ja 'j' (JSON) avautuvat edelleen.
const SHARE_KEYS = ['name','pt','price','age','odo','dep','fuel','kwh','share','other','rim','traf','kasko','serv','tax','mass','make','batt','soh','debt','debtYears','life','real','autoFuel','std','rw'];
const SHARE_F = {N:'name',P:'price',A:'age',O:'odo',D:'dep',K:'kwh',S:'share',X:'other',Q:'rim',Y:'traf',Z:'kasko',V:'serv',T:'tax',M:'mass',W:'make',B:'batt',H:'soh',G:'debt',J:'debtYears',L:'life',F:'fuel',R:'real'};
const SHARE_STR = ['name','dep','tax','soh','debtYears'];
const escS = t => encodeURIComponent(t).replace(/[!'()*_~]/g, ch => '%'+ch.charCodeAt(0).toString(16).toUpperCase()).replace(/\.$/,'%2E');
const decS = t => { try { return decodeURIComponent(t); } catch(e){ return t; } };
const numS = v => String(+(+v).toFixed(4));
const sameV = (a, b) => (typeof a==='number' && typeof b==='number') ? Math.abs(a-b) < 1e-9 : String(a??'')===String(b??'');
// Rekisteririvin tunniste: rivinumero (36-kanta) + 2 merkin tarkiste nimestä, jos luettelo on välillä muuttunut
const rowChk = r => { let h = 0; for (const ch of r[0]+'|'+r[1]+'|'+r[2]) h = (h*31 + ch.charCodeAt(0)) % 1296; return h.toString(36).padStart(2,'0'); };
const rowKey = r => CATALOG.indexOf(r).toString(36) + rowChk(r);
function rowFromKey(k){
  const chk = k.slice(-2), n = parseInt(k.slice(0,-2), 36), r = n >= 0 ? CATALOG[n] : null;
  return (r && rowChk(r)===chk) ? r : CATALOG.find(x => rowChk(x)===chk) || null;
}
// Auton pohja tunnisteesta; age = auton ikä ennen kuin kulutus lasketaan uudelleen
function shareBase(t, i, age){
  const k = t[0], v = t.slice(1), budget = num($('budget').value, 12000);
  let c = null;
  if ((k==='e'||k==='x') && SLOTS.includes(v)){ c = exampleCar(v, budget); if (k==='x') c.exAuto = false; }
  else if (k==='p'){ const r = rowFromKey(v); if (r) c = newCar({pick:[r[0],r[1],r[2]], name:`${r[0]} ${r[1]}`}); }
  else if (k==='n' && PT_DEF[v]) c = newCar({pt:v, name:T('car_n')+' '+(i+1)});
  if (c && age!==undefined && !sameV(+age, c.age)){ c.age = +age; refreshStd(c); }
  return c;
}
function carFromShare(tok, i, ver){
  const parts = tok.split('_'), f = {};
  parts.slice(1).forEach(x => { const key = SHARE_F[x[0]]; if (!key) return;
    const v = decS(x.slice(1)); f[key] = SHARE_STR.includes(key) ? v : num(v); });
  const c = shareBase(parts[0], i, f.age);
  if (!c) return null;
  if (parts[0][0]==='e') return c;
  // linkki ennen EX_VERSION 8: muutettu "muut kulut" sisälsi vakuutuksen
  if ((ver||0) < 8 && 'other' in f && !('traf' in f)){ f.traf = 0; f.kasko = 0; }
  // linkki ennen EX_VERSION 11: muutettu "renkaat ja muut" sisälsi renkaat
  if ((ver||0) < 11 && 'other' in f && !('rim' in f)) f.rim = 0;
  Object.entries(f).forEach(([key,v]) => { if (key!=='age') c[key] = v; });
  if (parts.includes('U')) c.autoFuel = false;
  if (parts.includes('C')){ c.mine = true; c.exAuto = false; }
  if ('name' in f && c.picked && f.name !== modelName(c)) c.ownName = true;
  ['price','age','odo'].forEach(k => { if (k in f) c.own = {...(c.own||{}), [k]:true}; }); // linkissä muutettu = oma arvo, ei arvio
  if ('price' in f) c.priceAuto = false;
  return c;
}
function carToShare(c, i){
  if (c.exAuto && c.ex) return 'e'+c.ex.slot;
  const budget = num($('budget').value, 12000);
  const base = (c.ex && c.picked && exampleCar(c.ex.slot, budget).picked===c.picked) ? 'x'+c.ex.slot
    : (c.picked && CATALOG.includes(c.picked)) ? 'p'+rowKey(c.picked) : 'n'+c.pt; // poistunut malli -> oma auto
  const b = shareBase(base, i, c.age), age0 = shareBase(base, i).age; // b: sama ikä, jotta johdetut kentät täsmäävät
  const toks = [base];
  Object.entries(SHARE_F).forEach(([l,key]) => {
    if (sameV(c[key], key==='age' ? age0 : b[key])) return;
    toks.push(l + (SHARE_STR.includes(key) ? escS(String(c[key]??'')) : numS(c[key])));
  });
  if (c.mine) toks.push('C'); // nykyinen auto
  if (c.autoFuel===false) toks.push('U'); // käyttäjä muutti kulutusta: ikä ei enää päivitä sitä
  return toks.join('_');
}
function shareState(){
  const g0 = {};
  GIDS.forEach(id => { const el = $(id);
    if (el.type==='select-one'){ const k = [...el.options].findIndex(o=>o.defaultSelected); if (el.selectedIndex !== (k<0?0:k)) g0[id] = el.selectedIndex; }
    else if (gRaw(el) !== el.defaultValue) g0[id] = gRaw(el); });
  return {v:EX_VERSION, g:g0, y:cars.map(carToShare)};
}
const b64u = bytes => { let t=''; bytes.forEach(b => t += String.fromCharCode(b)); return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u = t => Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')), ch => ch.charCodeAt(0));
async function pipe(bytes, stream){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function encodeShare(obj){
  if (obj.y) return 'y' + obj.v + '~' + Object.entries(obj.g).map(([id,v]) => String.fromCharCode(97+GIDS.indexOf(id)) + escS(String(v))).join('_') + '~' + obj.y.join('~');
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  try { if (window.CompressionStream) return 'z' + b64u(await pipe(raw, new CompressionStream('deflate-raw'))); } catch(e){}
  return 'j' + b64u(raw);
}
async function decodeShare(code){
  if (code[0]==='y'){
    const [v, g, ...y] = code.slice(1).split('~'), g0 = {};
    if (g) g.split('_').forEach(x => { const id = GIDS[x.charCodeAt(0)-97]; if (id) g0[id] = decS(x.slice(1)); });
    return {v:+v, g:g0, y};
  }
  let bytes = unb64u(code.slice(1));
  if (code[0]==='z') bytes = await pipe(bytes, new DecompressionStream('deflate-raw'));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function applyShared(st){
  defaultInputs();
  Object.entries(st.g||{}).forEach(([id,v]) => { const el = $(id); if (!el || !GIDS.includes(id)) return;
    if (el.type==='select-one') el.selectedIndex = +v; else el.value = v; });
  if (st.y){ cars = st.y.slice(0,4).map((t,i) => carFromShare(t, i, st.v)).filter(Boolean); return; }
  cars = migrateCars(st.c||[], st.v||0).slice(0,4).map(c => {
    const car = newCar({...c, brand:undefined, exAuto:false, ex:null});
    if (c.p){ const r = findRow(c.p); if (r) car.picked = r; }
    return car; });
}
// --- palaute ---
// FEEDBACK_URL tyhjä = osio piilossa. Lähetys vain napautuksesta; sivu ei lataa mitään muualta.
const FEEDBACK_URL = 'https://carfootprint-palaute.carfootprint.workers.dev/';
{ const fb = { id:null, key:null, vote:null, busy:false };
  const ver = () => (document.querySelector('.top .meta')?.textContent.match(/\d+\.\d+/) || [''])[0];
  async function fbPost(body){
    const r = await fetch(FEEDBACK_URL, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({...body, lang: document.documentElement.lang, version: ver(), website: $('fbWeb').value})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) throw new Error(d.error || r.status);
    return d;
  }
  const say = k => { $('fbMsg').textContent = T(k); };
  if (FEEDBACK_URL) $('fb').hidden = false;
  document.querySelectorAll('[data-vote]').forEach(b => b.onclick = async () => {
    if (fb.busy || fb.vote) return;
    fb.busy = true; say('fb_sending');
    try {
      const d = await fbPost({vote: b.dataset.vote});
      Object.assign(fb, {id:d.id, key:d.key, vote:b.dataset.vote});
      b.setAttribute('aria-pressed', 'true');
      document.querySelectorAll('[data-vote]').forEach(x => x.disabled = true);
      say('fb_thanks'); $('fbMore').hidden = false;
    } catch(e){ say(String(e.message)==='rate' ? 'fb_rate' : 'fb_err'); }
    fb.busy = false;
  });
  $('fbMore').onsubmit = async ev => {
    ev.preventDefault();
    const text = $('fbText').value.trim(), wantLink = $('fbLink').checked;
    if (fb.busy || (!text && !wantLink)) return;
    fb.busy = true; $('fbSend').disabled = true; say('fb_sending');
    try {
      const link = wantLink ? 'https://tapiot1986.github.io/CarFootprint/#s=' + await encodeShare(shareState()) : '';
      await fbPost(fb.id ? {id:fb.id, key:fb.key, text, link} : {text, link});
      $('fbMore').hidden = true; $('fbText').value = ''; say('fb_sent');
    } catch(e){ say(String(e.message)==='rate' ? 'fb_rate' : 'fb_err'); $('fbSend').disabled = false; }
    fb.busy = false;
  };
}
$('share').onclick = async () => {
  const url = location.origin + location.pathname + '#s=' + await encodeShare(shareState());
  const msg = $('shareMsg'); msg.textContent = '';
  if (navigator.share && matchMedia('(pointer:coarse)').matches){
    try { await navigator.share({title:document.title, text:T('share_text'), url}); return; }
    catch(e){ if (e.name==='AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); msg.textContent = T('share_ok'); }
  catch(e){ // leikepöytä ei käytettävissä: näytä linkki valmiiksi valittuna kenttänä
    const inp = document.createElement('input'); inp.readOnly = true; inp.value = url; inp.className = 'sharelink';
    inp.setAttribute('aria-label', T('share_copy')); msg.append(T('share_copy') + ' ', inp); inp.focus(); inp.select();
  }
};
// Avattiin jaettu linkki: näytä se, mutta säilytä avaajan omat autot palautettaviksi
(async () => {
  const m = /^#s=([jz][A-Za-z0-9_-]+|y[A-Za-z0-9_.~%-]+)$/.exec(location.hash);
  if (!m) return;
  let st; try { st = await decodeShare(m[1]); } catch(e){ return; }
  if (!st || !(Array.isArray(st.y) ? st.y : st.c) || !(st.y || st.c).length) return;
  history.replaceState(null, '', location.pathname + location.search);
  let prev = null; try { prev = localStorage.getItem('carfootprint.v1'); if (prev) localStorage.setItem('carfootprint.v1.prev', prev); } catch(e){}
  applyShared(st); renderCars(); update();
  const msg = $('shareMsg'); msg.textContent = T('share_loaded') + ' ';
  if (prev){ const b = document.createElement('button'); b.type = 'button'; b.className = 'btn sm'; b.textContent = T('share_restore');
    b.onclick = () => { try { localStorage.setItem('carfootprint.v1', prev); localStorage.removeItem('carfootprint.v1.prev'); } catch(e){} location.reload(); };
    msg.append(b); }
})();
applyLang(LANG);
// Puhelimet näyttävät usein välimuistissa olevaa vanhaa sivua (esim. palautettu välilehti).
// Haetaan sivu palvelimelta ohi välimuistin; jos versio on uudempi, ladataan sivu uudelleen.
// Autot ja asetukset säilyvät, koska ne ovat localStoragessa.
let freshAt = 0;
async function checkFresh(){
  if (!/^https?:$/.test(location.protocol) || Date.now() - freshAt < 60000) return;
  freshAt = Date.now();
  try {
    const r = await fetch(location.pathname, {cache:'reload'});
    const m = /const BUILD = '([0-9a-f]{12})'/.exec(await r.text());
    if (!m || m[1] === BUILD) return;
    let tried = null; try { tried = sessionStorage.getItem('carfootprint.reload'); sessionStorage.setItem('carfootprint.reload', m[1]); } catch(e){}
    if (tried !== m[1]) location.reload();
  } catch(e){}
}
checkFresh();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkFresh(); });
window.addEventListener('pageshow', e => { if (e.persisted) checkFresh(); });
